name: Tag a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0 (the tag will be v<version>)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "CUPLAJ-${VERSION}.apk"
          gh release create "v${VERSION}" "CUPLAJ-${VERSION}.apk" \
            --draft --prerelease --target "${GITHUB_SHA}" \
            --title "CUPLAJ ${VERSION}" \
            --notes "See CHANGELOG.md. Untested on physical devices at the time of release; see docs/AUDIT.md (open items)."
