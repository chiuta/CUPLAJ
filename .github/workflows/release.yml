name: Tag a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0 (the tag will be v<version>)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build APK
        env:
          KS_B64: ${{ secrets.CUPLAJ_KEYSTORE_BASE64 }}
          CUPLAJ_KEYSTORE_PASSWORD: ${{ secrets.CUPLAJ_KEYSTORE_PASSWORD }}
          CUPLAJ_KEY_ALIAS: ${{ secrets.CUPLAJ_KEY_ALIAS }}
          CUPLAJ_KEY_PASSWORD: ${{ secrets.CUPLAJ_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/cuplaj.jks"
            export CUPLAJ_KEYSTORE="$RUNNER_TEMP/cuplaj.jks"
            echo "Signing with the release keystore"
          else
            echo "::warning::No keystore secret: signing with the debug key (Play Protect will warn)"
          fi
          ./gradlew assembleRelease --no-daemon
      - name: Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "CUPLAJ-${VERSION}.apk"
          gh release create "v${VERSION}" "CUPLAJ-${VERSION}.apk" \
            --draft --prerelease --target "${GITHUB_SHA}" \
            --title "CUPLAJ ${VERSION}" \
            --notes "See CHANGELOG.md. Untested on physical devices at the time of release; see docs/AUDIT.md (open items)."
