name: iOS
on:
  push:
    paths: ["ios/**", "app/src/main/assets/i18n.tsv", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version && xcodebuild -version
      - name: Core tests - P2P
        timeout-minutes: 4
        working-directory: ios
        run: swift test --filter P2pTests
      - name: Core tests - rest
        timeout-minutes: 8
        working-directory: ios
        run: swift test --parallel --skip P2pTests
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build app for simulator
        working-directory: ios
        run: |
          xcodebuild -project Cuplaj.xcodeproj -scheme Cuplaj -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -n 150
          exit ${PIPESTATUS[0]}
