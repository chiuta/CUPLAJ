": "parla", "busy": "segnale di occupato", "hears": "ascolta", "click": "*clic*", "ring_long": "uno squillo lungo", "ring_short": "due squilli brevi", "log": "Registro", "reset": "Azzera", "line": "linea", "eras": "Tre epoche", "coffee": "Offrimi un caffè", "rights": "Licenza MIT", "plat": "App Android (APK) · app iPhone/iPad compilata dai sorgenti con Xcode — stesso protocollo, si mescolano nello stesso spettacolo.", "get_ios": "Scarica per iPhone/iPad (.ipa)", "all_rel": "Tutte le versioni", "ios_dl": "L'.ipa non è firmato: installalo con AltStore o Sideloadly usando il tuo Apple ID (uno gratuito dura 7 giorni) oppure compilalo con Xcode. Android: scarica l'APK.", "m_shots": "Schermate", "m_note": "Illustrazioni disegnate sui concetti e sul layout dell'app. Non sono catture da un telefono reale.", "m_clips": "Dimostrazioni delle funzioni", "m_sc": ["Spettatore: chiamata in arrivo", "Attore: linee e copione", "Regia: cue, contatore, linee", "Copione: lista dei cue", "CUPLAJ-AIR: senza rete", "Sondaggio: risultato live"], "m_cl": [["Linea condivisa", "A1 chiama B1; B1 squilla lungo, B2 (stessa linea) breve; A2 ascolta; la regia interviene."], ["Cue", "I cue di squillo, sussurro, buio e suono raggiungono tutti i telefoni."], ["CUPLAJ-AIR", "Luce, suono e vibrazione portano un cue senza rete."], ["Sondaggi", "Il pubblico vota e la regia vede il risultato dal vivo."]], "dg": {"t1": "Cosa è stato davvero verificato", "cols": ["Test automatici", "Build", "Telefoni reali"], "leg": ["Fatto", "Parziale (solo formati, pacchetti o canali simulati)", "Non fatto"], "rows": ["Logica dell'hub: chiamate, linea condivisa, limiti", "Schermate e audio Android", "Rete: cifratura, P2P, SIP, SMS", "Bluetooth, Wi‑Fi Direct, mDNS", "Plug and play, inviti", "CUPLAJ‑AIR: luce, suono, vibrazione", "Regia dello spettacolo (1.5)", "Media, OSC, impianto voce (1.6)", "Zone, regole, contatore (1.7)", "Art‑Net, MIDI, giochi col pubblico (1.8)", "App iPhone e iPad"], "t2": "A che punto è ogni passo", "steps": ["Codice scritto", "Test automatici superati (JVM e macOS)", "Build in CI (APK, simulatore iOS)", "Release pubblicata (APK, IPA non firmato)", "Provato su alcuni telefoni reali", "Prova e spettacolo dal vivo"]}, "review": "Recensione onesta e confronto"}, "roles": [["🎭", "Spettatori", "Il tuo telefono diventa un telefono degli anni ’80.", "Installi una sola app, non crei account e non dai i tuoi dati a nessuno. Lo spettacolo ti chiama, ti sussurra, ti manda una lettera sullo schermo — e ti lascia chiamare lo sconosciuto accanto a te.", ["Entra con un tocco su un link d'invito — può arrivarti anche con luce o suono.", "Scegli la tua epoca: disco rotante, tastiera o primo cellulare.", "Rispondi quando squilla — la cadenza dice a chi è rivolta.", "Vota, sussurra, risolvi segreti con chi ti sta intorno."], ["Senza account", "8 lingue", "Testo grande, risposta a schermo bloccato"], "«Non voltarti.»"], ["🎬", "Attori", "Una linea privata con la squadra, in tasca.", "Entri con il PIN della squadra, ricevi un numero 2xx e senti il canale dietro le quinte senza uscire dal personaggio. Chiami spettatori, vieni chiamato e ricevi indicazioni che senti solo tu.", ["Inserisci il PIN una volta; la regia ti riconosce per nome.", "Senti i cue dalle quinte dall'altoparlante o come voce parlata.", "Chiami uno spettatore per numero — da personaggio, vecchio amico, sconosciuto.", "Ascolti l'impianto e la squadra senza lasciare la scena."], ["PIN squadra", "Canale quinte", "Indicazioni parlate"], "Quinte: «Porta tra 10 s.»"], ["🎛️", "Host / Admin (Regia)", "Un solo telefono gestisce tutta la centrale.", "Il telefono della regia è l'hub e il direttore di scena. Lo avvii, dai il PIN e dirigi: numeri, gruppi, un copione con GO, regole che reagiscono al pubblico, un misuratore di rumore e un rapporto dal vivo.", ["Avvia l'hub su hotspot, Wi‑Fi, Bluetooth o Wi‑Fi Direct.", "Accoppia spettatori su linee condivise o ascolta in silenzio.", "Lancia cue nello stesso istante, a onda, con regole e zone.", "Premi PANICO o luci di sala; esporta il rapporto."], ["Copione + GO", "Regole e zone", "PANICO"], "GO ▶  cue 12 · 213 online"], ["🔧", "Squadra tecnica", "Parla la lingua dei mixer luci e audio.", "Collega CUPLAJ al tuo impianto: OSC in entrata e uscita per i mixer, Art‑Net / DMX per le luci, MIDI per l'audio, e quando l'host parla all'impianto voce, gli altri suoni si abbassano da soli.", ["Invia universi DMX con dissolvenze da una riga come 0;1=255;2000.", "Fai partire cue dal mixer via OSC, con eco di ritorno.", "Invia note MIDI, controller e MMC a un dispositivo USB o Bluetooth.", "Usa un gateway SIP o SMS tramite la SIM del telefono della regia."], ["OSC", "Art‑Net / DMX", "MIDI"], "0;1=255,2-4=128;2000"], ["🏛️", "Organizzatori e sale", "Niente cloud, niente account, niente infrastruttura.", "Tutto gira sul Wi‑Fi della sala o su un hotspot, e i cue possono ancora viaggiare con luce, suono e vibrazione se la rete cade. Decidi tu cosa viene registrato: niente, a meno che scegli il registratore fantasma o il rapporto.", ["Installa l'APK su ogni telefono; open source, licenza MIT.", "Sicurezza integrata: cue PANICO e schermo bianco di sala.", "Accessibile: 8 lingue, testo regolabile, sottotitoli, risposta a schermo bloccato.", "Leggi audit e confronto prima di impegnarti — dicono cosa manca."], ["Licenza MIT", "Offline", "Cue di sicurezza"], "Wi‑Fi della sala · senza internet"], ["🧩", "Sviluppatori", "Un piccolo protocollo documentato.", "Frame `type|len|payload` su TCP, chiavi per connessione e limiti pubblicati. Tutto è testato, verificato e aperto a estensioni.", ["Leggi PROTOCOL.md: messaggi, limiti, cifratura, pacchetti CUPLAJ‑AIR.", "Esegui i test su qualunque JVM — hub, protocollo e codec AIR inclusi.", "La CI compila APK e documentazione a ogni push.", "Fai un fork, aggiungi un tipo di cue, invia una pull request."], ["PROTOCOL.md", "Test JVM", "Open source"], "type|len|payload"]], "rs": {"who": "Per chi è?", "who_sub": "Scegli il tuo posto nello spettacolo.", "step": "La tua serata", "gets": "Cosa ottieni", "guide": "Apri la guida", "stats": ["lingue", "tipi di cue", "account o cloud", "verifiche automatiche"], "honest": "Nota onesta: provata con oltre 250 verifiche automatiche e un audit avversario, ma non ancora su una flotta di telefoni reali — fai prima una prova."}, "kinds": 24, "checks": 250}, "es": {"name": "Español", "tag": "Telefonía de línea compartida para teatro inmersivo", "ver": "Versión: 1.9.0 · Última actualización: 2026-11-25", "intro": "CUPLAJ convierte una flota de teléfonos Android corrientes en una centralita telefónica privada para teatro inmersivo. Organizadores y actores hablan con el público (y entre sí) por el Wi‑Fi local del recinto — sin nube, sin cuentas, sin anuncios. Su función distintiva es el *cuplaj*: la **línea compartida** de los teléfonos fijos desde los años 80 hasta cerca de 2006, en la que dos abonados compartían una línea, sonaban con cadencias distintas y podían oírse el uno al otro.", "h_feat": "Funciones", "feat": ["**Tres épocas de teléfono** — 1985 disco rotatorio (pulsos audibles), 1995 teclado (tonos DTMF), 2003 móvil (SMS, 160 caracteres). La regiduría puede cambiar de época en directo.", "**Línea compartida (cuplaj)** — dos teléfonos comparten una línea; una llamada a uno hace sonar ambos con la cadencia del abonado llamado; el vecino que descuelga primero se lleva la llamada; descolgar durante la conversación del vecino permite escuchar e incluso intervenir.", "**Sin infraestructura** — un teléfono (la regiduría) es el hub. Los demás entran por Wi‑Fi o por su punto de acceso; los hubs se encuentran solos; código de sala y PIN opcionales.", "**Voz** — llamadas reales (8 kHz), megafonía pulsar‑para‑hablar desde la regiduría, canal de bambalinas para el equipo.", "**Señales** — texto a pantalla completa, vibración, timbre, flash, altavoz, cambio de época, contacto nuevo, voz hablada (síntesis local), efectos de sonido, pantalla negra, llamada fantasma.", "**Guion** — lista de señales con GO y PLAY (temporizado), reordenar, importar/exportar JSON.", "**Herramientas de regiduría** — números, grupos, acoplar/desacoplar, parejas automáticas, escucha discreta, silenciar, olvidar, niveles de batería, registro de eventos, estado que sobrevive a reinicios, limitación de flujo.", "**8 idiomas y accesibilidad** — inglés, rumano, francés, italiano, español, portugués, alemán, húngaro; tamaño de texto ajustable; respuesta desde la pantalla de bloqueo; funciona en segundo plano.", "**Internet y datos móviles (1.1)** — conexión con `host` o `host:puerto`; clave de red AES‑128‑GCM opcional; compresión G.711 automática fuera de la red local; keepalive.", "**Llamadas directas P2P (1.1)** — el audio va de teléfono a teléfono por UDP con perforación de NAT, con respaldo en el relé del hub; la regiduría puede desactivarlo, limitarlo a la red local (por defecto) o abrirlo a cualquier lugar.", "**Pasarela VoIP / SIP (1.1)** — el teléfono de la regiduría se registra en un proveedor SIP o una PBX; el equipo marca `0`+número para salir, las llamadas SIP entrantes suenan en un número interno.", "**Red móvil (1.1)** — pasarela SMS mediante la SIM del teléfono de la regiduría (envío y recepción), cue de *llamada real* que abre el marcador e indicador Wi‑Fi / móvil.", "**Más formas de conectarse (1.2)** — Bluetooth (sin router, unos 7 teléfonos), Wi‑Fi Direct (el teléfono de la regiduría crea su propia red Wi‑Fi) y descubrimiento mDNS, además de Wi‑Fi, punto de acceso, anclaje USB, Ethernet y datos móviles.", "**Plug and play (1.3)** — el teléfono de la regiduría abre solo todos los enlaces útiles; los demás pulsan *Buscar y unirme automáticamente* o un enlace de invitación. Añade Wi‑Fi Aware.", "**Reforzado y sin red (1.4)** — auditoría con público hostil y correcciones, y CUPLAJ‑AIR: tres protocolos originales que llevan señales e invitaciones sin ninguna red (linterna → cámara, altavoz → micrófono, vibración → acelerómetro).", "**Control del espectáculo (1.5)** — señales que saltan en el mismo instante, señal PÁNICO, color a pantalla completa, encuestas al público, confirmación de entrega y tecla PTT física. Comparado con Unity Intercom, Zello, Augmented Theatre, QLab/SOLOstudio y Livecube en `docs/COMPARISON.md`.", "**Todo lo de la comparación que cabe en una app solo Android sin conexión (1.6)** — prioridad PA (ducking), OSC de entrada y salida para mesas de luces y sonido, y señales con imagen, vídeo y clip de audio enviadas por el hub.", "**Espectáculo inteligente (1.7)** — zonas que siguen al público por sonido, reglas («cuando alguien entre en la zona 3, envíale…»), contador de público, efectos de voz, subtítulos, texto multilingüe y personalizado, ramificación de la historia.", "**Herramientas de escena (1.8)** — luces Art‑Net/DMX, MIDI, ola de señales, teléfono descompuesto, secreto fragmentado, grabadora fantasma, señal de seguridad (luces de sala), Morse por vibración, informe posfunción.", "**iPhone y iPad** — cliente completo y anfitrión (regiduría) en Swift, mismo protocolo que Android: ambos se mezclan libremente en una misma función; se compila desde el código con Xcode (`ios/`)."], "h_quick": "Inicio rápido", "quick": ["Obtén el APK en la pestaña *Actions* (artefacto `CUPLAJ-apk`) o en la página *Releases* e instálalo en cada teléfono.", "En el teléfono de la regiduría activa el punto de acceso (o pon todos los teléfonos en el mismo Wi‑Fi).", "En el teléfono de la regiduría elige **Regiduría** → *Iniciar el hub*. Anota el PIN de los actores y, si quieres, un código de sala.", "En los demás elige **Espectador** o **Actor**, selecciona el hub de la lista (o escribe su dirección) y conéctate.", "Cada teléfono recibe un número (regiduría 100, actores 201…, espectadores 6 cifras). Descuelga y llama."], "h_eras": "Épocas: tres en la app, tres imaginadas", "eras": ["**1985 · disco** — un disco que se gira de verdad; los pulsos se oyen; dos timbrazos largos.", "**1995 · teclas** — tonos DTMF, libreta de números, mensajes de busca.", "**2003 · móvil** — nombres en la agenda, identificación de llamada, SMS limitados a 160 caracteres.", "**2025 · smartphone** — *concepto, aún no está en la app.* Burbujas de chat, notas de voz, confirmaciones de lectura y notificaciones push; siempre conectado, nada suena mucho tiempo.", "**2045 · dispositivos vestibles** — *imaginado.* Sin teléfono: llamadas susurradas en auriculares, rostros como etiquetas flotantes en las gafas, un cabeceo para contestar.", "**2080 · mente compartida** — *imaginado.* Ningún aparato: la línea compartida se vuelve un pensamiento que se escucha a escondidas, y la privacidad es la trama."], "h_party": "Cómo funciona la línea compartida", "party": ["La regiduría *acopla* dos teléfonos (o lo hace automáticamente por parejas). Comparten la línea N, posiciones 1 y 2.", "Una llamada al abonado 1 hace sonar ambos; el abonado 1 oye la cadencia de su número (un timbrazo largo), el abonado 2 la suya (dos cortos).", "Quien contesta se lleva la llamada; el otro teléfono deja de sonar.", "Mientras la línea está en uso, el vecino que descuelga oye la conversación y los interlocutores oyen un leve clic.", "Quien escucha puede *intervenir* y hablar; una llamada a un teléfono acoplado cuya línea está ocupada recibe el tono de ocupado.", "La regiduría puede vigilar cualquier línea en silencio (sin clic)."], "h_docs": "Documentación", "docs": {"guide": "Guía de uso", "protocol": "Protocolo", "audit": "Auditoría adversarial", "changelog": "Registro de cambios", "site": "Sitio de presentación"}, "h_status": "Estado real", "status": "La lógica del hub (llamadas, línea compartida, permisos, límites, persistencia) está cubierta por más de 250 comprobaciones automáticas que se ejecutan en una JVM. La interfaz Android y la ruta de audio han pasado la comprobación de tipos frente al SDK de Android 14, pero **aún no se han probado en dispositivos reales**; el APK lo construye GitHub Actions. Prueba con unos pocos teléfonos antes de la función. El tráfico de la red local no está cifrado (el PIN y el código de sala frenan a extraños de buena fe, no son criptografía). La red de la versión 1.1 (cifrado, P2P, SIP, SMS) está cubierta por pruebas del hub contra un servidor SIP simulado, pero **no** se ha probado con operadores, NAT ni SIM reales. Los enlaces Bluetooth, Wi‑Fi Direct y mDNS (1.2) comparten la misma capa de transporte, probada en JVM con canales simulados, pero **no** se han probado en dispositivos reales; el comportamiento varía entre fabricantes. El plug and play (conexión automática, invitaciones, Wi‑Fi Aware, 1.3) **no** se ha probado en dispositivos; el formato de las invitaciones está cubierto por pruebas JVM. Las correcciones de la auditoría 1.4 y los códecs AIR están cubiertos por pruebas JVM (ruido simulado, deriva de reloj, clave errónea, interferencia); el código de linterna, cámara, micrófono, altavoz, motor y acelerómetro **no** está probado en teléfonos reales, y el alcance y la velocidad reales serán distintos. Las funciones 1.5 están cubiertas por pruebas JVM (estimación del reloj, retrasos, reglas de la encuesta, límites fotosensibles); las superposiciones de pantalla, el botón del auricular y la precisión real del reloj **no** están probados en dispositivos. Las funciones 1.6 están cubiertas por pruebas JVM (curva de ducking, fuzzing e inundación OSC, integridad de transferencias y seguridad de rutas, relé del hub); la reproducción de imágenes, vídeo y clips, el selector de archivos y los diálogos de ajustes **no** están probados en dispositivos. Zonas, reglas, contador, efectos de voz e idiomas están cubiertos por pruebas JVM (motor de reglas, reglas del hub, agregación del contador, filtros de voz medidos en frecuencia); las balizas sonoras reales en interiores, las mediciones con micrófono y acelerómetro y la calidad de voz en teléfonos **no** están probadas en dispositivos. Una baliza grabada puede reproducirse una vez por número de secuencia: las zonas son para ambientar, no para seguridad. Paquetes Art‑Net, fundidos DMX, mensajes MIDI, patrones Morse, informe y lógica del hub (ola, teléfono descompuesto, secreto, informe) están cubiertos por pruebas JVM; la grabadora fantasma, mesas de luces y dispositivos MIDI reales y todo lo que implique teléfonos reales no están probados. **iOS:** el núcleo Swift se prueba en macOS en CI y la app compila para el simulador, pero **no se ha probado en iPhone reales ni con un proveedor SIP real**.", "h_priv": "Privacidad", "priv": "Sin analítica, sin servidores, sin cuentas. El audio y los mensajes solo viajan por vuestra red local, entre los teléfonos y el hub. El hub guarda números, grupos y acoplamientos en el teléfono de la regiduría para que un reinicio no los pierda.", "h_support": "Apoya el proyecto", "h_lic": "Licencia", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Guía de uso", "s": {"hero": "La línea compartida, de vuelta al escenario.", "sub": "Una centralita telefónica privada para teatro inmersivo, hecha con los teléfonos que tu público ya lleva en el bolsillo.", "get": "Descargar el APK", "repo": "Código fuente en GitHub", "demo": "Prueba la línea compartida", "demo_hint": "Los teléfonos A1 y A2 comparten la línea 1; B1 y B2 la línea 2.", "call": "llama", "answer": "Contestar", "hangup": "Colgar", "listen": "Escuchar", "intervene": "Intervenir", "idle": "libre", "ringing": "suena", "talking": "habla", "busy": "tono de ocupado", "hears": "escucha", "click": "*clic*", "ring_long": "un timbrazo largo", "ring_short": "dos timbrazos cortos", "log": "Registro", "reset": "Reiniciar", "line": "línea", "eras": "Tres épocas", "coffee": "Invítame a un café", "rights": "Licencia MIT", "plat": "App Android (APK) · app de iPhone/iPad compilada desde el código con Xcode — mismo protocolo, se mezclan en una misma función.", "get_ios": "Descargar para iPhone/iPad (.ipa)", "all_rel": "Todas las versiones", "ios_dl": "El .ipa no está firmado: instálalo con AltStore o Sideloadly usando tu Apple ID (uno gratuito dura 7 días) o compílalo con Xcode. Android: descarga el APK.", "m_shots": "Pantallas", "m_note": "Ilustraciones dibujadas según los conceptos y el diseño de la app. No son capturas de un teléfono real.", "m_clips": "Demostraciones de funciones", "m_sc": ["Espectador: llamada entrante", "Actor: líneas y guion", "Regiduría: señales, contador, líneas", "Guion: lista de señales", "CUPLAJ-AIR: sin red", "Encuesta: resultado en vivo"], "m_cl": [["Línea compartida", "A1 llama a B1; B1 suena largo, B2 (misma línea) corto; A2 escucha; la regiduría interviene."], ["Señales", "Las señales de timbre, susurro, apagón y sonido llegan a todos los teléfonos."], ["CUPLAJ-AIR", "Luz, sonido y vibración llevan una señal sin red."], ["Encuestas", "El público vota y la regiduría ve el resultado en vivo."]], "dg": {"t1": "Lo que se ha verificado de verdad", "cols": ["Pruebas automáticas", "Compilaciones", "Teléfonos reales"], "leg": ["Hecho", "Parcial (solo formatos, paquetes o canales simulados)", "No hecho"], "rows": ["Lógica del hub: llamadas, línea compartida, límites", "Pantallas y audio de Android", "Red: cifrado, P2P, SIP, SMS", "Bluetooth, Wi‑Fi Direct, mDNS", "Plug and play, invitaciones", "CUPLAJ‑AIR: luz, sonido, vibración", "Control de la función (1.5)", "Medios, OSC, megafonía (1.6)", "Zonas, reglas, contador (1.7)", "Art‑Net, MIDI, juegos con el público (1.8)", "App de iPhone e iPad"], "t2": "Hasta dónde ha llegado cada paso", "steps": ["Código escrito", "Pruebas automáticas superadas (JVM y macOS)", "Compilaciones en CI (APK, simulador iOS)", "Versión publicada (APK, IPA sin firmar)", "Probado en unos pocos teléfonos reales", "Ensayo y función en directo"]}, "review": "Reseña honesta y comparación"}, "roles": [["🎭", "Espectadores", "Tu teléfono se convierte en un teléfono de los 80.", "Instalas una sola app, no creas cuenta y no das tus datos a nadie. El espectáculo te llama, te susurra, te manda una carta en pantalla — y te deja llamar al desconocido de al lado.", ["Entra con un toque en un enlace de invitación — puede llegarte incluso por luz o sonido.", "Elige tu época: disco giratorio, teclado o primer móvil.", "Contesta cuando suene — la cadencia dice para quién es.", "Vota, susurra y resuelve secretos con quienes te rodean."], ["Sin cuenta", "8 idiomas", "Texto grande, respuesta con pantalla bloqueada"], "«No mires atrás.»"], ["🎬", "Actores", "Una línea privada con el equipo, en el bolsillo.", "Entras con el PIN del equipo, recibes un número 2xx y oyes el canal de bambalinas sin salir del personaje. Llamas a espectadores, te llaman y recibes indicaciones que solo tú oyes.", ["Introduce el PIN una vez; regiduría te reconoce por tu nombre.", "Oye las señales de bambalinas por altavoz o como voz hablada.", "Llama a un espectador por número — como personaje, viejo amigo, extraño.", "Escucha la megafonía y al equipo sin dejar la escena."], ["PIN del equipo", "Canal bambalinas", "Indicaciones habladas"], "Bambalinas: «Puerta en 10 s.»"], ["🎛️", "Anfitrión / Admin (Regiduría)", "Un solo teléfono dirige toda la centralita.", "El teléfono de regiduría es el hub y el director de escena. Lo inicias, das el PIN y diriges: números, grupos, un guion con GO, reglas que reaccionan al público, un medidor de ruido y un informe en vivo.", ["Inicia el hub en punto de acceso, Wi‑Fi, Bluetooth o Wi‑Fi Direct.", "Acopla espectadores en líneas compartidas o escucha en silencio.", "Lanza señales en el mismo instante, en ola, por reglas y zonas.", "Pulsa PÁNICO o luces de sala; exporta el informe."], ["Guion + GO", "Reglas y zonas", "PÁNICO"], "GO ▶  señal 12 · 213 en línea"], ["🔧", "Equipo técnico", "Habla el idioma de las mesas de luces y sonido.", "Conecta CUPLAJ a tu equipo: OSC de entrada y salida para mesas, Art‑Net / DMX para luces, MIDI para sonido, y cuando el anfitrión habla por megafonía, el resto del sonido baja solo.", ["Envía universos DMX con fundidos desde una línea como 0;1=255;2000.", "Lanza señales desde tu mesa por OSC, con eco de vuelta.", "Envía notas MIDI, controladores y MMC a un dispositivo USB o Bluetooth.", "Usa una pasarela SIP o SMS con la SIM del teléfono de regiduría."], ["OSC", "Art‑Net / DMX", "MIDI"], "0;1=255,2-4=128;2000"], ["🏛️", "Organizadores y salas", "Sin nube, sin cuentas, sin infraestructura.", "Todo funciona en el Wi‑Fi de la sala o un punto de acceso, y las señales aún pueden viajar por luz, sonido y vibración si cae la red. Tú decides qué se graba: nada, salvo que elijas la grabadora fantasma o el informe.", ["Instala el APK en cada teléfono; código abierto, licencia MIT.", "Seguridad integrada: señal PÁNICO y pantalla blanca de sala.", "Accesible: 8 idiomas, texto ajustable, subtítulos, respuesta con pantalla bloqueada.", "Lee la auditoría y la comparación antes de comprometerte: dicen lo que falta."], ["Licencia MIT", "Sin conexión", "Señales de seguridad"], "Wi‑Fi de la sala · sin internet"], ["🧩", "Desarrolladores", "Un protocolo pequeño y documentado.", "Tramas `type|len|payload` sobre TCP, claves por conexión y límites publicados. Todo está probado, auditado y abierto a ampliaciones.", ["Lee PROTOCOL.md: mensajes, límites, cifrado, paquetes CUPLAJ‑AIR.", "Ejecuta las pruebas en cualquier JVM — hub, protocolo y códecs AIR incluidos.", "La CI compila el APK y la documentación en cada push.", "Haz un fork, añade un tipo de señal, envía un pull request."], ["PROTOCOL.md", "Pruebas JVM", "Código abierto"], "type|len|payload"]], "rs": {"who": "¿Para quién es?", "who_sub": "Elige tu lugar en el espectáculo.", "step": "Tu noche", "gets": "Lo que obtienes", "guide": "Abrir la guía", "stats": ["idiomas", "tipos de señal", "cuentas o nube", "comprobaciones automáticas"], "honest": "Nota sincera: probada con más de 250 comprobaciones automáticas y una auditoría adversarial, pero aún no en una flota de teléfonos reales — haz antes un ensayo."}, "kinds": 24, "checks": 250}, "pt": {"name": "Português", "tag": "Telefonia de linha partilhada para teatro imersivo", "ver": "Versão: 1.9.0 · Última atualização: 2026-11-25", "intro": "O CUPLAJ transforma uma frota de telemóveis Android comuns numa central telefónica privada para teatro imersivo. Organizadores e atores falam com os espectadores (e entre si) pela rede Wi‑Fi local do espaço — sem nuvem, sem contas, sem anúncios. A sua função distintiva é o *cuplaj*: a **linha partilhada** dos telefones fixos dos anos 80 até cerca de 2006, em que dois assinantes partilhavam a mesma linha, tocavam com cadências diferentes e podiam ouvir-se um ao outro.", "h_feat": "Funcionalidades", "feat": ["**Três épocas de telefone** — 1985 disco rotativo (impulsos audíveis), 1995 teclado (tons DTMF), 2003 telemóvel (SMS, 160 carateres). A régie pode mudar de época em direto.", "**Linha partilhada (cuplaj)** — dois telefones partilham uma linha; uma chamada para um faz tocar ambos com a cadência do assinante chamado; o vizinho que atender primeiro fica com a chamada; levantar o auscultador durante a conversa do vizinho permite ouvir e até intervir.", "**Sem infraestrutura** — um telefone (a régie) é o hub. Os outros entram por Wi‑Fi ou pelo hotspot do hub; os hubs são encontrados automaticamente; código de sala e PIN opcionais.", "**Voz** — chamadas reais (8 kHz), anúncio premir‑para‑falar a partir da régie, canal de bastidores para a equipa.", "**Sinais** — texto em ecrã inteiro, vibração, toque, flash, altifalante, mudança de época, novo contacto, voz falada (síntese local), efeitos sonoros, ecrã preto, chamada fantasma.", "**Guião** — lista de sinais com GO e PLAY (temporizado), reordenar, importar/exportar JSON.", "**Ferramentas da régie** — números, grupos, acoplar/desacoplar, pares automáticos, escuta discreta, silenciar, esquecer, níveis de bateria, registo de eventos, estado que sobrevive a reinícios, limitação de fluxo.", "**8 idiomas e acessibilidade** — inglês, romeno, francês, italiano, espanhol, português, alemão, húngaro; tamanho do texto ajustável; atender a partir do ecrã bloqueado; funciona em segundo plano.", "**Internet e dados móveis (1.1)** — ligação com `host` ou `host:porta`; chave de rede AES‑128‑GCM opcional; compressão G.711 automática fora da rede local; keepalive.", "**Chamadas diretas P2P (1.1)** — o áudio vai de telemóvel a telemóvel por UDP com perfuração de NAT, com recurso ao relé do hub; a régie pode desligar, limitar à rede local (predefinição) ou abrir a qualquer lado.", "**Porta VoIP / SIP (1.1)** — o telemóvel da régie regista‑se num fornecedor SIP ou PBX; a equipa marca `0`+número para sair, as chamadas SIP recebidas tocam num número interno.", "**Rede móvel (1.1)** — porta SMS através do SIM do telemóvel da régie (envio e receção), cue de *chamada real* que abre o marcador e indicador Wi‑Fi / móvel.", "**Mais formas de ligação (1.2)** — Bluetooth (sem router, cerca de 7 telemóveis), Wi‑Fi Direct (o telemóvel da régie cria a sua própria rede Wi‑Fi) e descoberta mDNS, além de Wi‑Fi, hotspot, partilha por USB, Ethernet e dados móveis.", "**Plug and play (1.3)** — o telemóvel da régie abre sozinho todas as ligações úteis; os outros tocam em *Encontrar e juntar‑me automaticamente* ou num link de convite. Acrescenta Wi‑Fi Aware.", "**Reforçado e sem rede (1.4)** — auditoria com público hostil e correções, e CUPLAJ‑AIR: três protocolos originais que levam sinais e convites sem qualquer rede (lanterna → câmara, altifalante → microfone, vibração → acelerómetro).", "**Controlo do espetáculo (1.5)** — sinais que disparam no mesmo instante, sinal PÂNICO, cor em ecrã inteiro, sondagens ao público, confirmação de entrega e tecla PTT física. Comparado com Unity Intercom, Zello, Augmented Theatre, QLab/SOLOstudio e Livecube em `docs/COMPARISON.md`.", "**Tudo o que a comparação mostrava e cabe numa app só Android sem ligação (1.6)** — prioridade PA (ducking), OSC de entrada e saída para mesas de luz e som, e sinais com imagem, vídeo e clipe de áudio enviados pelo hub.", "**Espetáculo inteligente (1.7)** — zonas que seguem o público pelo som, regras («quando alguém entra na zona 3, envia‑lhe…»), contador de público, efeitos de voz, legendas, texto multilingue e personalizado, ramificação da história.", "**Ferramentas de cena (1.8)** — luzes Art‑Net/DMX, MIDI, onda de sinais, telefone estragado, segredo fragmentado, gravador fantasma, sinal de segurança (luzes de sala), Morse por vibração, relatório pós‑espetáculo.", "**iPhone e iPad** — cliente completo e anfitrião (régie) em Swift, mesmo protocolo do Android: os dois misturam‑se livremente no mesmo espetáculo; compila‑se a partir do código com o Xcode (`ios/`)."], "h_quick": "Início rápido", "quick": ["Obtém o APK no separador *Actions* (artefacto `CUPLAJ-apk`) ou na página *Releases* e instala-o em cada telemóvel.", "No telemóvel da régie ativa o hotspot (ou põe todos os telemóveis no mesmo Wi‑Fi).", "No telemóvel da régie escolhe **Régie** → *Iniciar o hub*. Anota o PIN dos atores e, se quiseres, um código de sala.", "Nos outros escolhe **Espectador** ou **Ator**, seleciona o hub na lista (ou escreve o endereço) e liga-te.", "Cada telemóvel recebe um número (régie 100, atores 201…, espectadores 6 dígitos). Levanta o auscultador e chama."], "h_eras": "Épocas: três na app, três imaginadas", "eras": ["**1985 · disco** — um disco que se roda a sério; os impulsos ouvem-se; dois toques longos.", "**1995 · teclas** — tons DTMF, caderneta de números, mensagens de pager.", "**2003 · telemóvel** — nomes na agenda, identificação de chamadas, SMS limitados a 160 carateres.", "**2025 · smartphone** — *conceito, ainda não está na app.* Balões de chat, mensagens de voz, confirmações de leitura e notificações push; sempre ligado, nada toca por muito tempo.", "**2045 · dispositivos vestíveis** — *imaginado.* Sem telefone: chamadas sussurradas em auriculares, rostos como etiquetas flutuantes nos óculos, um aceno de cabeça para atender.", "**2080 · mente partilhada** — *imaginado.* Nenhum aparelho: a linha partilhada torna-se um pensamento que se escuta às escondidas, e a privacidade é o enredo."], "h_party": "Como funciona a linha partilhada", "party": ["Dois telefones são *acoplados* pela régie (ou automaticamente em pares). Partilham a linha N, posições 1 e 2.", "Uma chamada para o assinante 1 faz tocar ambos; o assinante 1 ouve a cadência do seu número (um toque longo), o assinante 2 a do seu (dois curtos).", "Quem atende fica com a chamada; o outro telefone deixa de tocar.", "Enquanto a linha está em uso, o vizinho que levanta o auscultador ouve a conversa e os interlocutores ouvem um leve clique.", "Quem escuta pode *intervir* e falar; uma chamada para um telefone acoplado cuja linha está ocupada recebe o sinal de ocupado.", "A régie pode monitorizar qualquer linha em silêncio (sem clique)."], "h_docs": "Documentação", "docs": {"guide": "Guia de utilização", "protocol": "Protocolo", "audit": "Auditoria adversarial", "changelog": "Registo de alterações", "site": "Site de apresentação"}, "h_status": "Estado real", "status": "A lógica do hub (chamadas, linha partilhada, permissões, limites, persistência) está coberta por mais de 250 verificações automáticas executadas numa JVM. A interface Android e o caminho de áudio passaram a verificação de tipos contra o SDK Android 14, mas **ainda não foram testados em dispositivos reais**; o APK é construído pelo GitHub Actions. Testa com alguns telemóveis antes de um espetáculo. O tráfego da rede local não é cifrado (o PIN e o código de sala afastam estranhos de boa‑fé, não são criptografia). A rede da versão 1.1 (cifra, P2P, SIP, SMS) está coberta por testes do hub contra um servidor SIP simulado, mas **não** foi experimentada em operadores, NAT ou SIM reais. As ligações Bluetooth, Wi‑Fi Direct e mDNS (1.2) partilham a mesma camada de transporte, testada em JVM com canais simulados, mas **não** foram experimentadas em dispositivos reais; o comportamento varia entre fabricantes. O plug and play (ligação automática, convites, Wi‑Fi Aware, 1.3) **não** foi testado em dispositivos; o formato dos convites é coberto por testes JVM. As correções da auditoria 1.4 e os codecs AIR estão cobertos por testes JVM (ruído simulado, deriva de relógio, chave errada, interferência); o código de lanterna, câmara, microfone, altifalante, motor e acelerómetro **não** está testado em telemóveis reais, e o alcance e a velocidade reais serão diferentes. As funções 1.5 estão cobertas por testes JVM (estimativa do relógio, atrasos, regras da sondagem, limites fotossensíveis); as sobreposições de ecrã, o botão do auricular e a precisão real do relógio **não** estão testados em dispositivos. As funções 1.6 estão cobertas por testes JVM (curva de ducking, fuzzing e inundação OSC, integridade das transferências e segurança dos caminhos, relé do hub); a reprodução de imagens, vídeo e clipes, o seletor de ficheiros e as caixas de definições **não** estão testados em dispositivos. Zonas, regras, contador, efeitos de voz e línguas estão cobertos por testes JVM (motor de regras, regras do hub, agregação do contador, filtros de voz medidos em frequência); as balizas sonoras reais em interiores, as medições com microfone e acelerómetro e a qualidade da voz em telemóveis **não** estão testadas em dispositivos. Uma baliza gravada pode ser reproduzida uma vez por número de sequência: as zonas servem para ambiente, não para segurança. Pacotes Art‑Net, fades DMX, mensagens MIDI, padrões Morse, relatório e lógica do hub (onda, telefone estragado, segredo, relatório) estão cobertos por testes JVM; o gravador fantasma, mesas de luz e dispositivos MIDI reais e tudo o que envolva telemóveis reais não estão testados. **iOS:** o núcleo Swift é testado em macOS na CI e a app compila para o simulador, mas **não foi testada em iPhones reais nem com um fornecedor SIP real**.", "h_priv": "Privacidade", "priv": "Sem estatísticas, sem servidores, sem contas. O áudio e as mensagens circulam apenas na vossa rede local, entre os telemóveis e o hub. O hub guarda números, grupos e acoplamentos no telemóvel da régie para que um reinício não os perca.", "h_support": "Apoia o projeto", "h_lic": "Licença", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Guia de utilização", "s": {"hero": "A linha partilhada, de volta ao palco.", "sub": "Uma central telefónica privada para teatro imersivo, feita com os telemóveis que o público já traz no bolso.", "get": "Descarregar o APK", "repo": "Código‑fonte no GitHub", "demo": "Experimenta a linha partilhada", "demo_hint": "Os telefones A1 e A2 partilham a linha 1; B1 e B2 a linha 2.", "call": "chama", "answer": "Atender", "hangup": "Desligar", "listen": "Escutar", "intervene": "Intervir", "idle": "livre", "ringing": "toca", "talking": "fala", "busy": "sinal de ocupado", "hears": "escuta", "click": "*clique*", "ring_long": "um toque longo", "ring_short": "dois toques curtos", "log": "Registo", "reset": "Repor", "line": "linha", "eras": "Três épocas", "coffee": "Oferece‑me um café", "rights": "Licença MIT", "plat": "App Android (APK) · app iPhone/iPad compilada a partir do código com o Xcode — mesmo protocolo, misturam‑se no mesmo espetáculo.", "get_ios": "Descarregar para iPhone/iPad (.ipa)", "all_rel": "Todas as versões", "ios_dl": "O .ipa não está assinado: instala‑o com o AltStore ou o Sideloadly usando o teu Apple ID (um gratuito dura 7 dias) ou compila‑o com o Xcode. Android: descarrega o APK.", "m_shots": "Ecrãs", "m_note": "Ilustrações desenhadas a partir dos conceitos e do layout da app. Não são capturas de um telemóvel real.", "m_clips": "Demonstrações das funções", "m_sc": ["Espectador: chamada recebida", "Ator: linhas e guião", "Régie: sinais, contador, linhas", "Guião: lista de sinais", "CUPLAJ-AIR: sem rede", "Sondagem: resultado em direto"], "m_cl": [["Linha partilhada", "A1 liga a B1; B1 toca longo, B2 (mesma linha) curto; A2 escuta; a régie intervém."], ["Sinais", "Os sinais de toque, sussurro, apagão e som chegam a todos os telemóveis."], ["CUPLAJ-AIR", "Luz, som e vibração levam um sinal sem rede."], ["Sondagens", "O público vota e a régie vê o resultado em direto."]], "dg": {"t1": "O que foi realmente verificado", "cols": ["Testes automáticos", "Compilações", "Telemóveis reais"], "leg": ["Feito", "Parcial (apenas formatos, pacotes ou canais simulados)", "Não feito"], "rows": ["Lógica do hub: chamadas, linha partilhada, limites", "Ecrãs e áudio do Android", "Rede: cifragem, P2P, SIP, SMS", "Bluetooth, Wi‑Fi Direct, mDNS", "Plug and play, convites", "CUPLAJ‑AIR: luz, som, vibração", "Controlo do espetáculo (1.5)", "Multimédia, OSC, sonorização (1.6)", "Zonas, regras, contador (1.7)", "Art‑Net, MIDI, jogos com o público (1.8)", "App iPhone e iPad"], "t2": "Até onde foi cada passo", "steps": ["Código escrito", "Testes automáticos aprovados (JVM e macOS)", "Compilações na CI (APK, simulador iOS)", "Versão publicada (APK, IPA não assinado)", "Testado em alguns telemóveis reais", "Ensaio e espetáculo ao vivo"]}, "review": "Revisão honesta e comparação"}, "roles": [["🎭", "Espectadores", "O teu telemóvel torna‑se um telefone dos anos 80.", "Instalas uma só app, não crias conta e não dás os teus dados a ninguém. O espetáculo toca‑te, sussurra‑te, manda‑te uma carta no ecrã — e deixa‑te ligar ao desconhecido ao lado.", ["Entra com um toque num link de convite — pode chegar‑te até por luz ou som.", "Escolhe a tua época: disco rotativo, teclado ou primeiro telemóvel.", "Atende quando tocar — a cadência diz a quem se destina.", "Vota, sussurra e resolve segredos com quem está à volta."], ["Sem conta", "8 idiomas", "Texto grande, resposta com ecrã bloqueado"], "«Não olhes para trás.»"], ["🎬", "Atores", "Uma linha privada com a equipa, no bolso.", "Entras com o PIN da equipa, recebes um número 2xx e ouves o canal dos bastidores sem sair da personagem. Ligas a espectadores, recebes chamadas e indicações que só tu ouves.", ["Introduz o PIN uma vez; a regia conhece‑te pelo nome.", "Ouve os sinais dos bastidores no altifalante ou em voz falada.", "Liga a um espectador pelo número — como personagem, velho amigo, estranho.", "Ouve o sistema de som e a equipa sem sair de cena."], ["PIN da equipa", "Canal bastidores", "Indicações faladas"], "Bastidores: «Porta em 10 s.»"], ["🎛️", "Anfitrião / Admin (Regia)", "Um só telemóvel conduz toda a central.", "O telemóvel da regia é o hub e o diretor de palco. Inicia‑o, dá o PIN e dirige: números, grupos, um guião com GO, regras que reagem ao público, um medidor de ruído e um relatório em direto.", ["Inicia o hub em hotspot, Wi‑Fi, Bluetooth ou Wi‑Fi Direct.", "Acopla espectadores em linhas partilhadas ou ouve em silêncio.", "Dispara sinais no mesmo instante, em onda, por regras e zonas.", "Carrega em PÂNICO ou luzes de sala; exporta o relatório."], ["Guião + GO", "Regras e zonas", "PÂNICO"], "GO ▶  sinal 12 · 213 online"], ["🔧", "Equipa técnica", "Fala a língua das mesas de luz e som.", "Liga o CUPLAJ ao teu equipamento: OSC de entrada e saída para mesas, Art‑Net / DMX para luzes, MIDI para som, e quando o anfitrião fala no sistema de som, o restante som baixa sozinho.", ["Envia universos DMX com fades a partir de uma linha como 0;1=255;2000.", "Dispara sinais da tua mesa por OSC, com eco de volta.", "Envia notas MIDI, controladores e MMC para um dispositivo USB ou Bluetooth.", "Usa um gateway SIP ou SMS com o cartão SIM do telemóvel da regia."], ["OSC", "Art‑Net / DMX", "MIDI"], "0;1=255,2-4=128;2000"], ["🏛️", "Organizadores e salas", "Sem nuvem, sem contas, sem infraestrutura.", "Tudo corre no Wi‑Fi da sala ou num hotspot, e os sinais ainda podem viajar por luz, som e vibração se a rede cair. Tu decides o que se grava: nada, a não ser que escolhas o gravador fantasma ou o relatório.", ["Instala o APK em cada telemóvel; código aberto, licença MIT.", "Segurança integrada: sinal PÂNICO e ecrã branco de sala.", "Acessível: 8 idiomas, texto ajustável, legendas, resposta com ecrã bloqueado.", "Lê a auditoria e a comparação antes de te comprometeres — dizem o que falta."], ["Licença MIT", "Offline", "Sinais de segurança"], "Wi‑Fi da sala · sem internet"], ["🧩", "Programadores", "Um protocolo pequeno e documentado.", "Tramas `type|len|payload` sobre TCP, chaves por ligação e limites publicados. Tudo testado, auditado e aberto a extensões.", ["Lê PROTOCOL.md: mensagens, limites, cifragem, pacotes CUPLAJ‑AIR.", "Corre os testes em qualquer JVM — hub, protocolo e codecs AIR incluídos.", "A CI compila o APK e a documentação a cada push.", "Faz fork, acrescenta um tipo de sinal, envia um pull request."], ["PROTOCOL.md", "Testes JVM", "Código aberto"], "type|len|payload"]], "rs": {"who": "Para quem é?", "who_sub": "Escolhe o teu lugar no espetáculo.", "step": "A tua noite", "gets": "O que recebes", "guide": "Abrir o guia", "stats": ["idiomas", "tipos de sinal", "contas ou nuvem", "verificações automáticas"], "honest": "Nota sincera: testada com mais de 250 verificações automáticas e uma auditoria adversarial, mas ainda não numa frota de telemóveis reais — faz primeiro um ensaio."}, "kinds": 24, "checks": 250}, "de": {"name": "Deutsch", "tag": "Gemeinschaftsanschluss-Telefonie für immersives Theater", "ver": "Version: 1.9.0 · Letzte Aktualisierung: 2026-11-25", "intro": "CUPLAJ verwandelt eine Flotte gewöhnlicher Android-Telefone in eine private Telefonanlage für immersives Theater. Organisatoren und Schauspieler sprechen über das lokale WLAN des Veranstaltungsorts mit den Zuschauern (und untereinander) — ohne Cloud, ohne Konten, ohne Werbung. Das Kernmerkmal ist der *Cuplaj*: der **Gemeinschaftsanschluss** der Festnetztelefone von den 1980er-Jahren bis etwa 2006, bei dem sich zwei Teilnehmer eine Leitung teilten, mit unterschiedlichem Rhythmus klingelten und einander mithören konnten.", "h_feat": "Funktionen", "feat": ["**Drei Telefon-Epochen** — 1985 Wählscheibe (hörbare Impulse), 1995 Tastatur (DTMF-Töne), 2003 Handy (SMS, 160 Zeichen). Die Regie kann die Epoche live wechseln.", "**Gemeinschaftsanschluss (Cuplaj)** — zwei Telefone teilen eine Leitung; ein Anruf bei einem lässt beide mit dem Rhythmus des gerufenen Teilnehmers klingeln; wer zuerst abhebt, nimmt das Gespräch an; wer während des Nachbargesprächs abhebt, hört mit und kann sogar eingreifen.", "**Keine Infrastruktur** — ein Telefon (die Regie) ist der Hub. Die anderen verbinden sich per WLAN oder über dessen Hotspot; Hubs werden automatisch gefunden; Raumcode und PIN optional.", "**Stimme** — echte Gespräche (8 kHz), Push-to-Talk-Durchsagen von der Regie, Backstage-Kanal für das Team.", "**Signale** — Vollbildtext, Vibration, Klingeln, Blitz, Lautsprecher, Epochenwechsel, neuer Kontakt, gesprochene Stimme (lokale Sprachsynthese), Klangeffekte, schwarzer Bildschirm, Geisteranruf.", "**Ablauf** — Signalliste mit GO und PLAY (zeitgesteuert), Umsortieren, JSON-Import/-Export.", "**Regie-Werkzeuge** — Nummern, Gruppen, Koppeln/Entkoppeln, automatische Paare, stilles Mithören, Stummschalten, Vergessen, Akkustände, Ereignisprotokoll, Zustand übersteht Neustarts, Ratenbegrenzung.", "**8 Sprachen und Barrierefreiheit** — Englisch, Rumänisch, Französisch, Italienisch, Spanisch, Portugiesisch, Deutsch, Ungarisch; einstellbare Textgröße; Annehmen vom Sperrbildschirm; läuft im Hintergrund.", "**Internet und Mobilfunk (1.1)** — Verbindung mit `Host` oder `Host:Port`; optionaler AES‑128‑GCM‑Netzwerkschlüssel; automatische G.711‑Kompression außerhalb des lokalen Netzes; Keepalive.", "**Direkte P2P‑Gespräche (1.1)** — Audio läuft per UDP mit Hole‑Punching direkt von Telefon zu Telefon, mit Rückfall auf das Hub‑Relay; die Regie kann es abschalten, auf das lokale Netz begrenzen (Standard) oder überall erlauben.", "**VoIP‑/SIP‑Gateway (1.1)** — das Regie‑Telefon registriert sich bei einem SIP‑Anbieter oder einer Telefonanlage; das Team wählt `0`+Nummer nach außen, eingehende SIP‑Anrufe klingeln an einer internen Nummer.", "**Mobilfunknetz (1.1)** — SMS‑Gateway über die SIM des Regie‑Telefons (Senden und Empfangen), Cue *echter Anruf*, der die Wähl‑App öffnet, und WLAN‑/Mobil‑Anzeige.", "**Weitere Verbindungsarten (1.2)** — Bluetooth (ohne Router, etwa 7 Telefone), Wi‑Fi Direct (das Regie‑Telefon baut ein eigenes WLAN auf) und mDNS‑Erkennung, zusätzlich zu WLAN, Hotspot, USB‑Tethering, Ethernet und Mobilfunk.", "**Plug and Play (1.3)** — das Regie‑Telefon öffnet alle passenden Verbindungen selbst; die anderen tippen auf *Automatisch finden und beitreten* oder auf einen Einladungslink. Neu: Wi‑Fi Aware.", "**Gehärtet und ohne Netz (1.4)** — Audit mit feindlichem Publikum samt Korrekturen, und CUPLAJ‑AIR: drei eigene Protokolle, die Cues und Einladungen ganz ohne Netz übertragen (Taschenlampe → Kamera, Lautsprecher → Mikrofon, Vibration → Beschleunigungssensor).", "**Show‑Steuerung (1.5)** — Cues, die im selben Augenblick auslösen, PANIK‑Cue, Vollbildfarbe, Publikumsumfragen, Zustellbestätigung und eine Hardware‑PTT‑Taste. Vergleich mit Unity Intercom, Zello, Augmented Theatre, QLab/SOLOstudio und Livecube in `docs/COMPARISON.md`.", "**Alles aus dem Vergleich, was in eine Android‑only‑Offline‑App passt (1.6)** — PA‑Vorrang (Ducking), OSC‑Ein‑ und Ausgang für Licht‑ und Tonpulte sowie Bild‑, Video‑ und Audioclip‑Cues über den Hub.", "**Intelligente Show (1.7)** — Zonen, die dem Publikum per Schall folgen, Regeln („wenn jemand Zone 3 betritt, sende ihm…“), Publikumsmesser, Stimmeffekte, Untertitel, mehrsprachiger und personalisierter Text, Handlungsverzweigung.", "**Bühnenwerkzeuge (1.8)** — Art‑Net/DMX‑Licht, MIDI, Cue‑Welle, Stille Post, geteiltes Geheimnis, Geisterband, Sicherheits‑Cue (Saallicht), Morse per Vibration, Bericht nach der Vorstellung.", "**iPhone und iPad** — vollständiger Client und Host (Regie) in Swift, gleiches Protokoll wie Android: beide lassen sich in einer Vorstellung frei mischen; Build aus dem Quellcode mit Xcode (`ios/`)."], "h_quick": "Schnellstart", "quick": ["Den APK im Tab *Actions* (Artefakt `CUPLAJ-apk`) oder auf der Seite *Releases* holen und auf jedem Telefon installieren.", "Auf dem Regie-Telefon den Hotspot einschalten (oder alle Telefone in dasselbe WLAN bringen).", "Auf dem Regie-Telefon **Regie** → *Hub starten* wählen. PIN für Schauspieler und optional einen Raumcode notieren.", "Auf den anderen **Zuschauer** oder **Schauspieler** wählen, den Hub in der Liste auswählen (oder seine Adresse eingeben) und verbinden.", "Jedes Telefon erhält eine Nummer (Regie 100, Schauspieler 201…, Zuschauer 6 Ziffern). Hörer abheben und anrufen."], "h_eras": "Epochen: drei in der App, drei erdacht", "eras": ["**1985 · Wählscheibe** — eine echte Scheibe zum Drehen; die Impulse sind hörbar; zwei lange Klingeltöne.", "**1995 · Tasten** — DTMF-Töne, Notizbuch mit Nummern, Pager-Nachrichten.", "**2003 · Handy** — Namen im Adressbuch, Anruferkennung, SMS auf 160 Zeichen begrenzt.", "**2025 · Smartphone** — *Konzept, noch nicht in der App.* Chat‑Blasen, Sprachnachrichten, Lesebestätigungen und Push‑Benachrichtigungen; immer verbunden, nichts klingelt lange.", "**2045 · Wearables** — *erdacht.* Kein Handapparat: Anrufe als Flüstern im Ohrstöpsel, Gesichter als schwebende Etiketten in der Brille, ein Nicken zum Abnehmen.", "**2080 · geteilter Geist** — *erdacht.* Gar kein Gerät: Der Gemeinschaftsanschluss wird zu einem Gedanken, den man belauscht, und die Privatsphäre ist die Handlung."], "h_party": "So funktioniert der Gemeinschaftsanschluss", "party": ["Zwei Telefone werden von der Regie *gekoppelt* (oder automatisch paarweise). Sie teilen Leitung N, Plätze 1 und 2.", "Ein Anruf bei Teilnehmer 1 lässt beide klingeln; Teilnehmer 1 hört den Rhythmus seiner Nummer (ein langer Ton), Teilnehmer 2 den seinen (zwei kurze).", "Wer annimmt, bekommt das Gespräch; das andere Telefon hört auf zu klingeln.", "Solange die Leitung belegt ist, hört der Nachbar, der abhebt, das Gespräch mit, und die Gesprächspartner hören ein leises Klicken.", "Ein Mithörer kann *eingreifen* und sprechen; ein Anruf zu einem gekoppelten Telefon mit belegter Leitung erhält den Besetztton.", "Die Regie kann jede Leitung still überwachen (ohne Klicken)."], "h_docs": "Dokumentation", "docs": {"guide": "Benutzerhandbuch", "protocol": "Protokoll", "audit": "Adversarielles Audit", "changelog": "Änderungsprotokoll", "site": "Präsentationsseite"}, "h_status": "Ehrlicher Stand", "status": "Die Hub-Logik (Gespräche, Gemeinschaftsanschluss, Berechtigungen, Limits, Persistenz) wird von mehr als 250 automatischen Prüfungen auf einer JVM abgedeckt. Die Android-Oberfläche und der Audiopfad haben die Typprüfung gegen das Android-14-SDK bestanden, wurden aber **noch nicht auf echten Geräten getestet**; der APK wird von GitHub Actions gebaut. Vor einer Vorstellung mit ein paar Telefonen testen. Der Verkehr im lokalen Netz ist nicht verschlüsselt (PIN und Raumcode halten gutgläubige Fremde fern, sie sind keine Kryptografie). Die Netzfunktionen der Version 1.1 (Verschlüsselung, P2P, SIP, SMS) sind durch Hub‑Tests gegen einen simulierten SIP‑Server abgedeckt, aber **nicht** an echten Anbietern, NATs oder SIM‑Karten erprobt. Die Verbindungen über Bluetooth, Wi‑Fi Direct und mDNS (1.2) nutzen dieselbe Transportschicht, auf der JVM mit simulierten Kanälen getestet, wurden aber **nicht** an echten Geräten erprobt; das Verhalten unterscheidet sich je nach Hersteller. Plug and Play (Auto‑Beitritt, Einladungen, Wi‑Fi Aware, 1.3) ist **nicht** an Geräten getestet; das Einladungsformat ist durch JVM‑Tests abgedeckt. Die Korrekturen des 1.4‑Audits und die AIR‑Codecs sind durch JVM‑Tests abgedeckt (simuliertes Rauschen, Taktdrift, falscher Schlüssel, Störungen); der Code für Taschenlampe, Kamera, Mikrofon, Lautsprecher, Motor und Beschleunigungssensor ist **nicht** auf echten Telefonen getestet, und echte Reichweite und Geschwindigkeit werden abweichen. Die 1.5‑Funktionen sind durch JVM‑Tests abgedeckt (Uhrschätzung, Verzögerungen, Umfrageregeln, Lichtempfindlichkeitsgrenzen); Bildschirm‑Overlays, Headset‑Taste und echte Uhrgenauigkeit auf Telefonen sind **nicht** auf Geräten getestet. Die 1.6‑Funktionen sind durch JVM‑Tests abgedeckt (Ducking‑Kurve, OSC‑Fuzzing und ‑Flut, Transferintegrität und Pfadsicherheit, Hub‑Relay); Wiedergabe von Bild, Video und Clip, Dateiauswahl und Einstellungsdialoge sind **nicht** auf Geräten getestet. Zonen, Regeln, Messer, Stimmeffekte und Sprachen sind durch JVM‑Tests abgedeckt (Regelmaschine, Hub‑Regeln, Messer‑Aggregation, Stimmfilter nach Frequenz gemessen); echte Schall‑Baken in Innenräumen, Mikrofon‑ und Beschleunigungsmessungen und die Stimmqualität auf Telefonen sind **nicht** auf Geräten getestet. Eine aufgezeichnete Bake kann einmal je Sequenznummer wiedergegeben werden: Zonen dienen der Stimmung, nicht der Sicherheit. Art‑Net‑Pakete, DMX‑Überblendungen, MIDI‑Nachrichten, Morsemuster, Bericht und Hub‑Logik (Welle, Stille Post, Geheimnis, Bericht) sind durch JVM‑Tests abgedeckt; Geisterband, echte Lichtpulte und MIDI‑Geräte und alles auf echten Telefonen sind nicht getestet. **iOS:** Der Swift‑Kern wird in der CI auf macOS getestet und die App baut für den Simulator, wurde aber **weder auf echten iPhones noch mit einem echten SIP‑Anbieter ausprobiert**.", "h_priv": "Datenschutz", "priv": "Keine Analyse, keine Server, keine Konten. Ton und Nachrichten laufen nur in eurem lokalen Netz, zwischen den Telefonen und dem Hub. Der Hub speichert Nummern, Gruppen und Kopplungen auf dem Regie-Telefon, damit ein Neustart sie nicht verliert.", "h_support": "Projekt unterstützen", "h_lic": "Lizenz", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Benutzerhandbuch", "s": {"hero": "Der Gemeinschaftsanschluss, zurück auf der Bühne.", "sub": "Eine private Telefonanlage für immersives Theater, gebaut aus den Telefonen, die euer Publikum ohnehin in der Tasche hat.", "get": "APK herunterladen", "repo": "Quellcode auf GitHub", "demo": "Gemeinschaftsanschluss ausprobieren", "demo_hint": "Die Telefone A1 und A2 teilen Leitung 1; B1 und B2 teilen Leitung 2.", "call": "ruft an", "answer": "Annehmen", "hangup": "Auflegen", "listen": "Mithören", "intervene": "Eingreifen", "idle": "frei", "ringing": "klingelt", "talking": "spricht", "busy": "Besetztton", "hears": "hört mit", "click": "*Klick*", "ring_long": "ein langer Ton", "ring_short": "zwei kurze Töne", "log": "Protokoll", "reset": "Zurücksetzen", "line": "Leitung", "eras": "Drei Epochen", "coffee": "Spendier mir einen Kaffee", "rights": "MIT-Lizenz", "plat": "Android‑App (APK) · iPhone/iPad‑App aus dem Quellcode mit Xcode gebaut — gleiches Protokoll, in einer Vorstellung mischbar.", "get_ios": "Für iPhone/iPad herunterladen (.ipa)", "all_rel": "Alle Versionen", "ios_dl": "Die .ipa ist nicht signiert: mit AltStore oder Sideloadly und deiner Apple‑ID installieren (eine kostenlose ID gilt 7 Tage) oder mit Xcode bauen. Android: APK herunterladen.", "m_shots": "Bildschirme", "m_note": "Illustrationen nach den Konzepten und dem Aufbau der App. Es sind keine Aufnahmen von einem echten Telefon.", "m_clips": "Funktionsdemos", "m_sc": ["Zuschauer: eingehender Anruf", "Darsteller: Leitungen und Ablauf", "Regie: Cues, Zähler, Leitungen", "Ablauf: Cue-Liste", "CUPLAJ-AIR: ohne Netz", "Umfrage: Live-Ergebnis"], "m_cl": [["Gemeinschaftsanschluss", "A1 ruft B1 an; B1 klingelt lang, B2 (gleiche Leitung) kurz; A2 hört mit; die Regie schaltet sich ein."], ["Cues", "Klingel-, Flüster-, Blackout- und Ton-Cues erreichen alle Telefone."], ["CUPLAJ-AIR", "Licht, Schall und Vibration tragen einen Cue ohne Netz."], ["Umfragen", "Das Publikum stimmt ab, die Regie sieht das Ergebnis live."]], "dg": {"t1": "Was wirklich überprüft wurde", "cols": ["Automatische Tests", "Builds", "Echte Telefone"], "leg": ["Erledigt", "Teilweise (nur Formate, Pakete oder simulierte Kanäle)", "Nicht erledigt"], "rows": ["Hub‑Logik: Gespräche, Gemeinschaftsanschluss, Limits", "Android‑Bildschirme und Audio", "Netz: Verschlüsselung, P2P, SIP, SMS", "Bluetooth, Wi‑Fi Direct, mDNS", "Plug and play, Einladungen", "CUPLAJ‑AIR: Licht, Schall, Vibration", "Showsteuerung (1.5)", "Medien, OSC, Durchsagen (1.6)", "Zonen, Regeln, Zähler (1.7)", "Art‑Net, MIDI, Publikumsspiele (1.8)", "iPhone‑ und iPad‑App"], "t2": "Wie weit jeder Schritt gekommen ist", "steps": ["Code geschrieben", "Automatische Tests bestanden (JVM und macOS)", "Builds in der CI (APK, iOS‑Simulator)", "Release veröffentlicht (APK, unsignierte IPA)", "Auf einigen echten Telefonen ausprobiert", "Probe und Live‑Vorstellung"]}, "review": "Ehrliche Bewertung und Vergleich"}, "roles": [["🎭", "Publikum", "Dein Handy wird zum Telefon der 80er.", "Du installierst nur eine App, legst kein Konto an und gibst niemandem deine Daten. Die Show ruft dich an, flüstert dir zu, schickt dir einen Brief auf den Bildschirm — und lässt dich den Fremden neben dir anrufen.", ["Tritt mit einem Tipp auf einen Einladungslink bei — er kann dich sogar per Licht oder Ton erreichen.", "Wähle deine Epoche: Wählscheibe, Tastatur oder frühes Handy.", "Nimm ab, wenn es klingelt — der Rhythmus sagt, für wen.", "Stimme ab, flüstere, löse Geheimnisse mit den Leuten um dich."], ["Kein Konto", "8 Sprachen", "Große Schrift, Annahme am Sperrbildschirm"], "„Dreh dich nicht um.“"], ["🎬", "Darsteller", "Eine private Leitung zur Crew, in der Tasche.", "Du trittst mit dem Crew‑PIN bei, bekommst eine 2xx‑Nummer und hörst den Backstage‑Kanal, ohne die Rolle zu verlassen. Du rufst Zuschauer an, wirst angerufen und erhältst Hinweise, die nur du hörst.", ["PIN einmal eingeben; die Regie kennt dich mit Namen.", "Backstage‑Cues über Lautsprecher oder als gesprochene Ansage hören.", "Einen Zuschauer per Nummer anrufen — als Figur, alter Freund, Fremder.", "Durchsagen und Crew hören, ohne die Szene zu verlassen."], ["Crew‑PIN", "Backstage‑Kanal", "Gesprochene Hinweise"], "Backstage: „Tür in 10 s.“"], ["🎛️", "Host / Admin (Regie)", "Ein Telefon führt die ganze Vermittlung.", "Das Regie‑Telefon ist Hub und Inspizient. Du startest es, gibst den PIN weiter und dirigierst: Nummern, Gruppen, ein Ablauf mit GO, Regeln, die auf das Publikum reagieren, ein Lautstärkemesser und ein Live‑Bericht.", ["Starte den Hub per Hotspot, WLAN, Bluetooth oder Wi‑Fi Direct.", "Koppel Zuschauer auf Gemeinschaftsleitungen oder hör unauffällig mit.", "Löse Cues zum selben Zeitpunkt, als Welle, per Regeln und Zonen aus.", "Drück PANIK oder Saallicht; exportiere den Bericht."], ["Ablauf + GO", "Regeln & Zonen", "PANIK"], "GO ▶  Cue 12 · 213 online"], ["🔧", "Technik‑Crew", "Spricht die Sprache von Licht‑ und Tonpulten.", "Verbinde CUPLAJ mit deiner Anlage: OSC ein und aus für Pulte, Art‑Net / DMX für Licht, MIDI für Ton, und wenn der Host durchsagt, wird der übrige Ton automatisch leiser.", ["Sende DMX‑Universen mit Überblendungen aus einer Zeile wie 0;1=255;2000.", "Löse Cues am Pult per OSC aus, mit Echo zurück.", "Sende MIDI‑Noten, Controller und MMC an ein USB‑ oder Bluetooth‑Gerät.", "Nutze ein SIP‑Gateway oder SMS über die SIM des Regie‑Telefons."], ["OSC", "Art‑Net / DMX", "MIDI"], "0;1=255,2-4=128;2000"], ["🏛️", "Veranstalter & Häuser", "Keine Cloud, keine Konten, keine Infrastruktur.", "Alles läuft im WLAN des Hauses oder über einen Hotspot, und Cues können bei Netzausfall weiter per Licht, Ton und Vibration reisen. Du entscheidest, was aufgezeichnet wird: nichts, außer du wählst die Geisterband oder den Bericht.", ["APK auf jedem Telefon installieren; Open Source, MIT‑Lizenz.", "Eingebaute Sicherheit: PANIK‑Cue und weißer Saallicht‑Bildschirm.", "Barrierearm: 8 Sprachen, einstellbare Schrift, Untertitel, Annahme am Sperrbildschirm.", "Lies Audit und Vergleich, bevor du dich festlegst — sie nennen, was fehlt."], ["MIT‑Lizenz", "Offline", "Sicherheits‑Cues"], "Haus‑WLAN · kein Internet nötig"], ["🧩", "Entwickler", "Ein kleines, dokumentiertes Protokoll.", "Frames `type|len|payload` über TCP, Schlüssel pro Verbindung und veröffentlichte Grenzen. Alles ist getestet, geprüft und offen für Erweiterungen.", ["PROTOCOL.md lesen: Nachrichten, Grenzen, Verschlüsselung, CUPLAJ‑AIR‑Pakete.", "Tests auf jeder JVM ausführen — Hub, Protokoll und AIR‑Codecs inklusive.", "Die CI baut bei jedem Push APK und Doku.", "Forken, eine Cue‑Art ergänzen, Pull Request senden."], ["PROTOCOL.md", "JVM‑Tests", "Open Source"], "type|len|payload"]], "rs": {"who": "Für wen?", "who_sub": "Such dir deinen Platz in der Show.", "step": "Dein Abend", "gets": "Was du bekommst", "guide": "Anleitung öffnen", "stats": ["Sprachen", "Cue‑Arten", "Konten oder Clouds", "automatische Prüfungen"], "honest": "Ehrlicher Hinweis: durch über 250 automatische Prüfungen und ein Angriffs‑Audit getestet, aber noch nicht auf einer Flotte echter Telefone — erst eine Probe machen."}, "kinds": 24, "checks": 250}, "hu": {"name": "Magyar", "tag": "Közös vonalas telefonálás immerzív színházhoz", "ver": "Verzió: 1.9.0 · Utolsó frissítés: 2026-11-25", "intro": "A CUPLAJ hétköznapi Android-telefonok flottáját alakítja magán telefonközponttá immerzív színház számára. A szervezők és a színészek a helyszín helyi Wi‑Fi hálózatán beszélnek a nézőkkel (és egymással) — felhő, fiók és reklám nélkül. Névadó funkciója a *cuplaj*: az 1980-as évektől nagyjából 2006-ig használt vezetékes telefonok **közös vonala**, amelyen két előfizető osztozott, eltérő ritmusban csengettek, és hallhatták egymást.", "h_feat": "Funkciók", "feat": ["**Három telefonkorszak** — 1985 tárcsás (hallható impulzusok), 1995 gombos (DTMF hangok), 2003 mobil (SMS, 160 karakter). A rendezés élőben válthat korszakot.", "**Közös vonal (cuplaj)** — két telefon osztozik egy vonalon; az egyiknek szóló hívás mindkettőt csörgeti a hívott előfizető ritmusában; aki előbb felveszi, azé a hívás; ha a szomszéd beszélgetése közben felveszed a kagylót, belehallgathatsz, sőt közbe is szólhatsz.", "**Infrastruktúra nélkül** — egy telefon (a rendezés) a hub. A többiek Wi‑Fi-n vagy a hub hotspotján csatlakoznak; a hubot automatikusan megtalálják; teremkód és PIN választható.", "**Hang** — valódi hívások (8 kHz), nyomva-tartásos hangosbemondás a rendezéstől, kulissza-csatorna a stábnak.", "**Jelzések** — teljes képernyős szöveg, rezgés, csengetés, vaku, hangszóró, korszakváltás, új névjegy, beszélt hang (helyi szövegfelolvasás), hangeffektek, fekete képernyő, szellemhívás.", "**Forgatókönyv** — jelzéslista GO és PLAY (időzített) gombbal, átrendezés, JSON import/export.", "**Rendezői eszközök** — számok, csoportok, párosítás/szétválasztás, automatikus párok, csendes belehallgatás, némítás, törlés, akkumulátorszint, eseménynapló, újraindítást túlélő állapot, forgalomkorlátozás.", "**8 nyelv és hozzáférhetőség** — angol, román, francia, olasz, spanyol, portugál, német, magyar; állítható szövegméret; hívásfogadás a zárolt képernyőről; háttérben is fut.", "**Internet és mobiladat (1.1)** — csatlakozás `host` vagy `host:port` megadásával; opcionális AES‑128‑GCM hálózati kulcs; automatikus G.711 tömörítés a helyi hálózaton kívül; keepalive.", "**Közvetlen P2P hívások (1.1)** — a hang UDP‑n, lyukasztással megy telefonról telefonra, szükség esetén a hub közvetítőjére visszaesve; a rendező kikapcsolhatja, helyi hálózatra korlátozhatja (alap) vagy bárhová engedheti.", "**VoIP / SIP átjáró (1.1)** — a rendezői telefon bejelentkezik egy SIP‑szolgáltatóhoz vagy alközpontba; a stáb `0`+számot tárcsáz kifelé, a bejövő SIP‑hívások egy belső számon csengenek.", "**Mobilhálózat (1.1)** — SMS‑átjáró a rendezői telefon SIM‑jén át (küldés és fogadás), *valódi hívás* cue, amely megnyitja a tárcsázót, és Wi‑Fi / mobil jelző.", "**További csatlakozási módok (1.2)** — Bluetooth (router nélkül, kb. 7 telefon), Wi‑Fi Direct (a rendezői telefon saját Wi‑Fi hálózatot hoz létre) és mDNS‑felderítés, a Wi‑Fi, hotspot, USB‑megosztás, Ethernet és mobiladat mellett.", "**Plug and play (1.3)** — a rendezői telefon magától megnyit minden megfelelő kapcsolatot; a többiek az *Automatikus keresés és csatlakozás* gombot vagy egy meghívó linket érintenek meg. Újdonság: Wi‑Fi Aware.", "**Megerősítve és hálózat nélkül (1.4)** — ellenséges közönségre méretezett átvizsgálás javításokkal, és a CUPLAJ‑AIR: három saját protokoll, amely jelzéseket és meghívókat visz teljesen hálózat nélkül (zseblámpa → kamera, hangszóró → mikrofon, rezgés → gyorsulásmérő).", "**Előadásvezérlés (1.5)** — egyszerre induló jelzések, PÁNIK jelzés, teljes képernyős szín, közönségszavazás, kézbesítési visszajelzés és hardveres PTT gomb. Összevetés a Unity Intercom, Zello, Augmented Theatre, QLab/SOLOstudio és Livecube alkalmazásokkal: `docs/COMPARISON.md`.", "**Minden az összehasonlításból, ami belefér egy csak Androidos, offline appba (1.6)** — PA elsőbbség (ducking), OSC be- és kimenet fény- és hangpultokhoz, valamint kép-, videó- és hangklip-jelzések a hubon át.", "**Okos előadás (1.7)** — hanggal követő zónák, szabályok („ha valaki belép a 3. zónába, küldd neki…”), közönségmérő, hangeffektek, feliratok, többnyelvű és személyre szabott szöveg, a történet elágaztatása.", "**Színpadi eszközök (1.8)** — Art‑Net/DMX fények, MIDI, jelzéshullám, süket telefon, szétosztott titok, szellemmagnó, biztonsági jelzés (nézőtéri fények), Morze rezgéssel, előadás utáni jelentés.", "**iPhone és iPad** — teljes kliens és házigazda (rendezői) Swiftben, ugyanaz a protokoll, mint Androidon: egy előadáson belül szabadon keverhetők; forrásból építhető Xcode‑dal (`ios/`)."], "h_quick": "Gyors kezdés", "quick": ["Szerezd meg az APK-t az *Actions* fülről (`CUPLAJ-apk` artefaktum) vagy a *Releases* oldalról, és telepítsd minden telefonra.", "A rendezés telefonján kapcsold be a hotspotot (vagy tedd az összes telefont ugyanarra a Wi‑Fi-re).", "A rendezés telefonján válaszd a **Rendezés** → *Hub indítása* lehetőséget. Jegyezd fel a színészek PIN-jét és szükség esetén a teremkódot.", "A többin válaszd a **Néző** vagy **Színész** szerepet, jelöld ki a hubot a listában (vagy írd be a címét), és csatlakozz.", "Minden telefon kap egy számot (rendezés 100, színészek 201…, nézők 6 jegyű). Vedd fel a kagylót, és hívj."], "h_eras": "Korszakok: három az appban, három elképzelt", "eras": ["**1985 · tárcsás** — valódi tárcsa, amit tekerni kell; az impulzusok hallhatók; két hosszú csengetés.", "**1995 · gombos** — DTMF hangok, számjegyzet, csipogó-üzenetek.", "**2003 · mobil** — nevek a telefonkönyvben, hívóazonosítás, legfeljebb 160 karakteres SMS.", "**2025 · okostelefon** — *koncepció, még nincs az appban.* Csevegőbuborékok, hangüzenetek, olvasási visszajelzések és push‑értesítések; mindig elérhető, semmi sem csörög sokáig.", "**2045 · viselhető eszközök** — *elképzelt.* Nincs kézibeszélő: a hívás fülhallgatóba suttogva érkezik, az arcok lebegő címkék a szemüvegben, egy bólintás a felvételhez.", "**2080 · közös elme** — *elképzelt.* Egyáltalán nincs eszköz: a közös vonal egy gondolat, amit kihallgatunk, és a magánszféra a cselekmény."], "h_party": "Hogyan működik a közös vonal", "party": ["A rendezés *párosít* két telefont (vagy automatikusan párokat képez). Az N. vonalon osztoznak, az 1. és 2. helyen.", "Az 1. előfizetőnek szóló hívás mindkettőt csörgeti; az 1. előfizető a saját számának ritmusát hallja (egy hosszú csengetés), a 2. a sajátját (két rövid).", "Aki felveszi, azé a hívás; a másik telefon abbahagyja a csörgést.", "Amíg a vonal foglalt, a szomszéd, aki felveszi a kagylót, hallja a beszélgetést, a beszélők pedig halk kattanást hallanak.", "A belehallgató *közbeszólhat*; a párosított telefonra érkező hívás foglalt vonalnál foglaltjelzést kap.", "A rendezés bármelyik vonalat csendben (kattanás nélkül) megfigyelheti."], "h_docs": "Dokumentáció", "docs": {"guide": "Felhasználói útmutató", "protocol": "Protokoll", "audit": "Ellenséges szemléletű audit", "changelog": "Változásnapló", "site": "Bemutatóoldal"}, "h_status": "Őszinte állapot", "status": "A hub logikáját (hívások, közös vonal, jogosultságok, korlátok, tartós állapot) több mint 250 automatikus ellenőrzés fedi le JVM-en. Az Android-felület és a hangút típusellenőrzésen átment az Android 14 SDK ellen, de **valódi eszközön még nem tesztelték**; az APK-t a GitHub Actions építi. Előadás előtt próbáld ki néhány telefonnal. A helyi hálózati forgalom nincs titkosítva (a PIN és a teremkód a jóhiszemű kívülállókat tartja távol, nem kriptográfia). Az 1.1‑es hálózati funkciókat (titkosítás, P2P, SIP, SMS) szimulált SIP‑szerver elleni hubtesztek fedik, de **nem** próbáltuk valódi szolgáltatóval, NAT‑tal vagy SIM‑mel. A Bluetooth, Wi‑Fi Direct és mDNS kapcsolatok (1.2) ugyanazt a szállítási réteget használják, amelyet JVM‑en szimulált csatornákkal teszteltünk, de **nem** próbáltuk valódi eszközön; a viselkedés gyártónként eltér. A plug and play (automatikus csatlakozás, meghívók, Wi‑Fi Aware, 1.3) **nincs** eszközökön tesztelve; a meghívó formátumát JVM‑tesztek fedik. Az 1.4‑es átvizsgálás javításait és az AIR kodekeket JVM‑tesztek fedik (szimulált zaj, órajel‑sodródás, hibás kulcs, interferencia); a zseblámpa, kamera, mikrofon, hangszóró, motor és gyorsulásmérő kódja **nincs** valódi telefonokon tesztelve, a valós hatótávolság és sebesség eltérhet. Az 1.5 funkciókat JVM-tesztek fedik (órabecslés, késleltetések, szavazási szabályok, fényérzékenységi korlátok); a képernyő-rátétek, a headset gomb és a valós órapontosság telefonokon **nincs** tesztelve. Az 1.6 funkciókat JVM-tesztek fedik (ducking görbe, OSC fuzzing és áradat, átviteli sértetlenség és útvonal-biztonság, hub-relé); a kép/videó/klip lejátszása, a fájlválasztó és a beállító ablakok **nincs** eszközökön tesztelve. A zónákat, szabályokat, mérőt, hangeffekteket és nyelveket JVM-tesztek fedik (szabálymotor, hub-szabályok, mérő-összesítés, frekvenciában mért hangszűrők); a valódi hangjelzők beltérben, a mikrofon- és gyorsulásmérő-mérések és a hangminőség telefonokon **nincs** eszközökön tesztelve. Egy felvett jelzés sorszámonként egyszer visszajátszható: a zónák hangulatra valók, nem biztonságra. Az Art‑Net csomagokat, DMX áttűnéseket, MIDI üzeneteket, Morze‑mintákat, a jelentést és a hub logikáját (hullám, süket telefon, titok, jelentés) JVM‑tesztek fedik; a szellemmagnó, a valódi fénypultok és MIDI‑eszközök, és minden, ami valódi telefonon történik, nem t /* ---- party-line demo ---- */
const P={A1:{line:1,slot:0},A2:{line:1,slot:1},B1:{line:2,slot:0},B2:{line:2,slot:1}};
let call=null,logs=[];
function reset(){for(const k in P){P[k].st='idle';P[k].ring=0;}call=null;logs=[];}
const nb=k=>k[0]+(k[1]==='1'?'2':'1');
function say(t){logs.push(t);if(logs.length>40)logs.shift();}
function doCall(from,to){
 const s=DATA[lang].s,p=P[from];
 if(p.st!=='idle')return;
 if(P[nb(from)].st==='talking'){say(from+': '+s.hears+' '+s.click);p.st='listening';return;}
 if(from===to||P[to].st!=='idle'||P[nb(to)].st==='talking'||P[nb(to)].st==='ringing'){p.st='busy';say(from+' '+s.call+' '+to+' → '+s.busy);return;}
 p.st='calling';call={a:from,b:to,answered:false};
 [to,nb(to)].forEach(k=>{if(P[k].st==='idle'){P[k].st='ringing';P[k].ring=P[k].slot;say(k+': '+s.ringing+' ('+(P[k].slot===P[to].slot?s.ring_long:s.ring_short)+')');}});
 say(from+' '+s.call+' '+to);
}
function answer(k){
 if(P[k].st!=='ringing'||!call)return;
 const s=DATA[lang].s;
 P[k].st='talking';P[call.a].st='talking';
 [call.b,nb(call.b)].forEach(x=>{if(x!==k&&P[x].st==='ringing')P[x].st='idle';});
 call.answered=true;call.by=k;say(k+': '+s.answer+' → '+call.a+' ⇄ '+k);
}
function hang(k){
 if(call&&(k===call.a||k===call.by||(!call.answered&&P[k].st==='ringing'))){
  for(const x in P){if(['talking','listening','calling','ringing','busy'].includes(P[x].st)&&(x===call.a||x===call.b||x===call.by||x===nb(call.b)||x===nb(call.a)))P[x].st='idle';}
  call=null;say(k+': '+DATA[lang].s.hangup);return;}
 P[k].st='idle';
}
function drawDemo(){
 const s=DATA[lang].s,host=$('lines');host.innerHTML='';
 [1,2].forEach(n=>{
  const box=document.createElement('div');box.className='line';box.innerHTML='<h4>'+s.line+' '+n+'</h4>';
  Object.keys(P).filter(k=>P[k].line===n).forEach(k=>{
   const p=P[k],d=document.createElement('div');d.className='phone '+p.st;
   const stTxt={idle:s.idle,ringing:s.ringing,talking:s.talking,busy:s.busy,listening:s.hears,calling:s.call+'…'}[p.st];
   d.innerHTML='<b>'+k+'</b><span class="st">'+stTxt+'</span><div class="row"></div>';
   const row=d.querySelector('.row');
   const add=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{f();drawDemo();drawLog();};row.appendChild(b);};
   if(p.st==='idle'){Object.keys(P).filter(x=>x!==k).forEach(x=>add('→ '+x,()=>doCall(k,x)));
    if(P[nb(k)].st==='talking')add(s.listen,()=>doCall(k,k));}
   if(p.st==='ringing')add(s.answer,()=>answer(k));
   if(p.st!=='idle')add(s.hangup,()=>hang(k));
   box.appendChild(d);
  });host.appendChild(box);
 });
}
function drawLog(){const l=$('log');l.textContent=logs.join('\n');l.scrollTop=l.scrollHeight;}
$('reset').onclick=()=>{reset();drawDemo();drawLog();};
