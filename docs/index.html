<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#14110f;--card:#1e1915;--ink:#e8d9b8;--dim:#a39883;--acc:#b5452f;--ok:#2e7d4f;--red:#a33a32;--fs:1}
*{box-sizing:border-box}
html{scroll-behavior:smooth;font-size:calc(16px*var(--fs))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.55}
a{color:#e0a26a}
header.top{position:sticky;top:0;z-index:5;background:#14110fee;backdrop-filter:blur(6px);border-bottom:1px solid #2b2620;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.5rem 1rem}
header.top .brand{font-weight:bold;letter-spacing:.2em;margin-right:auto}
select,button{font:inherit;color:var(--ink);background:#2b2f36;border:1px solid #3a3f47;border-radius:8px;padding:.35rem .7rem;cursor:pointer}
button:hover{border-color:var(--acc)}
.hero{text-align:center;padding:4rem 1rem 2rem;max-width:56rem;margin:0 auto}
.hero img{width:150px;height:150px}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);margin:.4rem 0}
.hero p{color:var(--dim);font-size:1.15rem}
.cta{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin:1.4rem 0}
.cta a{background:var(--acc);color:#fff;text-decoration:none;padding:.7rem 1.3rem;border-radius:10px}
.cta a.alt{background:#2b2f36}
main{max-width:60rem;margin:0 auto;padding:0 1rem 4rem}
h2{border-bottom:1px solid #2b2620;padding-bottom:.3rem;margin-top:2.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}
.card{background:var(--card);border:1px solid #2b2620;border-radius:12px;padding:1rem}
code{background:#2b2f36;padding:.05rem .35rem;border-radius:4px;font-size:.9em}
ol,ul{padding-left:1.3rem}
.demo{background:var(--card);border:1px solid #2b2620;border-radius:14px;padding:1rem}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:600px){.lines{grid-template-columns:1fr}}
.line{border:1px dashed #5a5246;border-radius:12px;padding:.6rem}
.line h4{margin:.1rem 0 .5rem;color:var(--dim);font-weight:normal}
.phone{background:#2b2f36;border-radius:10px;padding:.6rem;margin:.4rem 0;border-left:6px solid #555}
.phone.ringing{border-color:#e0a26a;animation:pulse 1s infinite}
.phone.talking{border-color:var(--ok)}
.phone.listening{border-color:#4a7fb0}
.phone.busy{border-color:var(--red)}
@keyframes pulse{50%{background:#3b3328}}
@media(prefers-reduced-motion:reduce){.phone.ringing{animation:none}}
.phone b{font-size:1.1em}
.phone .st{color:var(--dim);margin-left:.4rem}
.phone .row{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.4rem}
.phone .row button{padding:.2rem .5rem;font-size:.85rem}
#log{background:#0e0c0a;border-radius:8px;padding:.6rem;min-height:5rem;max-height:12rem;overflow:auto;font-family:monospace;font-size:.85rem;color:#c9bb98}
footer{text-align:center;color:var(--dim);padding:2rem 1rem 4rem}
#up{position:fixed;right:14px;bottom:14px;width:48px;height:48px;border-radius:50%;display:none;font-size:1.3rem}
.langbar{display:flex;gap:.3rem;flex-wrap:wrap}
</style>

"Confidențialitate", "priv": "Fără statistici, fără servere, fără conturi. Sunetul și mesajele circulă doar în rețeaua locală, între telefoane și hub. Hubul ține numerele, grupurile și cuplajele pe telefonul Regiei, ca o repornire să nu le piardă.", "h_support": "Sprijină proiectul", "h_lic": "Licență", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Ghid de utilizare", "s": {"hero": "Linia comună, înapoi pe scenă.", "sub": "O centrală telefonică privată pentru teatrul imersiv, făcută din telefoanele pe care publicul le are deja în buzunar.", "get": "Descarcă APK-ul", "repo": "Cod sursă pe GitHub", "demo": "Încearcă cuplajul", "demo_hint": "Telefoanele A1 și A2 împart linia 1; B1 și B2 împart linia 2.", "call": "sună", "answer": "Răspunde", "hangup": "Închide", "listen": "Ascultă", "intervene": "Intervine", "idle": "liber", "ringing": "sună", "talking": "vorbește", "busy": "ton ocupat", "hears": "ascultă", "click": "*clic*", "ring_long": "un sunet lung", "ring_short": "două sunete scurte", "log": "Jurnal", "reset": "Resetează", "line": "linia", "eras": "Trei epoci", "coffee": "Cumpără-mi o cafea", "rights": "Licență MIT"}}, "fr": {"name": "Français", "tag": "Téléphonie à ligne partagée pour le théâtre immersif", "ver": "Version : 1.4.0 · Dernière mise à jour : 2026-11-24", "intro": "CUPLAJ transforme une flotte de téléphones Android ordinaires en central téléphonique privé pour le théâtre immersif. Organisateurs et acteurs parlent aux spectateurs (et entre eux) via le Wi‑Fi local du lieu — sans cloud, sans compte, sans publicité. Sa fonction phare est le *cuplaj* : la **ligne partagée** des téléphones fixes des années 1980 jusqu'à environ 2006, où deux abonnés se partageaient une même ligne, sonnaient avec des cadences différentes et pouvaient s'entendre l'un l'autre.", "h_feat": "Fonctionnalités", "feat": ["**Trois époques de téléphone** — 1985 cadran rotatif (impulsions audibles), 1995 clavier (tonalités DTMF), 2003 mobile (SMS, 160 caractères). La régie peut changer d'époque en direct.", "**Ligne partagée (cuplaj)** — deux téléphones se partagent une ligne ; un appel à l'un fait sonner les deux avec la cadence de l'abonné appelé ; le voisin qui décroche le premier prend l'appel ; décrocher pendant la conversation du voisin permet d'écouter, voire d'intervenir.", "**Aucune infrastructure** — un téléphone (la régie) est le hub. Les autres le rejoignent par Wi‑Fi ou par son point d'accès ; les hubs sont détectés automatiquement ; code de salle et PIN facultatifs.", "**Voix** — vrais appels (8 kHz), annonce push‑to‑talk depuis la régie, canal coulisses pour l'équipe.", "**Indices** — texte plein écran, vibration, sonnerie, flash, haut‑parleur, changement d'époque, nouveau contact, voix parlée (synthèse locale), effets sonores, écran noir, appel fantôme.", "**Scénario** — liste d'indices avec GO et PLAY (minuté), réorganisation, import/export JSON.", "**Outils de régie** — numéros, groupes, couplage/découplage, paires automatiques, écoute discrète, muet, oubli, niveaux de batterie, journal, état conservé après redémarrage, limitation de débit.", "**8 langues et accessibilité** — anglais, roumain, français, italien, espagnol, portugais, allemand, hongrois ; taille de texte réglable ; réponse depuis l'écran verrouillé ; fonctionne en arrière‑plan.", "**Internet et données mobiles (1.1)** — connexion par `hôte` ou `hôte:port` ; clé réseau AES‑128‑GCM facultative ; compression G.711 automatique hors réseau local ; keepalive.", "**Appels directs P2P (1.1)** — l'audio circule de téléphone à téléphone en UDP avec traversée de NAT, avec repli sur le relais du hub ; la régie peut le désactiver, le limiter au réseau local (défaut) ou l'ouvrir partout.", "**Passerelle VoIP / SIP (1.1)** — le téléphone de la régie s'enregistre chez un opérateur SIP ou un PBX ; l'équipe compose `0`+numéro pour sortir, les appels SIP entrants sonnent à un numéro interne.", "**Réseau mobile (1.1)** — passerelle SMS via la SIM du téléphone de la régie (envoi et réception), cue *appel réel* qui ouvre le numéroteur, indicateur Wi‑Fi / mobile.", "**Davantage de modes de connexion (1.2)** — Bluetooth (sans routeur, environ 7 téléphones), Wi‑Fi Direct (le téléphone de la régie crée son propre réseau Wi‑Fi) et découverte mDNS, en plus du Wi‑Fi, du point d'accès, du partage USB, de l'Ethernet et des données mobiles.", "**Plug and play (1.3)** — le téléphone de la régie ouvre seul toutes les liaisons utiles ; les autres touchent *Trouver et rejoindre automatiquement* ou un lien d'invitation. Ajoute Wi‑Fi Aware.", "**Durci et sans réseau (1.4)** — audit face à un public hostile avec corrections, et CUPLAJ‑AIR : trois protocoles originaux qui transportent indices et invitations sans aucun réseau (lampe → caméra, haut‑parleur → micro, vibration → accéléromètre)."], "h_quick": "Démarrage rapide", "quick": ["Récupérez l'APK dans l'onglet *Actions* (artefact `CUPLAJ-apk`) ou la page *Releases* et installez‑le sur chaque téléphone.", "Sur le téléphone de la régie, activez le point d'accès (ou mettez tous les téléphones sur le même Wi‑Fi).", "Sur le téléphone de la régie, choisissez **Régie** → *Démarrer le hub*. Notez le PIN des acteurs et, si besoin, un code de salle.", "Sur les autres, choisissez **Spectateur** ou **Acteur**, sélectionnez le hub dans la liste (ou saisissez son adresse) et connectez‑vous.", "Chaque téléphone reçoit un numéro (régie 100, acteurs 201…, spectateurs 6 chiffres). Décrochez et appelez."], "h_eras": "Les trois époques", "eras": ["**1985 · cadran** — un vrai cadran qu'on tourne ; les impulsions s'entendent ; deux longues sonneries.", "**1995 · touches** — tonalités DTMF, carnet de numéros, messages de bipeur.", "**2003 · mobile** — noms dans le répertoire, identification de l'appelant, SMS limités à 160 caractères."], "h_party": "Comment fonctionne la ligne partagée", "party": ["Deux téléphones sont *couplés* par la régie (ou automatiquement par paires). Ils partagent la ligne N, positions 1 et 2.", "Un appel à l'abonné 1 fait sonner les deux ; l'abonné 1 entend la cadence de son numéro (une longue sonnerie), l'abonné 2 celle du sien (deux courtes).", "Celui qui décroche prend l'appel ; l'autre téléphone cesse de sonner.", "Tant que la ligne est utilisée, le voisin qui décroche entend la conversation et les interlocuteurs entendent un léger clic.", "Un auditeur peut *intervenir* et parler ; un appel vers un téléphone couplé dont la ligne est occupée reçoit la tonalité d'occupation.", "La régie peut surveiller n'importe quelle ligne discrètement (sans clic)."], "h_docs": "Documentation", "docs": {"guide": "Guide d'utilisation", "protocol": "Protocole", "audit": "Audit adversarial", "changelog": "Journal des modifications", "site": "Site de présentation"}, "h_status": "État réel", "status": "La logique du hub (appels, ligne partagée, permissions, limites, persistance) est couverte par ~55 vérifications automatiques exécutées sur une JVM. L'interface Android et le chemin audio ont passé le contrôle de types face au SDK Android 14 mais **n'ont pas encore été testés sur de vrais appareils** ; l'APK est construit par GitHub Actions. Testez avec quelques téléphones avant un spectacle. Le trafic du réseau local n'est pas chiffré (le PIN et le code de salle écartent les curieux de bonne foi, ce n'est pas de la cryptographie). Le réseau de la version 1.1 (chiffrement, P2P, SIP, SMS) est couvert par des tests du hub contre un serveur SIP simulé, mais **n'a pas** été essayé sur de vrais opérateurs, NAT ou cartes SIM. Les liaisons Bluetooth, Wi‑Fi Direct et mDNS (1.2) partagent la même couche de transport, testée sur JVM avec des canaux simulés, mais **n'ont pas** été essayées sur de vrais appareils ; le comportement varie selon les fabricants. Le plug and play (connexion auto, invitations, Wi‑Fi Aware, 1.3) **n'a pas** été testé sur appareils ; le format des invitations est couvert par des tests JVM. Les corrections de l'audit 1.4 et les codecs AIR sont couverts par des tests JVM (bruit simulé, dérive d'horloge, mauvaise clé, interférence) ; le code de la lampe, caméra, micro, haut‑parleur, moteur et accéléromètre **n'est pas** testé sur de vrais téléphones, et la portée et la vitesse réelles différeront.", "h_priv": "Confidentialité", "priv": "Aucune statistique, aucun serveur, aucun compte. Le son et les messages ne circulent que dans votre réseau local, entre les téléphones et le hub. Le hub conserve numéros, groupes et couplages sur le téléphone de la régie pour qu'un redémarrage ne les perde pas.", "h_support": "Soutenir le projet", "h_lic": "Licence", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Guide d'utilisation", "s": {"hero": "La ligne partagée, de retour sur scène.", "sub": "Un central téléphonique privé pour le théâtre immersif, fait des téléphones que votre public a déjà en poche.", "get": "Télécharger l'APK", "repo": "Code source sur GitHub", "demo": "Essayez la ligne partagée", "demo_hint": "Les téléphones A1 et A2 partagent la ligne 1 ; B1 et B2 la ligne 2.", "call": "appelle", "answer": "Répondre", "hangup": "Raccrocher", "listen": "Écouter", "intervene": "Intervenir", "idle": "libre", "ringing": "sonne", "talking": "parle", "busy": "tonalité occupé", "hears": "écoute", "click": "*clic*", "ring_long": "une longue sonnerie", "ring_short": "deux courtes sonneries", "log": "Journal", "reset": "Réinitialiser", "line": "ligne", "eras": "Trois époques", "coffee": "Offrez‑moi un café", "rights": "Licence MIT"}}, "it": {"name": "Italiano", "tag": "Telefonia a linea condivisa per il teatro immersivo", "ver": "Versione: 1.4.0 · Ultimo aggiornamento: 2026-11-24", "intro": "CUPLAJ trasforma una flotta di normali telefoni Android in una centralina telefonica privata per il teatro immersivo. Organizzatori e attori parlano con gli spettatori (e tra loro) tramite il Wi‑Fi locale del luogo — senza cloud, senza account, senza pubblicità. La sua funzione distintiva è il *cuplaj*: la **linea condivisa** dei telefoni fissi dagli anni '80 fino al 2006 circa, in cui due abbonati dividevano la stessa linea, squillavano con cadenze diverse e potevano ascoltarsi a vicenda.", "h_feat": "Funzioni", "feat": ["**Tre epoche di telefono** — 1985 disco rotante (impulsi udibili), 1995 tastiera (toni DTMF), 2003 cellulare (SMS, 160 caratteri). La regia può cambiare epoca in diretta.", "**Linea condivisa (cuplaj)** — due telefoni dividono una linea; una chiamata a uno fa squillare entrambi con la cadenza dell'abbonato chiamato; il vicino che risponde per primo prende la chiamata; alzando la cornetta durante la conversazione del vicino si ascolta, e si può persino intervenire.", "**Nessuna infrastruttura** — un telefono (la regia) è l'hub. Gli altri entrano via Wi‑Fi o tramite il suo hotspot; gli hub si trovano da soli; codice sala e PIN facoltativi.", "**Voce** — vere chiamate (8 kHz), annuncio push‑to‑talk dalla regia, canale backstage per la squadra.", "**Segnali** — testo a schermo intero, vibrazione, squillo, flash, altoparlante, cambio di epoca, nuovo contatto, voce parlata (sintesi locale), effetti sonori, schermo nero, chiamata fantasma.", "**Copione** — elenco di segnali con GO e PLAY (a tempo), riordino, import/export JSON.", "**Strumenti di regia** — numeri, gruppi, accoppiamento/disaccoppiamento, coppie automatiche, ascolto discreto, muto, dimentica, livelli batteria, registro eventi, stato che sopravvive al riavvio, limitazione del flusso.", "**8 lingue e accessibilità** — inglese, rumeno, francese, italiano, spagnolo, portoghese, tedesco, ungherese; dimensione del testo regolabile; risposta dalla schermata di blocco; funziona in background.", "**Internet e dati mobili (1.1)** — connessione con `host` o `host:porta`; chiave di rete AES‑128‑GCM opzionale; compressione G.711 automatica fuori dalla rete locale; keepalive.", "**Chiamate dirette P2P (1.1)** — l'audio va da telefono a telefono via UDP con hole punching, con ripiego sul relay dell'hub; la regia può disattivarlo, limitarlo alla rete locale (predefinito) o aprirlo ovunque.", "**Gateway VoIP / SIP (1.1)** — il telefono della regia si registra presso un provider SIP o un PBX; la squadra compone `0`+numero per uscire, le chiamate SIP in arrivo squillano a un numero interno.", "**Rete mobile (1.1)** — gateway SMS tramite la SIM del telefono della regia (invio e ricezione), cue *chiamata reale* che apre il tastierino, indicatore Wi‑Fi / mobile.", "**Più modi per collegarsi (1.2)** — Bluetooth (senza router, circa 7 telefoni), Wi‑Fi Direct (il telefono della regia crea una propria rete Wi‑Fi) e scoperta mDNS, oltre a Wi‑Fi, hotspot, tethering USB, Ethernet e dati mobili.", "**Plug and play (1.3)** — il telefono della regia apre da solo tutti i collegamenti utili; gli altri toccano *Trova e unisciti automaticamente* o un link d'invito. Aggiunge Wi‑Fi Aware.", "**Rinforzato e senza rete (1.4)** — audit con pubblico ostile e correzioni, e CUPLAJ‑AIR: tre protocolli originali che trasportano cue e inviti senza alcuna rete (torcia → fotocamera, altoparlante → microfono, vibrazione → accelerometro)."], "h_quick": "Avvio rapido", "quick": ["Scarica l'APK dalla scheda *Actions* (artefatto `CUPLAJ-apk`) o dalla pagina *Releases* e installalo su ogni telefono.", "Sul telefono della regia attiva l'hotspot (oppure collega tutti i telefoni allo stesso Wi‑Fi).", "Sul telefono della regia scegli **Regia** → *Avvia l'hub*. Annota il PIN per gli attori e, se vuoi, un codice sala.", "Sugli altri scegli **Spettatore** o **Attore**, seleziona l'hub dall'elenco (o scrivi il suo indirizzo) e connettiti.", "Ogni telefono riceve un numero (regia 100, attori 201…, spettatori 6 cifre). Alza la cornetta e chiama."], "h_eras": "Le tre epoche", "eras": ["**1985 · disco** — un vero disco da far girare; gli impulsi si sentono; due squilli lunghi.", "**1995 · tasti** — toni DTMF, rubrica di numeri, messaggi del cercapersone.", "**2003 · cellulare** — nomi in rubrica, identificazione del chiamante, SMS limitati a 160 caratteri."], "h_party": "Come funziona la linea condivisa", "party": ["Due telefoni sono *accoppiati* dalla regia (o automaticamente a coppie). Condividono la linea N, posizioni 1 e 2.", "Una chiamata all'abbonato 1 fa squillare entrambi; l'abbonato 1 sente la cadenza del proprio numero (uno squillo lungo), l'abbonato 2 la sua (due brevi).", "Chi risponde prende la chiamata; l'altro telefono smette di squillare.", "Finché la linea è in uso, il vicino che alza la cornetta sente la conversazione e gli interlocutori sentono un leggero clic.", "Chi ascolta può *intervenire* e parlare; una chiamata a un telefono accoppiato la cui linea è occupata riceve il segnale di occupato.", "La regia può monitorare qualsiasi linea in silenzio (senza clic)."], "h_docs": "Documentazione", "docs": {"guide": "Guida all'uso", "protocol": "Protocollo", "audit": "Audit avversariale", "changelog": "Registro delle modifiche", "site": "Sito di presentazione"}, "h_status": "Stato reale", "status": "La logica dell'hub (chiamate, linea condivisa, permessi, limiti, persistenza) è coperta da ~55 verifiche automatiche eseguite su una JVM. L'interfaccia Android e il percorso audio hanno superato il controllo dei tipi rispetto all'SDK Android 14 ma **non sono ancora stati provati su dispositivi reali**; l'APK è costruito da GitHub Actions. Prova con qualche telefono prima dello spettacolo. Il traffico sulla rete locale non è cifrato (PIN e codice sala tengono fuori gli estranei in buona fede, non sono crittografia). La rete della versione 1.1 (cifratura, P2P, SIP, SMS) è coperta da test dell'hub contro un server SIP simulato, ma **non** è stata provata su operatori, NAT o SIM reali. I collegamenti Bluetooth, Wi‑Fi Direct e mDNS (1.2) usano lo stesso livello di trasporto, testato su JVM con canali simulati, ma **non** sono stati provati su dispositivi reali; il comportamento varia tra i produttori. Il plug and play (collegamento automatico, inviti, Wi‑Fi Aware, 1.3) **non** è stato provato su dispositivi; il formato degli inviti è coperto da test JVM. Le correzioni dell'audit 1.4 e i codec AIR sono coperti da test JVM (rumore simulato, deriva di clock, chiave errata, interferenza); il codice per torcia, fotocamera, microfono, altoparlante, motore e accelerometro **non** è testato su telefoni reali, e portata e velocità reali saranno diverse.", "h_priv": "Privacy", "priv": "Nessuna statistica, nessun server, nessun account. Audio e messaggi viaggiano solo nella vostra rete locale, tra i telefoni e l'hub. L'hub conserva numeri, gruppi e accoppiamenti sul telefono della regia, così un riavvio non li perde.", "h_support": "Sostieni il progetto", "h_lic": "Licenza", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Guida all'uso", "s": {"hero": "La linea condivisa, di nuovo in scena.", "sub": "Una centralina telefonica privata per il teatro immersivo, fatta con i telefoni che il pubblico ha già in tasca.", "get": "Scarica l'APK", "repo": "Codice sorgente su GitHub", "demo": "Prova la linea condivisa", "demo_hint": "I telefoni A1 e A2 condividono la linea 1; B1 e B2 la linea 2.", "call": "chiama", "answer": "Rispondi", "hangup": "Riaggancia", "listen": "Ascolta", "intervene": "Intervieni", "idle": "libero", "ringing": "squilla", "talking": "parla", "busy": "segnale di occupato", "hears": "ascolta", "click": "*clic*", "ring_long": "uno squillo lungo", "ring_short": "due squilli brevi", "log": "Registro", "reset": "Azzera", "line": "linea", "eras": "Tre epoche", "coffee": "Offrimi un caffè", "rights": "Licenza MIT"}}, "es": {"name": "Español", "tag": "Telefonía de línea compartida para teatro inmersivo", "ver": "Versión: 1.4.0 · Última actualización: 2026-11-24", "intro": "CUPLAJ convierte una flota de teléfonos Android corrientes en una centralita telefónica privada para teatro inmersivo. Organizadores y actores hablan con el público (y entre sí) por el Wi‑Fi local del recinto — sin nube, sin cuentas, sin anuncios. Su función distintiva es el *cuplaj*: la **línea compartida** de los teléfonos fijos desde los años 80 hasta cerca de 2006, en la que dos abonados compartían una línea, sonaban con cadencias distintas y podían oírse el uno al otro.", "h_feat": "Funciones", "feat": ["**Tres épocas de teléfono** — 1985 disco rotatorio (pulsos audibles), 1995 teclado (tonos DTMF), 2003 móvil (SMS, 160 caracteres). La regiduría puede cambiar de época en directo.", "**Línea compartida (cuplaj)** — dos teléfonos comparten una línea; una llamada a uno hace sonar ambos con la cadencia del abonado llamado; el vecino que descuelga primero se lleva la llamada; descolgar durante la conversación del vecino permite escuchar e incluso intervenir.", "**Sin infraestructura** — un teléfono (la regiduría) es el hub. Los demás entran por Wi‑Fi o por su punto de acceso; los hubs se encuentran solos; código de sala y PIN opcionales.", "**Voz** — llamadas reales (8 kHz), megafonía pulsar‑para‑hablar desde la regiduría, canal de bambalinas para el equipo.", "**Señales** — texto a pantalla completa, vibración, timbre, flash, altavoz, cambio de época, contacto nuevo, voz hablada (síntesis local), efectos de sonido, pantalla negra, llamada fantasma.", "**Guion** — lista de señales con GO y PLAY (temporizado), reordenar, importar/exportar JSON.", "**Herramientas de regiduría** — números, grupos, acoplar/desacoplar, parejas automáticas, escucha discreta, silenciar, olvidar, niveles de batería, registro de eventos, estado que sobrevive a reinicios, limitación de flujo.", "**8 idiomas y accesibilidad** — inglés, rumano, francés, italiano, español, portugués, alemán, húngaro; tamaño de texto ajustable; respuesta desde la pantalla de bloqueo; funciona en segundo plano.", "**Internet y datos móviles (1.1)** — conexión con `host` o `host:puerto`; clave de red AES‑128‑GCM opcional; compresión G.711 automática fuera de la red local; keepalive.", "**Llamadas directas P2P (1.1)** — el audio va de teléfono a teléfono por UDP con perforación de NAT, con respaldo en el relé del hub; la regiduría puede desactivarlo, limitarlo a la red local (por defecto) o abrirlo a cualquier lugar.", "**Pasarela VoIP / SIP (1.1)** — el teléfono de la regiduría se registra en un proveedor SIP o una PBX; el equipo marca `0`+número para salir, las llamadas SIP entrantes suenan en un número interno.", "**Red móvil (1.1)** — pasarela SMS mediante la SIM del teléfono de la regiduría (envío y recepción), cue de *llamada real* que abre el marcador e indicador Wi‑Fi / móvil.", "**Más formas de conectarse (1.2)** — Bluetooth (sin router, unos 7 teléfonos), Wi‑Fi Direct (el teléfono de la regiduría crea su propia red Wi‑Fi) y descubrimiento mDNS, además de Wi‑Fi, punto de acceso, anclaje USB, Ethernet y datos móviles.", "**Plug and play (1.3)** — el teléfono de la regiduría abre solo todos los enlaces útiles; los demás pulsan *Buscar y unirme automáticamente* o un enlace de invitación. Añade Wi‑Fi Aware.", "**Reforzado y sin red (1.4)** — auditoría con público hostil y correcciones, y CUPLAJ‑AIR: tres protocolos originales que llevan señales e invitaciones sin ninguna red (linterna → cámara, altavoz → micrófono, vibración → acelerómetro)."], "h_quick": "Inicio rápido", "quick": ["Obtén el APK en la pestaña *Actions* (artefacto `CUPLAJ-apk`) o en la página *Releases* e instálalo en cada teléfono.", "En el teléfono de la regiduría activa el punto de acceso (o pon todos los teléfonos en el mismo Wi‑Fi).", "En el teléfono de la regiduría elige **Regiduría** → *Iniciar el hub*. Anota el PIN de los actores y, si quieres, un código de sala.", "En los demás elige **Espectador** o **Actor**, selecciona el hub de la lista (o escribe su dirección) y conéctate.", "Cada teléfono recibe un número (regiduría 100, actores 201…, espectadores 6 cifras). Descuelga y llama."], "h_eras": "Las tres épocas", "eras": ["**1985 · disco** — un disco que se gira de verdad; los pulsos se oyen; dos timbrazos largos.", "**1995 · teclas** — tonos DTMF, libreta de números, mensajes de busca.", "**2003 · móvil** — nombres en la agenda, identificación de llamada, SMS limitados a 160 caracteres."], "h_party": "Cómo funciona la línea compartida", "party": ["La regiduría *acopla* dos teléfonos (o lo hace automáticamente por parejas). Comparten la línea N, posiciones 1 y 2.", "Una llamada al abonado 1 hace sonar ambos; el abonado 1 oye la cadencia de su número (un timbrazo largo), el abonado 2 la suya (dos cortos).", "Quien contesta se lleva la llamada; el otro teléfono deja de sonar.", "Mientras la línea está en uso, el vecino que descuelga oye la conversación y los interlocutores oyen un leve clic.", "Quien escucha puede *intervenir* y hablar; una llamada a un teléfono acoplado cuya línea está ocupada recibe el tono de ocupado.", "La regiduría puede vigilar cualquier línea en silencio (sin clic)."], "h_docs": "Documentación", "docs": {"guide": "Guía de uso", "protocol": "Protocolo", "audit": "Auditoría adversarial", "changelog": "Registro de cambios", "site": "Sitio de presentación"}, "h_status": "Estado real", "status": "La lógica del hub (llamadas, línea compartida, permisos, límites, persistencia) está cubierta por ~55 comprobaciones automáticas que se ejecutan en una JVM. La interfaz Android y la ruta de audio han pasado la comprobación de tipos frente al SDK de Android 14, pero **aún no se han probado en dispositivos reales**; el APK lo construye GitHub Actions. Prueba con unos pocos teléfonos antes de la función. El tráfico de la red local no está cifrado (el PIN y el código de sala frenan a extraños de buena fe, no son criptografía). La red de la versión 1.1 (cifrado, P2P, SIP, SMS) está cubierta por pruebas del hub contra un servidor SIP simulado, pero **no** se ha probado con operadores, NAT ni SIM reales. Los enlaces Bluetooth, Wi‑Fi Direct y mDNS (1.2) comparten la misma capa de transporte, probada en JVM con canales simulados, pero **no** se han probado en dispositivos reales; el comportamiento varía entre fabricantes. El plug and play (conexión automática, invitaciones, Wi‑Fi Aware, 1.3) **no** se ha probado en dispositivos; el formato de las invitaciones está cubierto por pruebas JVM. Las correcciones de la auditoría 1.4 y los códecs AIR están cubiertos por pruebas JVM (ruido simulado, deriva de reloj, clave errónea, interferencia); el código de linterna, cámara, micrófono, altavoz, motor y acelerómetro **no** está probado en teléfonos reales, y el alcance y la velocidad reales serán distintos.", "h_priv": "Privacidad", "priv": "Sin analítica, sin servidores, sin cuentas. El audio y los mensajes solo viajan por vuestra red local, entre los teléfonos y el hub. El hub guarda números, grupos y acoplamientos en el teléfono de la regiduría para que un reinicio no los pierda.", "h_support": "Apoya el proyecto", "h_lic": "Licencia", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Guía de uso", "s": {"hero": "La línea compartida, de vuelta al escenario.", "sub": "Una centralita telefónica privada para teatro inmersivo, hecha con los teléfonos que tu público ya lleva en el bolsillo.", "get": "Descargar el APK", "repo": "Código fuente en GitHub", "demo": "Prueba la línea compartida", "demo_hint": "Los teléfonos A1 y A2 comparten la línea 1; B1 y B2 la línea 2.", "call": "llama", "answer": "Contestar", "hangup": "Colgar", "listen": "Escuchar", "intervene": "Intervenir", "idle": "libre", "ringing": "suena", "talking": "habla", "busy": "tono de ocupado", "hears": "escucha", "click": "*clic*", "ring_long": "un timbrazo largo", "ring_short": "dos timbrazos cortos", "log": "Registro", "reset": "Reiniciar", "line": "línea", "eras": "Tres épocas", "coffee": "Invítame a un café", "rights": "Licencia MIT"}}, "pt": {"name": "Português", "tag": "Telefonia de linha partilhada para teatro imersivo", "ver": "Versão: 1.4.0 · Última atualização: 2026-11-24", "intro": "O CUPLAJ transforma uma frota de telemóveis Android comuns numa central telefónica privada para teatro imersivo. Organizadores e atores falam com os espectadores (e entre si) pela rede Wi‑Fi local do espaço — sem nuvem, sem contas, sem anúncios. A sua função distintiva é o *cuplaj*: a **linha partilhada** dos telefones fixos dos anos 80 até cerca de 2006, em que dois assinantes partilhavam a mesma linha, tocavam com cadências diferentes e podiam ouvir-se um ao outro.", "h_feat": "Funcionalidades", "feat": ["**Três épocas de telefone** — 1985 disco rotativo (impulsos audíveis), 1995 teclado (tons DTMF), 2003 telemóvel (SMS, 160 carateres). A régie pode mudar de época em direto.", "**Linha partilhada (cuplaj)** — dois telefones partilham uma linha; uma chamada para um faz tocar ambos com a cadência do assinante chamado; o vizinho que atender primeiro fica com a chamada; levantar o auscultador durante a conversa do vizinho permite ouvir e até intervir.", "**Sem infraestrutura** — um telefone (a régie) é o hub. Os outros entram por Wi‑Fi ou pelo hotspot do hub; os hubs são encontrados automaticamente; código de sala e PIN opcionais.", "**Voz** — chamadas reais (8 kHz), anúncio premir‑para‑falar a partir da régie, canal de bastidores para a equipa.", "**Sinais** — texto em ecrã inteiro, vibração, toque, flash, altifalante, mudança de época, novo contacto, voz falada (síntese local), efeitos sonoros, ecrã preto, chamada fantasma.", "**Guião** — lista de sinais com GO e PLAY (temporizado), reordenar, importar/exportar JSON.", "**Ferramentas da régie** — números, grupos, acoplar/desacoplar, pares automáticos, escuta discreta, silenciar, esquecer, níveis de bateria, registo de eventos, estado que sobrevive a reinícios, limitação de fluxo.", "**8 idiomas e acessibilidade** — inglês, romeno, francês, italiano, espanhol, português, alemão, húngaro; tamanho do texto ajustável; atender a partir do ecrã bloqueado; funciona em segundo plano.", "**Internet e dados móveis (1.1)** — ligação com `host` ou `host:porta`; chave de rede AES‑128‑GCM opcional; compressão G.711 automática fora da rede local; keepalive.", "**Chamadas diretas P2P (1.1)** — o áudio vai de telemóvel a telemóvel por UDP com perfuração de NAT, com recurso ao relé do hub; a régie pode desligar, limitar à rede local (predefinição) ou abrir a qualquer lado.", "**Porta VoIP / SIP (1.1)** — o telemóvel da régie regista‑se num fornecedor SIP ou PBX; a equipa marca `0`+número para sair, as chamadas SIP recebidas tocam num número interno.", "**Rede móvel (1.1)** — porta SMS através do SIM do telemóvel da régie (envio e receção), cue de *chamada real* que abre o marcador e indicador Wi‑Fi / móvel.", "**Mais formas de ligação (1.2)** — Bluetooth (sem router, cerca de 7 telemóveis), Wi‑Fi Direct (o telemóvel da régie cria a sua própria rede Wi‑Fi) e descoberta mDNS, além de Wi‑Fi, hotspot, partilha por USB, Ethernet e dados móveis.", "**Plug and play (1.3)** — o telemóvel da régie abre sozinho todas as ligações úteis; os outros tocam em *Encontrar e juntar‑me automaticamente* ou num link de convite. Acrescenta Wi‑Fi Aware.", "**Reforçado e sem rede (1.4)** — auditoria com público hostil e correções, e CUPLAJ‑AIR: três protocolos originais que levam sinais e convites sem qualquer rede (lanterna → câmara, altifalante → microfone, vibração → acelerómetro)."], "h_quick": "Início rápido", "quick": ["Obtém o APK no separador *Actions* (artefacto `CUPLAJ-apk`) ou na página *Releases* e instala-o em cada telemóvel.", "No telemóvel da régie ativa o hotspot (ou põe todos os telemóveis no mesmo Wi‑Fi).", "No telemóvel da régie escolhe **Régie** → *Iniciar o hub*. Anota o PIN dos atores e, se quiseres, um código de sala.", "Nos outros escolhe **Espectador** ou **Ator**, seleciona o hub na lista (ou escreve o endereço) e liga-te.", "Cada telemóvel recebe um número (régie 100, atores 201…, espectadores 6 dígitos). Levanta o auscultador e chama."], "h_eras": "As três épocas", "eras": ["**1985 · disco** — um disco que se roda a sério; os impulsos ouvem-se; dois toques longos.", "**1995 · teclas** — tons DTMF, caderneta de números, mensagens de pager.", "**2003 · telemóvel** — nomes na agenda, identificação de chamadas, SMS limitados a 160 carateres."], "h_party": "Como funciona a linha partilhada", "party": ["Dois telefones são *acoplados* pela régie (ou automaticamente em pares). Partilham a linha N, posições 1 e 2.", "Uma chamada para o assinante 1 faz tocar ambos; o assinante 1 ouve a cadência do seu número (um toque longo), o assinante 2 a do seu (dois curtos).", "Quem atende fica com a chamada; o outro telefone deixa de tocar.", "Enquanto a linha está em uso, o vizinho que levanta o auscultador ouve a conversa e os interlocutores ouvem um leve clique.", "Quem escuta pode *intervir* e falar; uma chamada para um telefone acoplado cuja linha está ocupada recebe o sinal de ocupado.", "A régie pode monitorizar qualquer linha em silêncio (sem clique)."], "h_docs": "Documentação", "docs": {"guide": "Guia de utilização", "protocol": "Protocolo", "audit": "Auditoria adversarial", "changelog": "Registo de alterações", "site": "Site de apresentação"}, "h_status": "Estado real", "status": "A lógica do hub (chamadas, linha partilhada, permissões, limites, persistência) está coberta por ~55 verificações automáticas executadas numa JVM. A interface Android e o caminho de áudio passaram a verificação de tipos contra o SDK Android 14, mas **ainda não foram testados em dispositivos reais**; o APK é construído pelo GitHub Actions. Testa com alguns telemóveis antes de um espetáculo. O tráfego da rede local não é cifrado (o PIN e o código de sala afastam estranhos de boa‑fé, não são criptografia). A rede da versão 1.1 (cifra, P2P, SIP, SMS) está coberta por testes do hub contra um servidor SIP simulado, mas **não** foi experimentada em operadores, NAT ou SIM reais. As ligações Bluetooth, Wi‑Fi Direct e mDNS (1.2) partilham a mesma camada de transporte, testada em JVM com canais simulados, mas **não** foram experimentadas em dispositivos reais; o comportamento varia entre fabricantes. O plug and play (ligação automática, convites, Wi‑Fi Aware, 1.3) **não** foi testado em dispositivos; o formato dos convites é coberto por testes JVM. As correções da auditoria 1.4 e os codecs AIR estão cobertos por testes JVM (ruído simulado, deriva de relógio, chave errada, interferência); o código de lanterna, câmara, microfone, altifalante, motor e acelerómetro **não** está testado em telemóveis reais, e o alcance e a velocidade reais serão diferentes.", "h_priv": "Privacidade", "priv": "Sem estatísticas, sem servidores, sem contas. O áudio e as mensagens circulam apenas na vossa rede local, entre os telemóveis e o hub. O hub guarda números, grupos e acoplamentos no telemóvel da régie para que um reinício não os perca.", "h_support": "Apoia o projeto", "h_lic": "Licença", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Guia de utilização", "s": {"hero": "A linha partilhada, de volta ao palco.", "sub": "Uma central telefónica privada para teatro imersivo, feita com os telemóveis que o público já traz no bolso.", "get": "Descarregar o APK", "repo": "Código‑fonte no GitHub", "demo": "Experimenta a linha partilhada", "demo_hint": "Os telefones A1 e A2 partilham a linha 1; B1 e B2 a linha 2.", "call": "chama", "answer": "Atender", "hangup": "Desligar", "listen": "Escutar", "intervene": "Intervir", "idle": "livre", "ringing": "toca", "talking": "fala", "busy": "sinal de ocupado", "hears": "escuta", "click": "*clique*", "ring_long": "um toque longo", "ring_short": "dois toques curtos", "log": "Registo", "reset": "Repor", "line": "linha", "eras": "Três épocas", "coffee": "Oferece‑me um café", "rights": "Licença MIT"}}, "de": {"name": "Deutsch", "tag": "Gemeinschaftsanschluss-Telefonie für immersives Theater", "ver": "Version: 1.4.0 · Letzte Aktualisierung: 2026-11-24", "intro": "CUPLAJ verwandelt eine Flotte gewöhnlicher Android-Telefone in eine private Telefonanlage für immersives Theater. Organisatoren und Schauspieler sprechen über das lokale WLAN des Veranstaltungsorts mit den Zuschauern (und untereinander) — ohne Cloud, ohne Konten, ohne Werbung. Das Kernmerkmal ist der *Cuplaj*: der **Gemeinschaftsanschluss** der Festnetztelefone von den 1980er-Jahren bis etwa 2006, bei dem sich zwei Teilnehmer eine Leitung teilten, mit unterschiedlichem Rhythmus klingelten und einander mithören konnten.", "h_feat": "Funktionen", "feat": ["**Drei Telefon-Epochen** — 1985 Wählscheibe (hörbare Impulse), 1995 Tastatur (DTMF-Töne), 2003 Handy (SMS, 160 Zeichen). Die Regie kann die Epoche live wechseln.", "**Gemeinschaftsanschluss (Cuplaj)** — zwei Telefone teilen eine Leitung; ein Anruf bei einem lässt beide mit dem Rhythmus des gerufenen Teilnehmers klingeln; wer zuerst abhebt, nimmt das Gespräch an; wer während des Nachbargesprächs abhebt, hört mit und kann sogar eingreifen.", "**Keine Infrastruktur** — ein Telefon (die Regie) ist der Hub. Die anderen verbinden sich per WLAN oder über dessen Hotspot; Hubs werden automatisch gefunden; Raumcode und PIN optional.", "**Stimme** — echte Gespräche (8 kHz), Push-to-Talk-Durchsagen von der Regie, Backstage-Kanal für das Team.", "**Signale** — Vollbildtext, Vibration, Klingeln, Blitz, Lautsprecher, Epochenwechsel, neuer Kontakt, gesprochene Stimme (lokale Sprachsynthese), Klangeffekte, schwarzer Bildschirm, Geisteranruf.", "**Ablauf** — Signalliste mit GO und PLAY (zeitgesteuert), Umsortieren, JSON-Import/-Export.", "**Regie-Werkzeuge** — Nummern, Gruppen, Koppeln/Entkoppeln, automatische Paare, stilles Mithören, Stummschalten, Vergessen, Akkustände, Ereignisprotokoll, Zustand übersteht Neustarts, Ratenbegrenzung.", "**8 Sprachen und Barrierefreiheit** — Englisch, Rumänisch, Französisch, Italienisch, Spanisch, Portugiesisch, Deutsch, Ungarisch; einstellbare Textgröße; Annehmen vom Sperrbildschirm; läuft im Hintergrund.", "**Internet und Mobilfunk (1.1)** — Verbindung mit `Host` oder `Host:Port`; optionaler AES‑128‑GCM‑Netzwerkschlüssel; automatische G.711‑Kompression außerhalb des lokalen Netzes; Keepalive.", "**Direkte P2P‑Gespräche (1.1)** — Audio läuft per UDP mit Hole‑Punching direkt von Telefon zu Telefon, mit Rückfall auf das Hub‑Relay; die Regie kann es abschalten, auf das lokale Netz begrenzen (Standard) oder überall erlauben.", "**VoIP‑/SIP‑Gateway (1.1)** — das Regie‑Telefon registriert sich bei einem SIP‑Anbieter oder einer Telefonanlage; das Team wählt `0`+Nummer nach außen, eingehende SIP‑Anrufe klingeln an einer internen Nummer.", "**Mobilfunknetz (1.1)** — SMS‑Gateway über die SIM des Regie‑Telefons (Senden und Empfangen), Cue *echter Anruf*, der die Wähl‑App öffnet, und WLAN‑/Mobil‑Anzeige.", "**Weitere Verbindungsarten (1.2)** — Bluetooth (ohne Router, etwa 7 Telefone), Wi‑Fi Direct (das Regie‑Telefon baut ein eigenes WLAN auf) und mDNS‑Erkennung, zusätzlich zu WLAN, Hotspot, USB‑Tethering, Ethernet und Mobilfunk.", "**Plug and Play (1.3)** — das Regie‑Telefon öffnet alle passenden Verbindungen selbst; die anderen tippen auf *Automatisch finden und beitreten* oder auf einen Einladungslink. Neu: Wi‑Fi Aware.", "**Gehärtet und ohne Netz (1.4)** — Audit mit feindlichem Publikum samt Korrekturen, und CUPLAJ‑AIR: drei eigene Protokolle, die Cues und Einladungen ganz ohne Netz übertragen (Taschenlampe → Kamera, Lautsprecher → Mikrofon, Vibration → Beschleunigungssensor)."], "h_quick": "Schnellstart", "quick": ["Den APK im Tab *Actions* (Artefakt `CUPLAJ-apk`) oder auf der Seite *Releases* holen und auf jedem Telefon installieren.", "Auf dem Regie-Telefon den Hotspot einschalten (oder alle Telefone in dasselbe WLAN bringen).", "Auf dem Regie-Telefon **Regie** → *Hub starten* wählen. PIN für Schauspieler und optional einen Raumcode notieren.", "Auf den anderen **Zuschauer** oder **Schauspieler** wählen, den Hub in der Liste auswählen (oder seine Adresse eingeben) und verbinden.", "Jedes Telefon erhält eine Nummer (Regie 100, Schauspieler 201…, Zuschauer 6 Ziffern). Hörer abheben und anrufen."], "h_eras": "Die drei Epochen", "eras": ["**1985 · Wählscheibe** — eine echte Scheibe zum Drehen; die Impulse sind hörbar; zwei lange Klingeltöne.", "**1995 · Tasten** — DTMF-Töne, Notizbuch mit Nummern, Pager-Nachrichten.", "**2003 · Handy** — Namen im Adressbuch, Anruferkennung, SMS auf 160 Zeichen begrenzt."], "h_party": "So funktioniert der Gemeinschaftsanschluss", "party": ["Zwei Telefone werden von der Regie *gekoppelt* (oder automatisch paarweise). Sie teilen Leitung N, Plätze 1 und 2.", "Ein Anruf bei Teilnehmer 1 lässt beide klingeln; Teilnehmer 1 hört den Rhythmus seiner Nummer (ein langer Ton), Teilnehmer 2 den seinen (zwei kurze).", "Wer annimmt, bekommt das Gespräch; das andere Telefon hört auf zu klingeln.", "Solange die Leitung belegt ist, hört der Nachbar, der abhebt, das Gespräch mit, und die Gesprächspartner hören ein leises Klicken.", "Ein Mithörer kann *eingreifen* und sprechen; ein Anruf zu einem gekoppelten Telefon mit belegter Leitung erhält den Besetztton.", "Die Regie kann jede Leitung still überwachen (ohne Klicken)."], "h_docs": "Dokumentation", "docs": {"guide": "Benutzerhandbuch", "protocol": "Protokoll", "audit": "Adversarielles Audit", "changelog": "Änderungsprotokoll", "site": "Präsentationsseite"}, "h_status": "Ehrlicher Stand", "status": "Die Hub-Logik (Gespräche, Gemeinschaftsanschluss, Berechtigungen, Limits, Persistenz) wird von ~55 automatischen Prüfungen auf einer JVM abgedeckt. Die Android-Oberfläche und der Audiopfad haben die Typprüfung gegen das Android-14-SDK bestanden, wurden aber **noch nicht auf echten Geräten getestet**; der APK wird von GitHub Actions gebaut. Vor einer Vorstellung mit ein paar Telefonen testen. Der Verkehr im lokalen Netz ist nicht verschlüsselt (PIN und Raumcode halten gutgläubige Fremde fern, sie sind keine Kryptografie). Die Netzfunktionen der Version 1.1 (Verschlüsselung, P2P, SIP, SMS) sind durch Hub‑Tests gegen einen simulierten SIP‑Server abgedeckt, aber **nicht** an echten Anbietern, NATs oder SIM‑Karten erprobt. Die Verbindungen über Bluetooth, Wi‑Fi Direct und mDNS (1.2) nutzen dieselbe Transportschicht, auf der JVM mit simulierten Kanälen getestet, wurden aber **nicht** an echten Geräten erprobt; das Verhalten unterscheidet sich je nach Hersteller. Plug and Play (Auto‑Beitritt, Einladungen, Wi‑Fi Aware, 1.3) ist **nicht** an Geräten getestet; das Einladungsformat ist durch JVM‑Tests abgedeckt. Die Korrekturen des 1.4‑Audits und die AIR‑Codecs sind durch JVM‑Tests abgedeckt (simuliertes Rauschen, Taktdrift, falscher Schlüssel, Störungen); der Code für Taschenlampe, Kamera, Mikrofon, Lautsprecher, Motor und Beschleunigungssensor ist **nicht** auf echten Telefonen getestet, und echte Reichweite und Geschwindigkeit werden abweichen.", "h_priv": "Datenschutz", "priv": "Keine Analyse, keine Server, keine Konten. Ton und Nachrichten laufen nur in eurem lokalen Netz, zwischen den Telefonen und dem Hub. Der Hub speichert Nummern, Gruppen und Kopplungen auf dem Regie-Telefon, damit ein Neustart sie nicht verliert.", "h_support": "Projekt unterstützen", "h_lic": "Lizenz", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Benutzerhandbuch", "s": {"hero": "Der Gemeinschaftsanschluss, zurück auf der Bühne.", "sub": "Eine private Telefonanlage für immersives Theater, gebaut aus den Telefonen, die euer Publikum ohnehin in der Tasche hat.", "get": "APK herunterladen", "repo": "Quellcode auf GitHub", "demo": "Gemeinschaftsanschluss ausprobieren", "demo_hint": "Die Telefone A1 und A2 teilen Leitung 1; B1 und B2 teilen Leitung 2.", "call": "ruft an", "answer": "Annehmen", "hangup": "Auflegen", "listen": "Mithören", "intervene": "Eingreifen", "idle": "frei", "ringing": "klingelt", "talking": "spricht", "busy": "Besetztton", "hears": "hört mit", "click": "*Klick*", "ring_long": "ein langer Ton", "ring_short": "zwei kurze Töne", "log": "Protokoll", "reset": "Zurücksetzen", "line": "Leitung", "eras": "Drei Epochen", "coffee": "Spendier mir einen Kaffee", "rights": "MIT-Lizenz"}}, "hu": {"name": "Magyar", "tag": "Közös vonalas telefonálás immerzív színházhoz", "ver": "Verzió: 1.4.0 · Utolsó frissítés: 2026-11-24", "intro": "A CUPLAJ hétköznapi Android-telefonok flottáját alakítja magán telefonközponttá immerzív színház számára. A szervezők és a színészek a helyszín helyi Wi‑Fi hálózatán beszélnek a nézőkkel (és egymással) — felhő, fiók és reklám nélkül. Névadó funkciója a *cuplaj*: az 1980-as évektől nagyjából 2006-ig használt vezetékes telefonok **közös vonala**, amelyen két előfizető osztozott, eltérő ritmusban csengettek, és hallhatták egymást.", "h_feat": "Funkciók", "feat": ["**Három telefonkorszak** — 1985 tárcsás (hallható impulzusok), 1995 gombos (DTMF hangok), 2003 mobil (SMS, 160 karakter). A rendezés élőben válthat korszakot.", "**Közös vonal (cuplaj)** — két telefon osztozik egy vonalon; az egyiknek szóló hívás mindkettőt csörgeti a hívott előfizető ritmusában; aki előbb felveszi, azé a hívás; ha a szomszéd beszélgetése közben felveszed a kagylót, belehallgathatsz, sőt közbe is szólhatsz.", "**Infrastruktúra nélkül** — egy telefon (a rendezés) a hub. A többiek Wi‑Fi-n vagy a hub hotspotján csatlakoznak; a hubot automatikusan megtalálják; teremkód és PIN választható.", "**Hang** — valódi hívások (8 kHz), nyomva-tartásos hangosbemondás a rendezéstől, kulissza-csatorna a stábnak.", "**Jelzések** — teljes képernyős szöveg, rezgés, csengetés, vaku, hangszóró, korszakváltás, új névjegy, beszélt hang (helyi szövegfelolvasás), hangeffektek, fekete képernyő, szellemhívás.", "**Forgatókönyv** — jelzéslista GO és PLAY (időzített) gombbal, átrendezés, JSON import/export.", "**Rendezői eszközök** — számok, csoportok, párosítás/szétválasztás, automatikus párok, csendes belehallgatás, némítás, törlés, akkumulátorszint, eseménynapló, újraindítást túlélő állapot, forgalomkorlátozás.", "**8 nyelv és hozzáférhetőség** — angol, román, francia, olasz, spanyol, portugál, német, magyar; állítható szövegméret; hívásfogadás a zárolt képernyőről; háttérben is fut.", "**Internet és mobiladat (1.1)** — csatlakozás `host` vagy `host:port` megadásával; opcionális AES‑128‑GCM hálózati kulcs; automatikus G.711 tömörítés a helyi hálózaton kívül; keepalive.", "**Közvetlen P2P hívások (1.1)** — a hang UDP‑n, lyukasztással megy telefonról telefonra, szükség esetén a hub közvetítőjére visszaesve; a rendező kikapcsolhatja, helyi hálózatra korlátozhatja (alap) vagy bárhová engedheti.", "**VoIP / SIP átjáró (1.1)** — a rendezői telefon bejelentkezik egy SIP‑szolgáltatóhoz vagy alközpontba; a stáb `0`+számot tárcsáz kifelé, a bejövő SIP‑hívások egy belső számon csengenek.", "**Mobilhálózat (1.1)** — SMS‑átjáró a rendezői telefon SIM‑jén át (küldés és fogadás), *valódi hívás* cue, amely megnyitja a tárcsázót, és Wi‑Fi / mobil jelző.", "**További csatlakozási módok (1.2)** — Bluetooth (router nélkül, kb. 7 telefon), Wi‑Fi Direct (a rendezői telefon saját Wi‑Fi hálózatot hoz létre) és mDNS‑felderítés, a Wi‑Fi, hotspot, USB‑megosztás, Ethernet és mobiladat mellett.", "**Plug and play (1.3)** — a rendezői telefon magától megnyit minden megfelelő kapcsolatot; a többiek az *Automatikus keresés és csatlakozás* gombot vagy egy meghívó linket érintenek meg. Újdonság: Wi‑Fi Aware.", "**Megerősítve és hálózat nélkül (1.4)** — ellenséges közönségre méretezett átvizsgálás javításokkal, és a CUPLAJ‑AIR: három saját protokoll, amely jelzéseket és meghívókat visz teljesen hálózat nélkül (zseblámpa → kamera, hangszóró → mikrofon, rezgés → gyorsulásmérő)."], "h_quick": "Gyors kezdés", "quick": ["Szerezd meg az APK-t az *Actions* fülről (`CUPLAJ-apk` artefaktum) vagy a *Releases* oldalról, és telepítsd minden telefonra.", "A rendezés telefonján kapcsold be a hotspotot (vagy tedd az összes telefont ugyanarra a Wi‑Fi-re).", "A rendezés telefonján válaszd a **Rendezés** → *Hub indítása* lehetőséget. Jegyezd fel a színészek PIN-jét és szükség esetén a teremkódot.", "A többin válaszd a **Néző** vagy **Színész** szerepet, jelöld ki a hubot a listában (vagy írd be a címét), és csatlakozz.", "Minden telefon kap egy számot (rendezés 100, színészek 201…, nézők 6 jegyű). Vedd fel a kagylót, és hívj."], "h_eras": "A három korszak", "eras": ["**1985 · tárcsás** — valódi tárcsa, amit tekerni kell; az impulzusok hallhatók; két hosszú csengetés.", "**1995 · gombos** — DTMF hangok, számjegyzet, csipogó-üzenetek.", "**2003 · mobil** — nevek a telefonkönyvben, hívóazonosítás, legfeljebb 160 karakteres SMS."], "h_party": "Hogyan működik a közös vonal", "party": ["A rendezés *párosít* két telefont (vagy automatikusan párokat képez). Az N. vonalon osztoznak, az 1. és 2. helyen.", "Az 1. előfizetőnek szóló hívás mindkettőt csörgeti; az 1. előfizető a saját számának ritmusát hallja (egy hosszú csengetés), a 2. a sajátját (két rövid).", "Aki felveszi, azé a hívás; a másik telefon abbahagyja a csörgést.", "Amíg a vonal foglalt, a szomszéd, aki felveszi a kagylót, hallja a beszélgetést, a beszélők pedig halk kattanást hallanak.", "A belehallgató *közbeszólhat*; a párosított telefonra érkező hívás foglalt vonalnál foglaltjelzést kap.", "A rendezés bármelyik vonalat csendben (kattanás nélkül) megfigyelheti."], "h_docs": "Dokumentáció", "docs": {"guide": "Felhasználói útmutató", "protocol": "Protokoll", "audit": "Ellenséges szemléletű audit", "changelog": "Változásnapló", "site": "Bemutatóoldal"}, "h_status": "Őszinte állapot", "status": "A hub logikáját (hívások, közös vonal, jogosultságok, korlátok, tartós állapot) ~55 automatikus ellenőrzés fedi le JVM-en. Az Android-felület és a hangút típusellenőrzésen átment az Android 14 SDK ellen, de **valódi eszközön még nem tesztelték**; az APK-t a GitHub Actions építi. Előadás előtt próbáld ki néhány telefonnal. A helyi hálózati forgalom nincs titkosítva (a PIN és a teremkód a jóhiszemű kívülállókat tartja távol, nem kriptográfia). Az 1.1‑es hálózati funkciókat (titkosítás, P2P, SIP, SMS) szimulált SIP‑szerver elleni hubtesztek fedik, de **nem** próbáltuk valódi szolgáltatóval, NAT‑tal vagy SIM‑mel. A Bluetooth, Wi‑Fi Direct és mDNS kapcsolatok (1.2) ugyanazt a szállítási réteget használják, amelyet JVM‑en szimulált csatornákkal teszteltünk, de **nem** próbáltuk valódi eszközön; a viselkedés gyártónként eltér. A plug and play (automatikus csatlakozás, meghívók, Wi‑Fi Aware, 1.3) **nincs** eszközökön tesztelve; a meghívó formátumát JVM‑tesztek fedik. Az 1.4‑es átvizsgálás javításait és az AIR kodekeket JVM‑tesztek fedik (szimulált zaj, órajel‑sodródás, hibás kulcs, interferencia); a zseblámpa, kamera, mikrofon, hangszóró, motor és gyorsulásmérő kódja **nincs** valódi telefonokon tesztelve, a valós hatótávolság és sebesség eltérhet.", "h_priv": "Adatvédelem", "priv": "Nincs analitika, nincs szerver, nincs fiók. A hang és az üzenetek csak a helyi hálózatotokon, a telefonok és a hub között haladnak. A hub a számokat, csoportokat és párosításokat a rendezés telefonján tárolja, hogy újraindítás után se vesszenek el.", "h_support": "Támogasd a projektet", "h_lic": "Licenc", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Felhasználói útmutató", "s": {"hero": "A közös vonal visszatér a színpadra.", "sub": "Magán telefonközpont immerzív színházhoz, abból a telefonból építve, amelyet a közönséged már a zsebében hord.", "get": "APK letöltése", "repo": "Forráskód a GitHubon", "demo": "Próbáld ki a közös vonalat", "demo_hint": "Az A1 és A2 telefon az 1. vonalon osztozik; a B1 és B2 a 2. vonalon.", "call": "hív", "answer": "Felvesz", "hangup": "Letesz", "listen": "Belehallgat", "intervene": "Közbeszól", "idle": "szabad", "ringing": "cseng", "talking": "beszél", "busy": "foglaltjelzés", "hears": "hallgat", "click": "*kattanás*", "ring_long": "egy hosszú csengetés", "ring_short": "két rövid csengetés", "log": "Napló", "reset": "Visszaállítás", "line": "vonal", "eras": "Három korszak", "coffee": "Hívj meg egy kávéra", "rights": "MIT licenc"}}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/&lt;(https:[^&]+)&gt;/g,'<a href="$1">$1</a>');
const LANGS=Object.keys(DATA);
let lang=(location.hash||'').slice(1);
if(!DATA[lang]){const n=(navigator.language||'en').slice(0,2);lang=DATA[n]?n:'en';}
let fs=+(localStorage.getItem('cuplaj_fs')||1);
try{}catch(e){}
function setFs(v){fs=Math.min(1.6,Math.max(.8,v));document.documentElement.style.setProperty('--fs',fs);try{localStorage.setItem('cuplaj_fs',fs)}catch(e){}}
setFs(fs);
$('fm').onclick=()=>setFs(fs-.1);$('fp').onclick=()=>setFs(fs+.1);
const bar=$('langbar');
LANGS.forEach(l=>{const b=document.createElement('button');b.textContent=l.toUpperCase();b.title=DATA[l].name;b.onclick=()=>{lang=l;location.hash=l;render();};bar.appendChild(b);});
/* ---- party-line demo ---- */
const P={A1:{line:1,slot:0},A2:{line:1,slot:1},B1:{line:2,slot:0},B2:{line:2,slot:1}};
let call=null,logs=[];
function reset(){for(const k in P){P[k].st='idle';P[k].ring=0;}call=null;logs=[];}
const nb=k=>k[0]+(k[1]==='1'?'2':'1');
function say(t){logs.push(t);if(logs.length>40)logs.shift();}
function doCall(from,to){
 const s=DATA[lang].s,p=P[from];
 if(p.st!=='idle')return;
 if(P[nb(from)].st==='talking'){say(from+': '+s.hears+' '+s.click);p.st='listening';return;}
 if(from===to||P[to].st!=='idle'||P[nb(to)].st==='talking'||P[nb(to)].st==='ringing'){p.st='busy';say(from+' '+s.call+' '+to+' → '+s.busy);return;}
 p.st='calling';call={a:from,b:to,answered:false};
 [to,nb(to)].forEach(k=>{if(P[k].st==='idle'){P[k].st='ringing';P[k].ring=P[k].slot;say(k+': '+s.ringing+' ('+(P[k].slot===P[to].slot?s.ring_long:s.ring_short)+')');}});
 say(from+' '+s.call+' '+to);
}
function answer(k){
 if(P[k].st!=='ringing'||!call)return;
 const s=DATA[lang].s;
 P[k].st='talking';P[call.a].st='talking';
 [call.b,nb(call.b)].forEach(x=>{if(x!==k&&P[x].st==='ringing')P[x].st='idle';});
 call.answered=true;call.by=k;say(k+': '+s.answer+' → '+call.a+' ⇄ '+k);
}
function hang(k){
 if(call&&(k===call.a||k===call.by||(!call.answered&&P[k].st==='ringing'))){
  for(const x in P){if(['talking','listening','calling','ringing','busy'].includes(P[x].st)&&(x===call.a||x===call.b||x===call.by||x===nb(call.b)||x===nb(call.a)))P[x].st='idle';}
  call=null;say(k+': '+DATA[lang].s.hangup);return;}
 P[k].st='idle';
}
function drawDemo(){
 const s=DATA[lang].s,host=$('lines');host.innerHTML='';
 [1,2].forEach(n=>{
  const box=document.createElement('div');box.className='line';box.innerHTML='<h4>'+s.line+' '+n+'</h4>';
  Object.keys(P).filter(k=>P[k].line===n).forEach(k=>{
   const p=P[k],d=document.createElement('div');d.className='phone '+p.st;
   const stTxt={idle:s.idle,ringing:s.ringing,talking:s.talking,busy:s.busy,listening:s.hears,calling:s.call+'…'}[p.st];
   d.innerHTML='<b>'+k+'</b><span class="st">'+stTxt+'</span><div class="row"></div>';
   const row=d.querySelector('.row');
   const add=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{f();drawDemo();drawLog();};row.appendChild(b);};
   if(p.st==='idle'){Object.keys(P).filter(x=>x!==k).forEach(x=>add('→ '+x,()=>doCall(k,x)));
    if(P[nb(k)].st==='talking')add(s.listen,()=>doCall(k,k));}
   if(p.st==='ringing')add(s.answer,()=>answer(k));
   if(p.st!=='idle')add(s.hangup,()=>hang(k));
   box.appendChild(d);
  });host.appendChild(box);
 });
}
function drawLog(){const l=$('log');l.textContent=logs.join('\n');l.scrollTop=l.scrollHeight;}
$('reset').onclick=()=>{reset();drawDemo();drawLog();};
/* ---- render ---- */
function render(){
 const d=DATA[lang],s=d.s;
 document.documentElement.lang=lang;document.title='CUPLAJ — '+d.tag;
 $('hero').textContent=s.hero;$('sub').textContent=s.sub;$('tag').textContent=d.tag;$('ver').textContent=d.ver;
 $('get').textContent=s.get;$('repo').textContent=s.repo;$('intro').innerHTML=md(d.intro);
 $('h_demo').textContent=s.demo;$('demo_hint').textContent=s.demo_hint;$('h_log').textContent=s.log;$('reset').textContent=s.reset;
 $('h_feat').textContent=d.h_feat;$('h_eras').textContent=d.h_eras;$('h_party').textContent=d.h_party;$('h_quick').textContent=d.h_quick;
 $('h_status').textContent=d.h_status;$('h_priv').textContent=d.h_priv;$('h_docs').textContent=d.h_docs;$('h_support').textContent=d.h_support;
 $('feat').innerHTML=d.feat.map(x=>'<div class="card">'+md(x)+'</div>').join('');
 $('eras').innerHTML=d.eras.map(x=>'<div class="card">'+md(x)+'</div>').join('');
 $('party').innerHTML=d.party.map(x=>'<li>'+md(x)+'</li>').join('');
 $('quick').innerHTML=d.quick.map(x=>'<li>'+md(x)+'</li>').join('');
 $('status').innerHTML=md(d.status);$('priv').innerHTML=md(d.priv);$('lic').textContent=d.lic;
 const g=lang==='en'?'GUIDE.md':'GUIDE.'+lang+'.md',R='https://github.com/chiuta/CUPLAJ/blob/main/';
 $('docs').innerHTML='<li><a href="'+R+'docs/'+g+'">'+esc(d.docs.guide)+'</a></li><li><a href="'+R+'docs/PROTOCOL.md">'+esc(d.docs.protocol)+' (EN)</a></li><li><a href="'+R+'docs/AUDIT.md">'+esc(d.docs.audit)+' (EN)</a></li><li><a href="'+R+'CHANGELOG.md">'+esc(d.docs.changelog)+' (EN)</a></li>';
 $('coffee').textContent=s.coffee+' ☕';
 [...bar.children].forEach(b=>b.style.borderColor=b.textContent.toLowerCase()===lang?'#b5452f':'');
