<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="color-scheme" content="dark">
<title>CUPLAJ</title>
<meta name="description" content="Party-line telephony for immersive theatre — Android and iPhone, offline, 8 languages.">
<link rel="icon" href="logo.svg">
<style>
:root{--bg:#14110f;--card:#1e1915;--ink:#e8d9b8;--dim:#a39883;--acc:#b5452f;--ok:#2e7d4f;--red:#a33a32;--fs:1}
*{box-sizing:border-box}
html{scroll-behavior:smooth;font-size:calc(16px*var(--fs))}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.55}
a{color:#e0a26a}
header.top{position:sticky;top:0;z-index:5;background:#14110fee;backdrop-filter:blur(6px);border-bottom:1px solid #2b2620;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.5rem 1rem}
header.top .brand{font-weight:bold;letter-spacing:.2em;margin-right:auto}
select,button{font:inherit;color:var(--ink);background:#2b2f36;border:1px solid #3a3f47;border-radius:8px;padding:.35rem .7rem;cursor:pointer}
button:hover{border-color:var(--acc)}
.hero{text-align:center;padding:4rem 1rem 2rem;max-width:56rem;margin:0 auto}
.hero img{width:150px;height:150px}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);margin:.4rem 0}
.hero p{color:var(--dim);font-size:1.15rem}
.cta{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin:1.4rem 0}
.cta a{background:var(--acc);color:#fff;text-decoration:none;padding:.7rem 1.3rem;border-radius:10px}
.cta a.alt{background:#2b2f36}
main{max-width:60rem;margin:0 auto;padding:0 1rem 4rem}
h2{border-bottom:1px solid #2b2620;padding-bottom:.3rem;margin-top:2.6rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}
.card{background:var(--card);border:1px solid #2b2620;border-radius:12px;padding:1rem}
code{background:#2b2f36;padding:.05rem .35rem;border-radius:4px;font-size:.9em}
ol,ul{padding-left:1.3rem}
.demo{background:var(--card);border:1px solid #2b2620;border-radius:14px;padding:1rem}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:600px){.lines{grid-template-columns:1fr}}
.line{border:1px dashed #5a5246;border-radius:12px;padding:.6rem}
.line h4{margin:.1rem 0 .5rem;color:var(--dim);font-weight:normal}
.phone{background:#2b2f36;border-radius:10px;padding:.6rem;margin:.4rem 0;border-left:6px solid #555}
.phone.ringing{border-color:#e0a26a;animation:pulse 1s infinite}
.phone.talking{border-color:var(--ok)}
.phone.listening{border-color:#4a7fb0}
.phone.busy{border-color:var(--red)}
@keyframes pulse{50%{background:#3b3328}}
@media(prefers-reduced-motion:reduce){.phone.ringing{animation:none}}
.phone b{font-size:1.1em}
.phone .st{color:var(--dim);margin-left:.4rem}
.phone .row{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.4rem}
.phone .row button{padding:.2rem .5rem;font-size:.85rem}
#log{background:#0e0c0a;border-radius:8px;padding:.6rem;min-height:5rem;max-height:12rem;overflow:auto;font-family:monospace;font-size:.85rem;color:#c9bb98}
footer{text-align:center;color:var(--dim);padding:2rem 1rem 4rem}
#up{position:fixed;right:14px;bottom:14px;width:48px;height:48px;border-radius:50%;display:none;font-size:1.3rem}
.langbar{display:flex;gap:.3rem;flex-wrap:wrap}

/* ---- v1.8 presentation ---- */
:root{--gold:#e7b866;--wine:#6e1f1b;--wine2:#3a0f0e}
body{background:radial-gradient(1200px 600px at 50% -10%,#3a0f0e 0%,#14110f 60%) fixed,#14110f}
.hero{position:relative;overflow:hidden;max-width:none;padding:6.5rem 1rem 3rem}
.hero>*{position:relative;z-index:1}
.curtain{position:absolute;top:0;bottom:0;width:18%;z-index:0;opacity:.9;background:repeating-linear-gradient(90deg,#5a1713 0 14px,#7c2620 14px 30px,#4a110e 30px 44px);filter:saturate(1.1)}
.curtain.l{left:0;border-radius:0 0 90% 0/0 0 40% 0;box-shadow:inset -30px 0 40px #0008}
.curtain.r{right:0;border-radius:0 0 0 90%/0 0 0 40%;box-shadow:inset 30px 0 40px #0008}
@media(max-width:700px){.curtain{width:9%}}
.ringer{position:relative;width:150px;height:150px;margin:0 auto}
.ringer img{position:relative;z-index:2;width:150px;height:150px;animation:shake 2.4s infinite}
.ringer i{position:absolute;inset:0;border:2px solid var(--gold);border-radius:50%;opacity:0;animation:ring 2.4s infinite}
.ringer i:nth-child(2){animation-delay:.4s}.ringer i:nth-child(3){animation-delay:.8s}
@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@keyframes shake{0%,40%,100%{transform:rotate(0)}5%,15%,25%,35%{transform:rotate(-6deg)}10%,20%,30%{transform:rotate(6deg)}}
@media(prefers-reduced-motion:reduce){.ringer i,.ringer img{animation:none}}
.hero h1{background:linear-gradient(90deg,#f6dca0,#e7b866,#f6dca0);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em}
.cta a{box-shadow:0 6px 24px #b5452f55;transition:transform .15s}.cta a:hover{transform:translateY(-2px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:1rem;max-width:56rem;margin:2rem auto 0;text-align:center}
.stat b{display:block;font-size:2.4rem;color:var(--gold);line-height:1}
.stat span{color:var(--dim);font-size:.9rem}
.who{max-width:64rem;margin:0 auto;padding:1rem}
.who h2{border:0;text-align:center;font-size:clamp(1.6rem,4vw,2.4rem);margin:2rem 0 .2rem}
.who>p.sub{text-align:center;color:var(--dim);margin:0 0 1.2rem}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.6rem;margin-bottom:1rem}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.8rem .4rem;border-radius:14px;background:#211a16;border:1px solid #3a2f28;font-size:.95rem;transition:all .15s}
.tabs button .ic{font-size:1.8rem}
.tabs button[aria-selected=true]{background:linear-gradient(160deg,var(--wine),var(--wine2));border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.panel{display:grid;grid-template-columns:minmax(14rem,18rem) 1fr;gap:1.6rem;align-items:start;background:linear-gradient(160deg,#241b17,#17120f);border:1px solid #3a2f28;border-radius:18px;padding:1.6rem}
@media(max-width:760px){.panel{grid-template-columns:1fr}}
.mock{margin:0 auto;width:15rem;border-radius:2rem;padding:.7rem;background:#0b0908;border:2px solid #4a3d33;box-shadow:0 20px 50px #000a}
.mock .scr{border-radius:1.4rem;min-height:23rem;padding:1.1rem .9rem;background:linear-gradient(180deg,#2a1d18,#120d0b);display:flex;flex-direction:column;gap:.7rem;text-align:center;color:var(--ink)}
.mock .bar{display:flex;justify-content:space-between;font-size:.7rem;color:var(--dim)}
.mock .big{margin:auto 0;font-size:1.25rem;line-height:1.3;color:#fff;text-shadow:0 0 18px var(--gold)}
.mock .chip2{display:inline-block;background:#2b2f36;border-radius:999px;padding:.2rem .7rem;font-size:.75rem}
.mock .btn2{background:var(--acc);border-radius:999px;padding:.55rem;font-size:.9rem;color:#fff}
.mock.code .big{font-family:monospace;font-size:.95rem;color:var(--gold);word-break:break-all}
.pitch h3{margin:.1rem 0;font-size:1.7rem;color:var(--gold)}
.pitch .tag{font-style:italic;color:var(--dim);margin:0 0 .6rem}
.pitch h4{margin:1.1rem 0 .4rem;color:var(--dim);font-weight:normal;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem}
.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:.5rem}
.steps li{counter-increment:s;position:relative;padding-left:2.2rem}
.steps li:before{content:counter(s);position:absolute;left:0;top:.05rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--wine);border:1px solid var(--gold);display:grid;place-items:center;font-size:.8rem;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chips span{background:#2b2218;border:1px solid #5a4630;color:var(--gold);padding:.25rem .8rem;border-radius:999px;font-size:.9rem}
.honest{max-width:48rem;margin:1.2rem auto 0;text-align:center;color:var(--dim);font-size:.9rem}
.glink{display:inline-block;margin-top:1rem}
@media(max-width:700px){header.top{position:static}}
@media print{.curtain,.ringer i,#up,header.top{display:none}body{background:#fff;color:#000}}

/* ---- v1.9 responsive polish: phone, tablet, desktop ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:4.2rem}
body{overflow-x:hidden;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
img,svg{max-width:100%;height:auto}
p,li,.card,.pitch{overflow-wrap:break-word}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
button,select,.cta a{min-height:44px}
header.top{padding-top:max(.5rem,env(safe-area-inset-top))}
header.top .langbar button{padding:.3rem .65rem;min-width:44px}
#up{right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));min-height:48px}
.cta a{display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.25}
.cta a.primary{background:linear-gradient(160deg,#d0553b,var(--acc));box-shadow:0 8px 28px #b5452f88;font-weight:bold}
.cta a.alt{border:1px solid #3a3f47}
#sitenav{display:none}
/* phones */
@media(max-width:700px){
 html{scroll-padding-top:.5rem}
 header.top{gap:.4rem;padding:.4rem .6rem}
 header.top .brand{flex:1 0 100%;margin:0;letter-spacing:.3em}
 .langbar{flex:1 1 auto;gap:.25rem}
 header.top .langbar button{padding:.3rem .2rem;min-width:0;flex:1 1 0;font-size:.85rem}
 header.top>span[role=group]{display:flex;gap:.25rem}
 .hero{padding:3.2rem .9rem 2rem}
 .curtain{display:none}
 .ringer,.ringer img{width:110px;height:110px}
 .hero h1{font-size:clamp(1.9rem,9vw,2.6rem)}
 .hero p{font-size:1.02rem}
 .cta{flex-direction:column;align-items:stretch;gap:.6rem;max-width:26rem;margin-left:auto;margin-right:auto}
 .cta a{padding:.8rem 1rem}
 .stats{grid-template-columns:repeat(2,1fr);gap:.8rem}
 .stat b{font-size:2rem}
 .tabs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:.5rem;padding-bottom:.4rem;margin-left:-.2rem;margin-right:-.2rem;-webkit-overflow-scrolling:touch}
 .tabs button{flex:0 0 7.2rem;scroll-snap-align:start}
 .panel{padding:1rem;gap:1rem;border-radius:14px}
 .mock{width:min(15rem,70vw)}
 .mock .scr{min-height:19rem}
 .pitch h3{font-size:1.4rem}
 .who h2{margin-top:1.4rem}
 main{padding:0 .8rem 3rem}
 h2{margin-top:2rem;font-size:1.35rem}
 .grid{grid-template-columns:1fr}
 .phone .row button{min-height:40px;padding:.3rem .7rem}
 #log{max-height:9rem}
 footer{padding-bottom:5rem}
}
/* tablets */
@media(min-width:701px) and (max-width:1099px){
 .hero{padding:5rem 2rem 2.5rem}
 main,.who{padding-left:1.5rem;padding-right:1.5rem}
 .tabs{grid-template-columns:repeat(4,1fr)}
 .panel{grid-template-columns:minmax(13rem,15rem) 1fr;gap:1.4rem}
 .grid{grid-template-columns:repeat(2,1fr)}
}
/* desktop */
@media(min-width:1100px){
 header.top{padding:.5rem max(1.5rem,calc((100vw - 72rem)/2))}
 #sitenav{display:flex;gap:1.1rem;font-size:.9rem;margin:0 1rem;flex-wrap:wrap}
 #sitenav a{color:var(--dim);text-decoration:none;padding:.3rem 0;border-bottom:2px solid transparent}
 #sitenav a:hover{color:var(--gold);border-color:var(--gold)}
 .hero{padding:7rem 2rem 3.5rem}
 .hero h1{font-size:3.8rem}
 .curtain{width:14%}
 .hero p{font-size:1.25rem}
 .hero #sub,.hero #tag{max-width:46rem;margin-left:auto;margin-right:auto}
 .who{max-width:72rem}
 main{max-width:68rem}
 .panel{grid-template-columns:19rem 1fr;gap:2.4rem;padding:2.2rem}
 .mock{position:sticky;top:5rem}
 .grid{grid-template-columns:repeat(3,1fr)}
 #eras.grid{grid-template-columns:repeat(2,1fr)}
 .cta a{padding:.8rem 1.6rem;font-size:1.05rem}
}
@media(min-width:1700px){html{font-size:calc(18px*var(--fs))}}
@media(hover:none){.cta a:hover{transform:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cta a{transition:none}}

/* ---- media: screens and clips ---- */
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem}
.shots figure{margin:0;background:var(--card);border:1px solid #2b2620;border-radius:16px;padding:.6rem;text-align:center}
.shots img{width:100%;border-radius:12px;display:block;aspect-ratio:39/47;object-fit:cover;object-position:top;background:#0b0908}
.clips{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1.2rem}
.clips figure{margin:0;background:var(--card);border:1px solid #2b2620;border-radius:16px;padding:.6rem}
.clips video{width:100%;aspect-ratio:39/70;border-radius:12px;background:#0b0908;display:block}
figcaption{font-size:.9rem;color:var(--dim);margin-top:.5rem}
figcaption b{color:var(--gold);display:block}
.mnote{color:var(--dim);font-size:.9rem;text-align:center}
@media(max-width:700px){.shots{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:.7rem;-webkit-overflow-scrolling:touch}.shots figure{flex:0 0 62%;scroll-snap-align:start}.clips{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:.8rem}.clips figure{flex:0 0 72%;scroll-snap-align:start}}
@media(min-width:1100px){.clips{grid-template-columns:repeat(4,1fr)}.shots{grid-template-columns:repeat(6,1fr)}}

.cs{width:100%;border-radius:12px;display:block;margin:0 0 .7rem;aspect-ratio:39/47;object-fit:cover;object-position:top;background:#0b0908;border:1px solid #2b2620}
#dg{display:grid;gap:1.4rem;margin:1rem 0 1.4rem;grid-template-columns:minmax(0,1fr)}
#dg>*{min-width:0}
.dgc{background:var(--card);border:1px solid #2b2620;border-radius:14px;padding:1rem}
.dgc h3{margin:.1rem 0 .7rem;font-size:1.05rem;color:var(--gold)}
.mx{width:100%;border-collapse:collapse;font-size:.92rem;min-width:30rem}
.mx th{font-weight:normal;color:var(--dim);font-size:.8rem;text-align:center;padding:.3rem .4rem;border-bottom:1px solid #3a2f28}
.mx th:first-child,.mx td:first-child{text-align:left}
.mx td{padding:.45rem .4rem;border-bottom:1px solid #2b2620;text-align:center}
.mx td.k{font-size:1.15rem}
.k-y{color:#5fc08a}.k-p{color:#e0a26a}.k-n{color:#d9604f}.k-x{color:#6b6459}
.mxw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;margin-top:.7rem;font-size:.85rem;color:var(--dim)}
.ladder{display:grid;gap:.5rem}
.rung{display:flex;align-items:center;gap:.7rem;padding:.55rem .8rem;border-radius:10px;border:1px solid #3a2f28;background:#1a1512}
.rung i{font-style:normal;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font:bold .85rem sans-serif;background:#2b2f36;color:var(--dim)}
.rung.done{border-color:#2e7d4f;background:#15261c}.rung.done i{background:#2e7d4f;color:#fff}
.rung.todo{border-style:dashed;border-color:#a33a32;background:#241513}.rung.todo i{background:#a33a32;color:#fff}
</style>
</head>
<body>
<header class="top">
 <span class="brand">CUPLAJ</span>
 <nav id="sitenav" aria-label="Sections"></nav>
 <span class="langbar" id="langbar" role="group" aria-label="Language"></span>
 <span role="group" aria-label="Aa"><button id="fm" aria-label="A−">A−</button><button id="fp" aria-label="A+">A+</button></span>
</header>
<div class="hero">
 <div class="curtain l" aria-hidden="true"></div><div class="curtain r" aria-hidden="true"></div>
 <div class="ringer" aria-hidden="true"><i></i><i></i><i></i><img src="logo.svg" alt=""></div>
 <h1 id="hero"></h1>
 <p id="sub"></p>
 <p id="tag" style="font-style:italic"></p>
 <div class="cta"><a id="get" href="https://github.com/chiuta/CUPLAJ/releases/download/v1.9.1/CUPLAJ-1.9.1.apk"></a><a id="getios" href="https://github.com/chiuta/CUPLAJ/releases/download/v1.9.1/CUPLAJ-1.9.1-ios-unsigned.ipa"></a><a id="rel" class="alt" href="https://github.com/chiuta/CUPLAJ/releases"></a><a id="repo" class="alt" href="https://github.com/chiuta/CUPLAJ"></a></div>
 <small id="ver" style="color:var(--dim)"></small>
 <p id="iosnote" style="color:var(--dim);font-size:.9rem;margin:.4rem auto 0;max-width:42rem"></p>
 <p id="plat" style="color:var(--dim);font-size:.95rem;margin:.6rem auto 0;max-width:42rem"></p>
 <div class="stats" id="stats"></div>
</div>
<section class="who" aria-labelledby="h_who">
 <h2 id="h_who"></h2><p class="sub" id="who_sub"></p>
 <div class="tabs" role="tablist" id="tabs"></div>
 <div class="panel" role="tabpanel" id="panel"></div>
 <p class="honest" id="honest"></p>
</section>
<main>
 <p id="intro"></p>
 <h2 id="h_demo"></h2>
 <div class="demo">
  <p id="demo_hint" style="color:var(--dim);margin-top:0"></p>
  <div class="lines" id="lines"></div>
  <h4 id="h_log" style="margin:.8rem 0 .3rem"></h4>
  <div id="log" aria-live="polite"></div>
  <p><button id="reset"></button></p>
 </div>
 <h2 id="h_shots"></h2><p class="mnote" id="shots_note"></p><div class="shots" id="shots"></div>
 <h2 id="h_clips"></h2><p class="mnote" id="clips_note"></p><div class="clips" id="clips"></div>
 <h2 id="h_feat"></h2><div class="grid" id="feat"></div>
 <h2 id="h_eras"></h2><div class="grid" id="eras"></div>
 <h2 id="h_party"></h2><ol id="party"></ol>
 <p style="text-align:center"><img src="partyline.svg" alt="" style="max-width:100%"></p>
 <h2 id="h_quick"></h2><ol id="quick"></ol>
 <h2 id="h_status"></h2><div id="dg"></div><p id="status"></p>
 <h2 id="h_priv"></h2><p id="priv"></p>
 <h2 id="h_docs"></h2><ul id="docs"></ul>
 <h2 id="h_support"></h2><p><a href="https://buymeacoffee.com/echo.of.the.strings" id="coffee"></a></p>
</main>
<footer><span id="lic"></span> · v1.9.0</footer>
<button id="up" aria-label="↑">▲</button>
<script>
const DATA={"en": {"name": "English", "tag": "Party-line telephony for immersive theatre", "ver": "Version: 1.9.0 · Last update: 2026-11-25", "intro": "CUPLAJ turns a fleet of ordinary Android phones into a private telephone exchange for immersive theatre. Organisers and actors talk to spectators (and to each other) over the venue's local Wi‑Fi — no cloud, no accounts, no ads. Its signature feature is the *cuplaj*: the shared **party line** of fixed telephones from the 1980s to about 2006, where two subscribers shared one line, rang with different cadences, and could overhear each other.", "h_feat": "Features", "feat": ["**Three telephone eras** — 1985 rotary dial (audible pulses), 1995 keypad (DTMF tones), 2003 mobile (SMS, 160 characters). The control can switch the era live.", "**Party line (cuplaj)** — two phones share one line; a call to one rings both with the called subscriber's cadence; the neighbour who picks up first takes the call; lifting the handset during a neighbour's call lets you listen in, and even break in.", "**No infrastructure** — one phone (the control) is the hub. Others join via Wi‑Fi or the hub's hotspot; hubs are found automatically; optional room code and PIN.", "**Voice** — real calls (8 kHz), push‑to‑talk public address from the control, backstage channel for the crew.", "**Cues** — full‑screen text, vibration, ring, flash, loudspeaker, era change, new contact, spoken voice (local text‑to‑speech), sound effects, black screen, phantom call.", "**Script** — a cue list with GO and PLAY (timed), reorder, import/export as JSON.", "**Control tools** — numbers, groups, couple/uncouple, automatic pairs, silent monitor, mute, forget, battery levels, event log, state that survives restarts, rate limiting.", "**8 languages and accessibility** — English, Romanian, French, Italian, Spanish, Portuguese, German, Hungarian; adjustable text size; answer from the lock screen; keeps running in the background.", "**Internet and mobile data (1.1)** — connect with `host` or `host:port`; optional AES‑128‑GCM network key; automatic G.711 compression off the local network; keepalive.", "**Direct P2P calls (1.1)** — audio goes phone‑to‑phone over UDP with hole punching, falling back to the hub relay; the control can set it off, local‑only (default) or anywhere.", "**VoIP / SIP gateway (1.1)** — the control phone registers with a SIP provider or PBX; the crew dials `0`+number to call out, incoming SIP calls ring an internal number.", "**Mobile network (1.1)** — SMS gateway through the control phone's SIM (send and receive), a *real call* cue that opens the dialler, and a Wi‑Fi / mobile indicator.", "**More ways to connect (1.2)** — Bluetooth (no router, about 7 phones), Wi‑Fi Direct (the control phone makes its own Wi‑Fi network) and mDNS discovery, in addition to Wi‑Fi, hotspot, USB tethering, Ethernet and mobile data.", "**Plug and play (1.3)** — the control phone opens every fitting link by itself; other phones tap *Find and join automatically*, or tap an invitation link. Adds Wi‑Fi Aware.", "**Hardened and cut off from the network (1.4)** — a hostile‑audience audit with fixes, and CUPLAJ‑AIR: three original protocols that carry cues and invitations with no network at all (torch → camera, speaker → microphone, vibration → accelerometer).", "**Show control (1.5)** — cues that fire at one shared instant, a PANIC cue, full‑screen colour cues, audience polls, delivery confirmation and a hardware PTT key. Compared with Unity Intercom, Zello, Augmented Theatre, QLab/SOLOstudio and Livecube in `docs/COMPARISON.md`.", "**Everything from the comparison that fits an Android‑only, offline app (1.6)** — PA priority (ducking), OSC in and out for lighting and sound desks, and image, video and audio‑clip cues sent through the hub.", "**Smart show (1.7)** — zones that follow the audience by sound, rules (\"when someone enters zone 3, send them…\"), a crowd meter, voice effects, captions, multilingual and personalised text, story branching.", "**Stage tools (1.8)** — Art‑Net/DMX lights, MIDI, cue waves, whispering game, split secret, ghost tape, house‑lights safety cue, Morse by vibration, post‑show report.", "**iPhone and iPad** — a full client and host (Control) in Swift, same protocol as Android, so both mix freely in one show; build from source with Xcode (`ios/`)."], "h_quick": "Quick start", "quick": ["Get the APK from the *Actions* tab (artifact `CUPLAJ-apk`) or the *Releases* page and install it on every phone.", "On the control phone, start the hotspot (or put all phones on the same Wi‑Fi).", "On the control phone choose **Control** → *Start the hub*. Note the PIN for actors and, optionally, a room code.", "On the other phones choose **Spectator** or **Actor**, pick the hub from the list (or type its address), and connect.", "Every phone gets a number (control 100, actors 201…, spectators 6 digits). Lift the handset and call."], "h_eras": "Eras: three in the app, three imagined", "eras": ["**1985 · rotary** — a round dial you really turn; the pulses are audible; two long rings.", "**1995 · keypad** — DTMF tones, notebook of numbers, pager messages.", "**2003 · mobile** — names in the contact list, caller ID, SMS limited to 160 characters.", "**2025 · smartphone** — *concept, not in the app yet.* Chat bubbles, voice notes, read receipts and push notifications; always connected, nothing rings for long.", "**2045 · wearables** — *imagined.* No handset: calls whispered into earbuds, faces as floating labels in glasses, a nod to answer.", "**2080 · shared mind** — *imagined.* No device at all: the party line becomes a thought you overhear, and privacy is the plot."], "h_party": "How the party line works", "party": ["Two phones are *coupled* by the control (or automatically in pairs). They share line N, slots 1 and 2.", "A call to subscriber 1 rings both phones; subscriber 1 hears the cadence of their own number (one long ring), subscriber 2 hears the other (two short rings).", "Whoever answers takes the call; the other phone stops ringing.", "While the line is in use, the neighbour who lifts the handset hears the conversation and a faint click is heard by the parties.", "A listener may *break in* and speak; a call to a coupled phone whose line is busy gets the busy tone.", "The control can monitor any line silently (no click)."], "h_docs": "Documentation", "docs": {"guide": "User guide", "protocol": "Protocol", "audit": "Adversarial audit", "changelog": "Changelog", "site": "Presentation site"}, "h_status": "Honest status", "status": "The hub logic (calls, party line, permissions, limits, persistence) is covered by more than 250 automated checks that run on a JVM. The Android user interface and audio path have been type‑checked against the Android 14 SDK but **not yet tested on physical devices**; the APK is built by GitHub Actions. Test with a handful of phones before a show. Traffic on the local network is not encrypted (the PIN and room code keep honest strangers out, they are not cryptography). Version 1.1 networking (encryption, P2P, SIP, SMS) is covered by hub tests against a simulated SIP server, but has **not** been tried on real operators, NATs or SIM cards. Bluetooth, Wi‑Fi Direct and mDNS links (1.2) share the same transport layer, tested on the JVM with simulated channels, but have **not** been tried on real devices; behaviour differs between phone makers. Plug and play (auto‑join, invitations, Wi‑Fi Aware, 1.3) is **not** tested on devices; the invitation format is covered by JVM tests. The 1.4 audit fixes and the AIR codecs are covered by JVM tests (simulated noise, clock drift, wrong key, interference); the torch, camera, microphone, speaker, motor and accelerometer code is **not** tested on real phones, and real‑world range and speed will differ. The 1.5 features are covered by JVM tests (clock estimation, delays, poll rules, photosensitive limits); the screen overlays, headset‑button handling and real clock accuracy on phones are **not** tested on devices. The 1.6 features are covered by JVM tests (ducking curve, OSC parser fuzzing and flooding, file transfer integrity and path safety, hub relay); playing images, video and clips, the file picker and the settings dialogs are **not** tested on devices. Zones, rules, meter, voice effects and languages are covered by JVM tests (rule engine, hub rules, meter aggregation, voice filters measured by frequency); real sound beacons indoors, the microphone and accelerometer measurements and the voice quality on phones are **not** tested on devices. A recorded beacon can be replayed once per sequence number, so zones are for atmosphere, not for security. Art‑Net packets, DMX fades, MIDI messages, Morse patterns, the report and the hub logic for waves, whispering game, split secret and report are covered by JVM tests; the ghost tape, real lighting desks and MIDI devices, and everything on real phones are not tested. **iOS:** the Swift core is tested on macOS in CI and the app builds for the simulator, but it has **not been tried on real iPhones or against a real SIP provider**.", "h_priv": "Privacy", "priv": "No analytics, no servers, no accounts. Audio and messages travel only inside your local network, between the phones and the hub. The hub keeps numbers, groups and couplings on the control phone so a restart does not lose them.", "h_support": "Support the project", "h_lic": "Licence", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "User guide", "s": {"hero": "The party line, back on the stage.", "sub": "A private telephone exchange for immersive theatre, made of the phones your audience already carries.", "get": "Get the APK", "repo": "Source on GitHub", "demo": "Try the party line", "demo_hint": "Phones A1 and A2 share line 1; B1 and B2 share line 2.", "call": "calls", "answer": "Answer", "hangup": "Hang up", "listen": "Listen in", "intervene": "Break in", "idle": "idle", "ringing": "ringing", "talking": "talking", "busy": "busy tone", "hears": "listening", "click": "*click*", "ring_long": "one long ring", "ring_short": "two short rings", "log": "Log", "reset": "Reset", "line": "line", "eras": "Three eras", "coffee": "Buy me a coffee", "rights": "MIT licence", "plat": "Android app (APK) · iPhone/iPad app built from source with Xcode — same protocol, they mix in one show.", "get_ios": "Download for iPhone/iPad (.ipa)", "all_rel": "All releases", "ios_dl": "The .ipa is unsigned: install it with AltStore or Sideloadly using your Apple ID (a free ID lasts 7 days), or build it with Xcode. Android: download the APK.", "m_shots": "Screens", "m_note": "Illustrations drawn from the app's own concepts and layout. They are not captures from a physical phone.", "m_clips": "Feature demos", "m_sc": ["Spectator: incoming call", "Actor: lines and script", "Control: cues, meter, lines", "Script: cue list", "CUPLAJ-AIR: no network", "Poll: live result"], "m_cl": [["Party line", "A1 calls B1; B1 rings long, its line-mate B2 short; A2 listens in; control cuts in."], ["Cues", "Ring, whisper, blackout and sound cues reach every phone."], ["CUPLAJ-AIR", "Light, sound and vibration carry a cue with no network."], ["Polls", "The audience votes and the control phone sees the result live."]], "dg": {"t1": "What has really been verified", "cols": ["Automated tests", "Builds", "Real phones"], "leg": ["Done", "Partly (formats, packets or simulated channels only)", "Not done"], "rows": ["Hub logic: calls, party line, limits", "Android screens and audio", "Network: encryption, P2P, SIP, SMS", "Bluetooth, Wi‑Fi Direct, mDNS", "Plug and play, invitations", "CUPLAJ‑AIR: light, sound, vibration", "Show control (1.5)", "Media, OSC, public address (1.6)", "Zones, rules, meter (1.7)", "Art‑Net, MIDI, audience games (1.8)", "iPhone and iPad app"], "t2": "How far each step has gone", "steps": ["Code written", "Automated tests pass (JVM and macOS)", "Builds on CI (APK, iOS simulator)", "Release published (APK, unsigned IPA)", "Tried on a handful of real phones", "Rehearsal and live show"]}, "review": "Honest review and comparison"}, "roles": [["🎭", "Spectators", "Your phone becomes a 1980s telephone.", "You install nothing but one app, create no account and give nobody your data. The show rings you, whispers to you, sends you a letter on screen — and lets you call the stranger next to you.", ["Join with one tap on an invitation link — it can even reach you by light or sound.", "Choose your era: rotary dial, keypad or early mobile.", "Answer the phone when it rings — cadences tell you who it is for.", "Vote, whisper, solve secrets with the people around you."], ["No account", "8 languages", "Big text, lock‑screen answer"], "“Don't look behind you.”"], ["🎬", "Actors", "A private line to the crew, in your pocket.", "Join with the crew PIN, get a 2xx number and hear the backstage channel while you stay in character. Call spectators, be called, and receive prompts only you can hear.", ["Enter the PIN once; the control phone knows you by name.", "Hear backstage cues through the speaker or a spoken prompt.", "Call any spectator by number — as a character, an old friend, a stranger.", "Listen to the public address and the crew without leaving the scene."], ["Crew PIN", "Backstage channel", "Spoken prompts"], "Backstage: “Door in 10 s.”"], ["🎛️", "Host / Admin (Regie)", "One phone runs the whole exchange.", "The control phone is the hub and the stage manager. Start it, share the PIN, and conduct: numbers, groups, a script with GO, rules that react to the audience, a crowd meter and a live report.", ["Start the hub on a hotspot, Wi‑Fi, Bluetooth or Wi‑Fi Direct.", "Couple spectators on shared party lines, or listen in silently.", "Fire cues at one shared instant, in waves, or by rules and zones.", "Press PANIC or house lights; export the post‑show report."], ["Script + GO", "Rules & zones", "PANIC"], "GO ▶  cue 12 · 213 online"], ["🔧", "Technical crew", "It speaks lighting and sound desk.", "Connect CUPLAJ to the rig you already own: OSC in and out for desks, Art‑Net / DMX for lights, MIDI for sound, and when the host speaks over the public address, other sound lowers automatically.", ["Send DMX universes with fades, from a cue line like 0;1=255;2000.", "Trigger cues from your desk over OSC, and echo cues back.", "Send MIDI notes, controllers and MMC to a USB or Bluetooth device.", "Use a SIP gateway or SMS through the control phone's SIM."], ["OSC", "Art‑Net / DMX", "MIDI"], "0;1=255,2-4=128;2000"], ["🏛️", "Organisers & venues", "No cloud, no accounts, no infrastructure.", "Everything runs on the venue's own Wi‑Fi or a hotspot, and cues can still travel by light, sound and vibration if the network drops. You decide what is recorded: nothing, unless you choose a ghost tape or the post‑show report.", ["Install the APK on each phone; open source under the MIT licence.", "Safety built in: a PANIC cue and a white house‑lights screen.", "Accessible: 8 languages, adjustable text size, captions, answer from the lock screen.", "Read the audit and comparison before you commit — they list what is not done."], ["MIT licence", "Offline", "Safety cues"], "Venue Wi‑Fi · no internet needed"], ["🧩", "Developers", "A small, documented protocol.", "Frames are `type|len|payload` over TCP, with per‑connection keys and published limits. The whole thing is tested, audited, and open for you to extend.", ["Read PROTOCOL.md: message types, limits, encryption, CUPLAJ‑AIR packets.", "Run the test suite on any JVM — hub, protocol and AIR codecs included.", "CI builds the APK and the docs on every push.", "Fork it, add a cue kind, send a pull request."], ["PROTOCOL.md", "JVM tests", "Open source"], "type|len|payload"]], "rs": {"who": "Who is it for?", "who_sub": "Pick your place in the show.", "step": "Your night", "gets": "What you get", "guide": "Open the guide", "stats": ["languages", "kinds of cue", "accounts or clouds", "automated checks"], "honest": "Honest note: tested by 250+ automated checks and an adversarial audit, but not yet on a fleet of real phones — do a rehearsal first."}, "kinds": 24, "checks": 250}, "ro": {"name": "Română", "tag": "Telefonie cu cuplaj pentru teatru imersiv", "ver": "Versiune: 1.9.0 · Ultima actualizare: 2026-11-25", "intro": "CUPLAJ transformă o flotă de telefoane Android obișnuite într-o centrală telefonică privată pentru teatrul imersiv. Organizatorii și actorii vorbesc cu spectatorii (și între ei) prin Wi‑Fi-ul local al locației — fără cloud, fără conturi, fără reclame. Funcția lui de bază este *cuplajul*: **linia comună** a telefoanelor fixe din anii '80 până pe la 2006, în care doi abonați împărțeau aceeași linie, sunau cu cadențe diferite și se puteau auzi unul pe altul.", "h_feat": "Funcții", "feat": ["**Trei epoci de telefon** — 1985 disc rotativ (impulsuri audibile), 1995 taste (tonuri DTMF), 2003 mobil (SMS, 160 de caractere). Regia poate schimba epoca în direct.", "**Linie cuplată** — două telefoane împart o linie; un apel către unul sună pe ambele cu cadența abonatului chemat; vecinul care ridică primul preia apelul; dacă ridici receptorul în timpul convorbirii vecinului, asculți și poți chiar interveni.", "**Fără infrastructură** — un telefon (Regia) este hubul. Ceilalți intră prin Wi‑Fi sau prin hotspotul hubului; hubul se găsește automat; cod de cameră și PIN opționale.", "**Voce** — apeluri reale (8 kHz), anunț apasă‑și‑vorbește de la regie, canal backstage pentru echipă.", "**Indicii** — text pe tot ecranul, vibrație, sunet de apel, bliț, difuzor, schimbare de epocă, contact nou, voce vorbită (sinteză locală), efecte sonore, ecran negru, apel fantomă.", "**Scenariu** — listă de indicii cu GO și PLAY (cronometrat), reordonare, import/export JSON.", "**Unelte de regie** — numere, grupuri, cuplare/decuplare, perechi automate, ascultare discretă, mut, uitare, nivel baterie, jurnal de evenimente, stare păstrată la repornire, limitare de flux.", "**8 limbi și accesibilitate** — engleză, română, franceză, italiană, spaniolă, portugheză, germană, maghiară; mărime text reglabilă; răspuns de pe ecranul blocat; rulează în fundal.", "**Internet și date mobile (1.1)** — conectare cu `host` sau `host:port`; cheie de rețea opțională AES‑128‑GCM; compresie G.711 automată în afara rețelei locale; keepalive.", "**Apeluri directe P2P (1.1)** — sunetul merge de la telefon la telefon prin UDP cu hole punching, cu revenire la releul hubului; Regia le poate opri, limita la rețeaua locală (implicit) sau permite oriunde.", "**Poartă VoIP / SIP (1.1)** — telefonul Regiei se înregistrează la un furnizor SIP sau o centrală; echipa formează `0`+număr pentru exterior, apelurile SIP primite sună la un număr intern.", "**Rețea mobilă (1.1)** — poartă SMS prin SIM‑ul telefonului Regiei (trimitere și primire), cue de *apel real* care deschide formatorul și indicator Wi‑Fi / mobil.", "**Mai multe moduri de conectare (1.2)** — Bluetooth (fără router, circa 7 telefoane), Wi‑Fi Direct (telefonul Regiei își face propria rețea Wi‑Fi) și descoperire mDNS, pe lângă Wi‑Fi, hotspot, tethering USB, Ethernet și date mobile.", "**Plug and play (1.3)** — telefonul Regiei deschide singur toate legăturile potrivite; celelalte telefoane apasă *Găsește și alătură‑mă automat* sau ating un link de invitație. Adaugă Wi‑Fi Aware.", "**Întărit și fără rețea (1.4)** — audit cu public ostil, cu remedieri, și CUPLAJ‑AIR: trei protocoale originale care duc replici și invitații fără nicio rețea (lanternă → cameră, difuzor → microfon, vibrație → accelerometru).", "**Control spectacol (1.5)** — replici care pornesc la același moment, replică PANICĂ, culoare pe tot ecranul, sondaje cu publicul, confirmare de livrare și buton PTT hardware. Comparat cu Unity Intercom, Zello, Augmented Theatre, QLab/SOLOstudio și Livecube în `docs/COMPARISON.md`.", "**Tot ce din comparație încape într‑o aplicație doar Android, fără internet (1.6)** — prioritate PA (ducking), OSC intrare și ieșire pentru pupitre de lumini și sunet, și replici cu imagine, video și clip audio trimise prin hub.", "**Spectacol inteligent (1.7)** — zone care urmăresc publicul prin sunet, reguli („când intră cineva în zona 3, trimite‑i…”), contor de public, efecte de voce, subtitrări, text multilingv și personalizat, ramificarea poveștii.", "**Instrumente de scenă (1.8)** — lumini Art‑Net/DMX, MIDI, val de cue‑uri, telefonul fără fir, secret fragmentat, casetofon‑fantomă, cue de siguranță (lumini de sală), Morse prin vibrații, raport după spectacol.", "**iPhone și iPad** — client complet și gazdă (Regie) în Swift, același protocol ca pe Android, deci se amestecă liber în același spectacol; se construiește din sursă cu Xcode (`ios/`)."], "h_quick": "Pornire rapidă", "quick": ["Ia APK-ul din fila *Actions* (artefactul `CUPLAJ-apk`) sau de pe pagina *Releases* și instalează-l pe toate telefoanele.", "Pe telefonul Regiei pornește hotspotul (sau pune toate telefoanele în același Wi‑Fi).", "Pe telefonul Regiei alege **Regie** → *Pornește hubul*. Notează PIN-ul pentru actori și, opțional, un cod de cameră.", "Pe celelalte alege **Spectator** sau **Actor**, selectează hubul din listă (sau scrie adresa lui) și conectează-te.", "Fiecare telefon primește un număr (regia 100, actorii 201…, spectatorii 6 cifre). Ridică receptorul și sună."], "h_eras": "Epoci: trei în aplicație, trei imaginate", "eras": ["**1985 · disc** — un disc rotund pe care îl rotești de-adevăratelea; impulsurile se aud; două sunete lungi de apel.", "**1995 · taste** — tonuri DTMF, carnet cu numere, mesaje de biper.", "**2003 · mobil** — nume în agendă, identificarea apelantului, SMS limitat la 160 de caractere.", "**2025 · smartphone** — *concept, încă nu e în aplicație.* Baloane de chat, mesaje vocale, confirmări de citire și notificări push; mereu conectat, nimic nu sună mult.", "**2045 · dispozitive purtabile** — *imaginat.* Fără telefon: apeluri șoptite în căști, fețe ca etichete plutitoare în ochelari, o înclinare din cap ca să răspunzi.", "**2080 · minte comună** — *imaginat.* Niciun dispozitiv: linia comună devine un gând pe care îl asculți pe furiș, iar intimitatea este intriga."], "h_party": "Cum funcționează cuplajul", "party": ["Două telefoane sunt *cuplate* de regie (sau automat, în perechi). Ele împart linia N, pozițiile 1 și 2.", "Un apel către abonatul 1 sună pe ambele; abonatul 1 aude cadența numărului său (un sunet lung), abonatul 2 pe a sa (două sunete scurte).", "Cine răspunde preia apelul; celălalt telefon încetează să sune.", "Cât timp linia e folosită, vecinul care ridică receptorul aude convorbirea, iar cei care vorbesc aud un mic clic.", "Un ascultător poate *interveni* și vorbi; un apel către un telefon cuplat a cărui linie e ocupată primește ton de ocupat.", "Regia poate monitoriza orice linie discret (fără clic)."], "h_docs": "Documentație", "docs": {"guide": "Ghid de utilizare", "protocol": "Protocol", "audit": "Audit adversarial", "changelog": "Istoric modificări", "site": "Site de prezentare"}, "h_status": "Stadiul real", "status": "Logica hubului (apeluri, cuplaj, permisiuni, limite, persistență) este acoperită de peste 250 de verificări automate care rulează pe JVM. Interfața Android și calea audio au trecut verificarea de tipuri față de SDK-ul Android 14, dar **nu au fost încă testate pe telefoane reale**; APK-ul este construit de GitHub Actions. Încearcă cu câteva telefoane înainte de spectacol. Traficul din rețeaua locală nu este criptat (PIN-ul și codul de cameră țin la distanță străinii de bună-credință, nu sunt criptografie). Rețelistica din versiunea 1.1 (cifrare, P2P, SIP, SMS) e acoperită de teste de hub contra unui server SIP simulat, dar **nu** a fost încercată pe operatori, NAT‑uri sau SIM‑uri reale. Legăturile Bluetooth, Wi‑Fi Direct și mDNS (1.2) folosesc același strat de transport, testat pe JVM cu canale simulate, dar **nu** au fost încercate pe dispozitive reale; comportamentul diferă între producători. Plug and play (conectare automată, invitații, Wi‑Fi Aware, 1.3) **nu** a fost testat pe dispozitive; formatul invitațiilor e acoperit de teste JVM. Remedierile din auditul 1.4 și codecurile AIR sunt acoperite de teste JVM (zgomot simulat, derivă de ceas, cheie greșită, interferență); codul pentru lanternă, cameră, microfon, difuzor, motor și accelerometru **nu** este testat pe telefoane reale, iar raza și viteza reale vor diferi. Funcțiile 1.5 sunt acoperite de teste JVM (estimarea ceasului, întârzieri, regulile sondajului, limitele fotosensibile); suprapunerile de ecran, butonul căștilor și acuratețea reală a ceasului pe telefoane **nu** sunt testate pe dispozitive. Funcțiile 1.6 sunt acoperite de teste JVM (curba de ducking, fuzzing și inundare OSC, integritatea transferului și siguranța căilor, releul hubului); redarea imaginilor, a videoului și a clipurilor, selectorul de fișiere și dialogurile din setări **nu** sunt testate pe dispozitive. Zonele, regulile, contorul, efectele de voce și limbile sunt acoperite de teste JVM (motorul de reguli, regulile hubului, agregarea contorului, filtrele de voce măsurate pe frecvență); semnalele sonore reale în interior, măsurătorile cu microfonul și accelerometrul și calitatea vocii pe telefoane **nu** sunt testate pe dispozitive. Un semnal înregistrat poate fi redat o dată pe număr de secvență, deci zonele sunt pentru atmosferă, nu pentru securitate. Pachetele Art‑Net, tranzițiile DMX, mesajele MIDI, modelele Morse, raportul și logica hubului pentru val, telefonul fără fir, secret și raport sunt acoperite de teste JVM; casetofonul‑fantomă, pupitrele de lumini și dispozitivele MIDI reale și tot ce ține de telefoane reale nu sunt testate. **iOS:** nucleul Swift este testat pe macOS în CI, iar aplicația se construiește pentru simulator, dar **nu a fost încercată pe iPhone‑uri reale sau cu un furnizor SIP real**.", "h_priv": "Confidențialitate", "priv": "Fără statistici, fără servere, fără conturi. Sunetul și mesajele circulă doar în rețeaua locală, între telefoane și hub. Hubul ține numerele, grupurile și cuplajele pe telefonul Regiei, ca o repornire să nu le piardă.", "h_support": "Sprijină proiectul", "h_lic": "Licență", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Ghid de utilizare", "s": {"hero": "Linia comună, înapoi pe scenă.", "sub": "O centrală telefonică privată pentru teatrul imersiv, făcută din telefoanele pe care publicul le are deja în buzunar.", "get": "Descarcă APK-ul", "repo": "Cod sursă pe GitHub", "demo": "Încearcă cuplajul", "demo_hint": "Telefoanele A1 și A2 împart linia 1; B1 și B2 împart linia 2.", "call": "sună", "answer": "Răspunde", "hangup": "Închide", "listen": "Ascultă", "intervene": "Intervine", "idle": "liber", "ringing": "sună", "talking": "vorbește", "busy": "ton ocupat", "hears": "ascultă", "click": "*clic*", "ring_long": "un sunet lung", "ring_short": "două sunete scurte", "log": "Jurnal", "reset": "Resetează", "line": "linia", "eras": "Trei epoci", "coffee": "Cumpără-mi o cafea", "rights": "Licență MIT", "plat": "Aplicație Android (APK) · aplicație iPhone/iPad construită din sursă cu Xcode — același protocol, se amestecă în același spectacol.", "get_ios": "Descarcă pentru iPhone/iPad (.ipa)", "all_rel": "Toate versiunile", "ios_dl": "Fișierul .ipa nu este semnat: instalează-l cu AltStore sau Sideloadly folosind Apple ID-ul tău (un ID gratuit ține 7 zile) sau construiește-l cu Xcode. Android: descarcă APK-ul.", "m_shots": "Ecrane", "m_note": "Ilustrații făcute după conceptele și aranjarea aplicației. Nu sunt capturi de pe un telefon real.", "m_clips": "Demonstrații ale funcțiilor", "m_sc": ["Spectator: apel primit", "Actor: linii și scenariu", "Regie: cue-uri, contor, linii", "Scenariu: lista de cue-uri", "CUPLAJ-AIR: fără rețea", "Sondaj: rezultat live"], "m_cl": [["Linia comună", "A1 îl sună pe B1; B1 sună lung, B2 (de pe aceeași linie) scurt; A2 ascultă; regia intervine."], ["Cue-uri", "Cue-urile de sunat, șoaptă, blackout și sunet ajung pe toate telefoanele."], ["CUPLAJ-AIR", "Lumina, sunetul și vibrația transmit un cue fără rețea."], ["Sondaje", "Publicul votează, iar regia vede rezultatul live."]], "dg": {"t1": "Ce a fost verificat cu adevărat", "cols": ["Teste automate", "Build-uri", "Telefoane reale"], "leg": ["Făcut", "Parțial (doar formate, pachete sau canale simulate)", "Nefăcut"], "rows": ["Logica hubului: apeluri, linie comună, limite", "Ecrane și audio Android", "Rețea: cifrare, P2P, SIP, SMS", "Bluetooth, Wi‑Fi Direct, mDNS", "Plug and play, invitații", "CUPLAJ‑AIR: lumină, sunet, vibrații", "Control de spectacol (1.5)", "Media, OSC, anunțuri (1.6)", "Zone, reguli, contor (1.7)", "Art‑Net, MIDI, jocuri cu publicul (1.8)", "Aplicația iPhone și iPad"], "t2": "Cât de departe a ajuns fiecare pas", "steps": ["Cod scris", "Teste automate trecute (JVM și macOS)", "Build-uri în CI (APK, simulator iOS)", "Release publicat (APK, IPA nesemnat)", "Încercat pe câteva telefoane reale", "Repetiție și spectacol live"]}, "review": "Recenzie onestă și comparație"}, "roles": [["🎭", "Spectatori", "Telefonul tău devine un telefon din anii ’80.", "Instalezi o singură aplicație, nu faci cont și nu dai nimănui datele tale. Spectacolul te sună, îți șoptește, îți trimite o scrisoare pe ecran — și te lasă să suni necunoscutul de lângă tine.", ["Intri cu o atingere pe un link de invitație — poate ajunge la tine chiar prin lumină sau sunet.", "Îți alegi epoca: disc rotativ, tastatură sau primul mobil.", "Răspunzi când sună — cadența îți spune pentru cine e.", "Votezi, șoptești, rezolvi secrete cu cei din jur."], ["Fără cont", "8 limbi", "Text mare, răspuns din ecranul blocat"], "„Nu te uita în spate.”"], ["🎬", "Actori", "O linie privată cu echipa, în buzunar.", "Intri cu PIN‑ul echipei, primești un număr 2xx și auzi canalul din culise fără să ieși din rol. Suni spectatori, ești sunat și primești indicații pe care le auzi doar tu.", ["Introduci PIN‑ul o dată; Regia te cunoaște după nume.", "Auzi cue‑urile din culise pe difuzor sau ca replică vorbită.", "Suni orice spectator după număr — ca personaj, prieten vechi, necunoscut.", "Asculți megafonul și echipa fără să părăsești scena."], ["PIN echipă", "Canal culise", "Indicații vorbite"], "Culise: „Ușa în 10 s.”"], ["🎛️", "Gazdă / Admin (Regia)", "Un singur telefon conduce întreaga centrală.", "Telefonul Regiei este hubul și regizorul de scenă. Îl pornești, dai PIN‑ul și dirijezi: numere, grupuri, un scenariu cu GO, reguli care reacționează la public, un contor de zgomot și un raport live.", ["Pornești hubul pe hotspot, Wi‑Fi, Bluetooth sau Wi‑Fi Direct.", "Cuplezi spectatori pe linii comune sau asculți discret.", "Trimiți cue‑uri la același moment, în val, sau după reguli și zone.", "Apeși PANICĂ sau lumini de sală; exporți raportul de după spectacol."], ["Scenariu + GO", "Reguli și zone", "PANICĂ"], "GO ▶  cue 12 · 213 conectați"], ["🔧", "Echipa tehnică", "Vorbește pe limba pupitrelor de lumini și sunet.", "Conectezi CUPLAJ la aparatura pe care o ai: OSC intrare și ieșire pentru pupitre, Art‑Net / DMX pentru lumini, MIDI pentru sunet, iar când gazda vorbește în megafon, restul sunetului coboară automat.", ["Trimiți universuri DMX cu tranziții, dintr‑o linie de cue ca 0;1=255;2000.", "Declanșezi cue‑uri din pupitru prin OSC și primești ecou.", "Trimiți note MIDI, controlere și MMC la un dispozitiv USB sau Bluetooth.", "Folosești un gateway SIP sau SMS prin cartela telefonului Regiei."], ["OSC", "Art‑Net / DMX", "MIDI"], "0;1=255,2-4=128;2000"], ["🏛️", "Organizatori și săli", "Fără cloud, fără conturi, fără infrastructură.", "Totul merge pe Wi‑Fi‑ul sălii sau pe un hotspot, iar cue‑urile pot ajunge prin lumină, sunet și vibrații chiar dacă rețeaua cade. Tu hotărăști ce se înregistrează: nimic, decât dacă alegi casetofonul‑fantomă sau raportul de după spectacol.", ["Instalezi APK‑ul pe fiecare telefon; cod deschis, licență MIT.", "Siguranță integrată: cue PANICĂ și ecran alb de lumini de sală.", "Accesibilă: 8 limbi, text reglabil, subtitrări, răspuns din ecranul blocat.", "Citește auditul și comparația înainte să te angajezi — spun ce nu e făcut."], ["Licență MIT", "Offline", "Cue‑uri de siguranță"], "Wi‑Fi sală · fără internet"], ["🧩", "Dezvoltatori", "Un protocol mic și documentat.", "Cadre `type|len|payload` peste TCP, chei pe conexiune și limite publicate. Totul e testat, auditat și deschis extinderii.", ["Citește PROTOCOL.md: tipuri de mesaje, limite, criptare, pachete CUPLAJ‑AIR.", "Rulează testele pe orice JVM — hub, protocol și codecuri AIR incluse.", "CI construiește APK‑ul și documentația la fiecare push.", "Fă fork, adaugă un tip de cue, trimite un pull request."], ["PROTOCOL.md", "Teste JVM", "Cod deschis"], "type|len|payload"]], "rs": {"who": "Pentru cine este?", "who_sub": "Alege‑ți locul în spectacol.", "step": "Seara ta", "gets": "Ce primești", "guide": "Deschide ghidul", "stats": ["limbi", "tipuri de cue", "conturi sau cloud", "verificări automate"], "honest": "Notă sinceră: testată prin peste 250 de verificări automate și un audit adversarial, dar încă nu pe o flotă de telefoane reale — fă mai întâi o repetiție."}, "kinds": 24, "checks": 250}, "fr": {"name": "Français", "tag": "Téléphonie à ligne partagée pour le théâtre immersif", "ver": "Version : 1.9.0 · Dernière mise à jour : 2026-11-25", "intro": "CUPLAJ transforme une flotte de téléphones Android ordinaires en central téléphonique privé pour le théâtre immersif. Organisateurs et acteurs parlent aux spectateurs (et entre eux) via le Wi‑Fi local du lieu — sans cloud, sans compte, sans publicité. Sa fonction phare est le *cuplaj* : la **ligne partagée** des téléphones fixes des années 1980 jusqu'à environ 2006, où deux abonnés se partageaient une même ligne, sonnaient avec des cadences différentes et pouvaient s'entendre l'un l'autre.", "h_feat": "Fonctionnalités", "feat": ["**Trois époques de téléphone** — 1985 cadran rotatif (impulsions audibles), 1995 clavier (tonalités DTMF), 2003 mobile (SMS, 160 caractères). La régie peut changer d'époque en direct.", "**Ligne partagée (cuplaj)** — deux téléphones se partagent une ligne ; un appel à l'un fait sonner les deux avec la cadence de l'abonné appelé ; le voisin qui décroche le premier prend l'appel ; décrocher pendant la conversation du voisin permet d'écouter, voire d'intervenir.", "**Aucune infrastructure** — un téléphone (la régie) est le hub. Les autres le rejoignent par Wi‑Fi ou par son point d'accès ; les hubs sont détectés automatiquement ; code de salle et PIN facultatifs.", "**Voix** — vrais appels (8 kHz), annonce push‑to‑talk depuis la régie, canal coulisses pour l'équipe.", "**Indices** — texte plein écran, vibration, sonnerie, flash, haut‑parleur, changement d'époque, nouveau contact, voix parlée (synthèse locale), effets sonores, écran noir, appel fantôme.", "**Scénario** — liste d'indices avec GO et PLAY (minuté), réorganisation, import/export JSON.", "**Outils de régie** — numéros, groupes, couplage/découplage, paires automatiques, écoute discrète, muet, oubli, niveaux de batterie, journal, état conservé après redémarrage, limitation de débit.", "**8 langues et accessibilité** — anglais, roumain, français, italien, espagnol, portugais, allemand, hongrois ; taille de texte réglable ; réponse depuis l'écran verrouillé ; fonctionne en arrière‑plan.", "**Internet et données mobiles (1.1)** — connexion par `hôte` ou `hôte:port` ; clé réseau AES‑128‑GCM facultative ; compression G.711 automatique hors réseau local ; keepalive.", "**Appels directs P2P (1.1)** — l'audio circule de téléphone à téléphone en UDP avec traversée de NAT, avec repli sur le relais du hub ; la régie peut le désactiver, le limiter au réseau local (défaut) ou l'ouvrir partout.", "**Passerelle VoIP / SIP (1.1)** — le téléphone de la régie s'enregistre chez un opérateur SIP ou un PBX ; l'équipe compose `0`+numéro pour sortir, les appels SIP entrants sonnent à un numéro interne.", "**Réseau mobile (1.1)** — passerelle SMS via la SIM du téléphone de la régie (envoi et réception), cue *appel réel* qui ouvre le numéroteur, indicateur Wi‑Fi / mobile.", "**Davantage de modes de connexion (1.2)** — Bluetooth (sans routeur, environ 7 téléphones), Wi‑Fi Direct (le téléphone de la régie crée son propre réseau Wi‑Fi) et découverte mDNS, en plus du Wi‑Fi, du point d'accès, du partage USB, de l'Ethernet et des données mobiles.", "**Plug and play (1.3)** — le téléphone de la régie ouvre seul toutes les liaisons utiles ; les autres touchent *Trouver et rejoindre automatiquement* ou un lien d'invitation. Ajoute Wi‑Fi Aware.", "**Durci et sans réseau (1.4)** — audit face à un public hostile avec corrections, et CUPLAJ‑AIR : trois protocoles originaux qui transportent indices et invitations sans aucun réseau (lampe → caméra, haut‑parleur → micro, vibration → accéléromètre).", "**Régie de spectacle (1.5)** — indices déclenchés au même instant, indice PANIQUE, couleur plein écran, sondages du public, confirmation de livraison et touche PTT matérielle. Comparé à Unity Intercom, Zello, Augmented Theatre, QLab/SOLOstudio et Livecube dans `docs/COMPARISON.md`.", "**Tout ce que la comparaison montrait et qui tient dans une appli Android hors ligne (1.6)** — priorité PA (ducking), OSC en entrée et sortie pour pupitres lumière et son, et indices image, vidéo et clip audio envoyés via le hub.", "**Spectacle intelligent (1.7)** — zones qui suivent le public par le son, règles (« quand quelqu'un entre en zone 3, envoyez‑lui… »), compteur de public, effets de voix, sous‑titres, texte multilingue et personnalisé, ramification de l'histoire.", "**Outils de scène (1.8)** — lumières Art‑Net/DMX, MIDI, vague de signaux, téléphone arabe, secret fragmenté, magnétophone fantôme, signal de sécurité (lumière de salle), Morse par vibrations, rapport de fin de spectacle.", "**iPhone et iPad** — client complet et hôte (régie) en Swift, même protocole qu'Android : les deux se mélangent librement dans un même spectacle ; compilation depuis les sources avec Xcode (`ios/`)."], "h_quick": "Démarrage rapide", "quick": ["Récupérez l'APK dans l'onglet *Actions* (artefact `CUPLAJ-apk`) ou la page *Releases* et installez‑le sur chaque téléphone.", "Sur le téléphone de la régie, activez le point d'accès (ou mettez tous les téléphones sur le même Wi‑Fi).", "Sur le téléphone de la régie, choisissez **Régie** → *Démarrer le hub*. Notez le PIN des acteurs et, si besoin, un code de salle.", "Sur les autres, choisissez **Spectateur** ou **Acteur**, sélectionnez le hub dans la liste (ou saisissez son adresse) et connectez‑vous.", "Chaque téléphone reçoit un numéro (régie 100, acteurs 201…, spectateurs 6 chiffres). Décrochez et appelez."], "h_eras": "Époques : trois dans l'application, trois imaginées", "eras": ["**1985 · cadran** — un vrai cadran qu'on tourne ; les impulsions s'entendent ; deux longues sonneries.", "**1995 · touches** — tonalités DTMF, carnet de numéros, messages de bipeur.", "**2003 · mobile** — noms dans le répertoire, identification de l'appelant, SMS limités à 160 caractères.", "**2025 · smartphone** — *concept, pas encore dans l'application.* Bulles de discussion, messages vocaux, accusés de lecture et notifications push ; toujours connecté, rien ne sonne longtemps.", "**2045 · objets portés** — *imaginé.* Pas de combiné : appels murmurés dans des écouteurs, visages en étiquettes flottantes dans des lunettes, un hochement de tête pour répondre.", "**2080 · esprit partagé** — *imaginé.* Aucun appareil : la ligne partagée devient une pensée qu'on surprend, et l'intimité est l'intrigue."], "h_party": "Comment fonctionne la ligne partagée", "party": ["Deux téléphones sont *couplés* par la régie (ou automatiquement par paires). Ils partagent la ligne N, positions 1 et 2.", "Un appel à l'abonné 1 fait sonner les deux ; l'abonné 1 entend la cadence de son numéro (une longue sonnerie), l'abonné 2 celle du sien (deux courtes).", "Celui qui décroche prend l'appel ; l'autre téléphone cesse de sonner.", "Tant que la ligne est utilisée, le voisin qui décroche entend la conversation et les interlocuteurs entendent un léger clic.", "Un auditeur peut *intervenir* et parler ; un appel vers un téléphone couplé dont la ligne est occupée reçoit la tonalité d'occupation.", "La régie peut surveiller n'importe quelle ligne discrètement (sans clic)."], "h_docs": "Documentation", "docs": {"guide": "Guide d'utilisation", "protocol": "Protocole", "audit": "Audit adversarial", "changelog": "Journal des modifications", "site": "Site de présentation"}, "h_status": "État réel", "status": "La logique du hub (appels, ligne partagée, permissions, limites, persistance) est couverte par plus de 250 vérifications automatiques exécutées sur une JVM. L'interface Android et le chemin audio ont passé le contrôle de types face au SDK Android 14 mais **n'ont pas encore été testés sur de vrais appareils** ; l'APK est construit par GitHub Actions. Testez avec quelques téléphones avant un spectacle. Le trafic du réseau local n'est pas chiffré (le PIN et le code de salle écartent les curieux de bonne foi, ce n'est pas de la cryptographie). Le réseau de la version 1.1 (chiffrement, P2P, SIP, SMS) est couvert par des tests du hub contre un serveur SIP simulé, mais **n'a pas** été essayé sur de vrais opérateurs, NAT ou cartes SIM. Les liaisons Bluetooth, Wi‑Fi Direct et mDNS (1.2) partagent la même couche de transport, testée sur JVM avec des canaux simulés, mais **n'ont pas** été essayées sur de vrais appareils ; le comportement varie selon les fabricants. Le plug and play (connexion auto, invitations, Wi‑Fi Aware, 1.3) **n'a pas** été testé sur appareils ; le format des invitations est couvert par des tests JVM. Les corrections de l'audit 1.4 et les codecs AIR sont couverts par des tests JVM (bruit simulé, dérive d'horloge, mauvaise clé, interférence) ; le code de la lampe, caméra, micro, haut‑parleur, moteur et accéléromètre **n'est pas** testé sur de vrais téléphones, et la portée et la vitesse réelles différeront. Les fonctions 1.5 sont couvertes par des tests JVM (estimation d'horloge, délais, règles du sondage, limites photosensibles) ; les surimpressions d'écran, le bouton du casque et la précision réelle de l'horloge **ne sont pas** testés sur appareils. Les fonctions 1.6 sont couvertes par des tests JVM (courbe de ducking, fuzzing et inondation OSC, intégrité des transferts et sûreté des chemins, relais du hub) ; la lecture des images, vidéos et clips, le sélecteur de fichiers et les boîtes de réglages **ne sont pas** testés sur appareils. Zones, règles, compteur, effets de voix et langues sont couverts par des tests JVM (moteur de règles, règles du hub, agrégation du compteur, filtres de voix mesurés en fréquence) ; les vraies balises sonores en intérieur, les mesures micro et accéléromètre et la qualité de voix sur téléphones **ne sont pas** testées sur appareils. Une balise enregistrée peut être rejouée une fois par numéro de séquence : les zones servent à l'ambiance, pas à la sécurité. Paquets Art‑Net, fondus DMX, messages MIDI, motifs Morse, rapport et logique du hub (vague, téléphone arabe, secret, rapport) sont couverts par des tests JVM ; le magnétophone fantôme, les vraies consoles et appareils MIDI et tout ce qui touche de vrais téléphones ne sont pas testés. **iOS :** le cœur Swift est testé sur macOS en CI et l'application se compile pour le simulateur, mais elle **n'a pas été essayée sur de vrais iPhone ni avec un vrai fournisseur SIP**.", "h_priv": "Confidentialité", "priv": "Aucune statistique, aucun serveur, aucun compte. Le son et les messages ne circulent que dans votre réseau local, entre les téléphones et le hub. Le hub conserve numéros, groupes et couplages sur le téléphone de la régie pour qu'un redémarrage ne les perde pas.", "h_support": "Soutenir le projet", "h_lic": "Licence", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Guide d'utilisation", "s": {"hero": "La ligne partagée, de retour sur scène.", "sub": "Un central téléphonique privé pour le théâtre immersif, fait des téléphones que votre public a déjà en poche.", "get": "Télécharger l'APK", "repo": "Code source sur GitHub", "demo": "Essayez la ligne partagée", "demo_hint": "Les téléphones A1 et A2 partagent la ligne 1 ; B1 et B2 la ligne 2.", "call": "appelle", "answer": "Répondre", "hangup": "Raccrocher", "listen": "Écouter", "intervene": "Intervenir", "idle": "libre", "ringing": "sonne", "talking": "parle", "busy": "tonalité occupé", "hears": "écoute", "click": "*clic*", "ring_long": "une longue sonnerie", "ring_short": "deux courtes sonneries", "log": "Journal", "reset": "Réinitialiser", "line": "ligne", "eras": "Trois époques", "coffee": "Offrez‑moi un café", "rights": "Licence MIT", "plat": "Application Android (APK) · application iPhone/iPad compilée depuis les sources avec Xcode — même protocole, mélange possible dans un même spectacle.", "get_ios": "Télécharger pour iPhone/iPad (.ipa)", "all_rel": "Toutes les versions", "ios_dl": "Le .ipa n'est pas signé : installez-le avec AltStore ou Sideloadly via votre identifiant Apple (un compte gratuit dure 7 jours), ou compilez-le avec Xcode. Android : téléchargez l'APK.", "m_shots": "Écrans", "m_note": "Illustrations dessinées d'après les concepts et la disposition de l'application. Ce ne sont pas des captures d'un vrai téléphone.", "m_clips": "Démonstrations des fonctions", "m_sc": ["Spectateur : appel entrant", "Acteur : lignes et scénario", "Régie : signaux, compteur, lignes", "Scénario : liste de signaux", "CUPLAJ-AIR : sans réseau", "Sondage : résultat en direct"], "m_cl": [["Ligne partagée", "A1 appelle B1 ; B1 sonne long, B2 (même ligne) court ; A2 écoute ; la régie intervient."], ["Signaux", "Les signaux sonnerie, murmure, noir et son atteignent tous les téléphones."], ["CUPLAJ-AIR", "Lumière, son et vibration portent un signal sans réseau."], ["Sondages", "Le public vote, la régie voit le résultat en direct."]], "dg": {"t1": "Ce qui a réellement été vérifié", "cols": ["Tests automatiques", "Compilations", "Vrais téléphones"], "leg": ["Fait", "Partiel (formats, paquets ou canaux simulés seulement)", "Pas fait"], "rows": ["Logique du hub : appels, ligne partagée, limites", "Écrans et audio Android", "Réseau : chiffrement, P2P, SIP, SMS", "Bluetooth, Wi‑Fi Direct, mDNS", "Plug and play, invitations", "CUPLAJ‑AIR : lumière, son, vibration", "Régie de spectacle (1.5)", "Médias, OSC, sonorisation (1.6)", "Zones, règles, compteur (1.7)", "Art‑Net, MIDI, jeux avec le public (1.8)", "Application iPhone et iPad"], "t2": "Où en est chaque étape", "steps": ["Code écrit", "Tests automatiques réussis (JVM et macOS)", "Compilations en CI (APK, simulateur iOS)", "Version publiée (APK, IPA non signé)", "Essai sur quelques vrais téléphones", "Répétition et spectacle en direct"]}, "review": "Revue honnête et comparaison"}, "roles": [["🎭", "Spectateurs", "Votre téléphone devient un téléphone des années 80.", "Vous n'installez qu'une application, ne créez aucun compte et ne donnez vos données à personne. Le spectacle vous appelle, vous chuchote, vous envoie une lettre à l'écran — et vous laisse appeler l'inconnu à côté de vous.", ["Rejoignez d'une touche via un lien d'invitation — il peut même vous parvenir par lumière ou son.", "Choisissez votre époque : cadran, clavier ou premier mobile.", "Décrochez quand ça sonne — la cadence dit à qui l'appel s'adresse.", "Votez, chuchotez, résolvez des secrets avec vos voisins."], ["Sans compte", "8 langues", "Grand texte, réponse écran verrouillé"], "« Ne vous retournez pas. »"], ["🎬", "Comédiens", "Une ligne privée avec l'équipe, dans la poche.", "Rejoignez avec le code PIN de l'équipe, recevez un numéro 2xx et entendez le canal des coulisses sans quitter votre rôle. Appelez des spectateurs, soyez appelés, recevez des indications que vous seul entendez.", ["Entrez le PIN une fois ; la régie vous connaît par votre nom.", "Entendez les signaux des coulisses au haut‑parleur ou en voix parlée.", "Appelez un spectateur par son numéro — en personnage, ami, inconnu.", "Écoutez la sonorisation et l'équipe sans quitter la scène."], ["PIN équipe", "Canal coulisses", "Indications parlées"], "Coulisses : « Porte dans 10 s. »"], ["🎛️", "Hôte / Admin (Régie)", "Un seul téléphone mène tout le central.", "Le téléphone de la régie est le hub et le régisseur. Lancez‑le, donnez le PIN et dirigez : numéros, groupes, un conducteur avec GO, des règles qui réagissent au public, un compteur de bruit et un rapport en direct.", ["Lancez le hub sur point d'accès, Wi‑Fi, Bluetooth ou Wi‑Fi Direct.", "Couplez des spectateurs sur des lignes partagées ou écoutez discrètement.", "Déclenchez des signaux au même instant, en vague, par règles et zones.", "Appuyez sur PANIQUE ou lumière de salle ; exportez le rapport."], ["Conducteur + GO", "Règles et zones", "PANIQUE"], "GO ▶  signal 12 · 213 connectés"], ["🔧", "Équipe technique", "Elle parle console lumière et son.", "Reliez CUPLAJ à votre matériel : OSC entrée et sortie pour les consoles, Art‑Net / DMX pour les lumières, MIDI pour le son, et quand l'hôte parle en sonorisation, les autres sons baissent automatiquement.", ["Envoyez des univers DMX avec fondus, depuis une ligne comme 0;1=255;2000.", "Déclenchez des signaux depuis votre console en OSC, avec écho.", "Envoyez notes MIDI, contrôleurs et MMC à un appareil USB ou Bluetooth.", "Utilisez une passerelle SIP ou SMS via la SIM du téléphone de régie."], ["OSC", "Art‑Net / DMX", "MIDI"], "0;1=255,2-4=128;2000"], ["🏛️", "Organisateurs et lieux", "Pas de cloud, pas de comptes, pas d'infrastructure.", "Tout tourne sur le Wi‑Fi du lieu ou un point d'accès, et les signaux peuvent encore passer par lumière, son et vibration si le réseau tombe. Vous décidez de ce qui est enregistré : rien, sauf si vous choisissez le magnétophone fantôme ou le rapport.", ["Installez l'APK sur chaque téléphone ; code ouvert, licence MIT.", "Sécurité intégrée : signal PANIQUE et écran blanc de salle.", "Accessible : 8 langues, texte réglable, sous‑titres, réponse écran verrouillé.", "Lisez l'audit et la comparaison avant de vous engager — ils disent ce qui manque."], ["Licence MIT", "Hors ligne", "Signaux de sécurité"], "Wi‑Fi du lieu · pas d'internet"], ["🧩", "Développeurs", "Un petit protocole documenté.", "Trames `type|len|payload` sur TCP, clés par connexion et limites publiées. Le tout est testé, audité et ouvert à l'extension.", ["Lisez PROTOCOL.md : messages, limites, chiffrement, paquets CUPLAJ‑AIR.", "Lancez les tests sur toute JVM — hub, protocole et codecs AIR inclus.", "La CI construit l'APK et la doc à chaque push.", "Forkez, ajoutez un type de signal, envoyez une pull request."], ["PROTOCOL.md", "Tests JVM", "Open source"], "type|len|payload"]], "rs": {"who": "Pour qui ?", "who_sub": "Choisissez votre place dans le spectacle.", "step": "Votre soirée", "gets": "Ce que vous obtenez", "guide": "Ouvrir le guide", "stats": ["langues", "types de signal", "comptes ou cloud", "vérifications automatiques"], "honest": "Note honnête : testée par plus de 250 vérifications automatiques et un audit adverse, mais pas encore sur une flotte de vrais téléphones — faites d'abord une répétition."}, "kinds": 24, "checks": 250}, "it": {"name": "Italiano", "tag": "Telefonia a linea condivisa per il teatro immersivo", "ver": "Versione: 1.9.0 · Ultimo aggiornamento: 2026-11-25", "intro": "CUPLAJ trasforma una flotta di normali telefoni Android in una centralina telefonica privata per il teatro immersivo. Organizzatori e attori parlano con gli spettatori (e tra loro) tramite il Wi‑Fi locale del luogo — senza cloud, senza account, senza pubblicità. La sua funzione distintiva è il *cuplaj*: la **linea condivisa** dei telefoni fissi dagli anni '80 fino al 2006 circa, in cui due abbonati dividevano la stessa linea, squillavano con cadenze diverse e potevano ascoltarsi a vicenda.", "h_feat": "Funzioni", "feat": ["**Tre epoche di telefono** — 1985 disco rotante (impulsi udibili), 1995 tastiera (toni DTMF), 2003 cellulare (SMS, 160 caratteri). La regia può cambiare epoca in diretta.", "**Linea condivisa (cuplaj)** — due telefoni dividono una linea; una chiamata a uno fa squillare entrambi con la cadenza dell'abbonato chiamato; il vicino che risponde per primo prende la chiamata; alzando la cornetta durante la conversazione del vicino si ascolta, e si può persino intervenire.", "**Nessuna infrastruttura** — un telefono (la regia) è l'hub. Gli altri entrano via Wi‑Fi o tramite il suo hotspot; gli hub si trovano da soli; codice sala e PIN facoltativi.", "**Voce** — vere chiamate (8 kHz), annuncio push‑to‑talk dalla regia, canale backstage per la squadra.", "**Segnali** — testo a schermo intero, vibrazione, squillo, flash, altoparlante, cambio di epoca, nuovo contatto, voce parlata (sintesi locale), effetti sonori, schermo nero, chiamata fantasma.", "**Copione** — elenco di segnali con GO e PLAY (a tempo), riordino, import/export JSON.", "**Strumenti di regia** — numeri, gruppi, accoppiamento/disaccoppiamento, coppie automatiche, ascolto discreto, muto, dimentica, livelli batteria, registro eventi, stato che sopravvive al riavvio, limitazione del flusso.", "**8 lingue e accessibilità** — inglese, rumeno, francese, italiano, spagnolo, portoghese, tedesco, ungherese; dimensione del testo regolabile; risposta dalla schermata di blocco; funziona in background.", "**Internet e dati mobili (1.1)** — connessione con `host` o `host:porta`; chiave di rete AES‑128‑GCM opzionale; compressione G.711 automatica fuori dalla rete locale; keepalive.", "**Chiamate dirette P2P (1.1)** — l'audio va da telefono a telefono via UDP con hole punching, con ripiego sul relay dell'hub; la regia può disattivarlo, limitarlo alla rete locale (predefinito) o aprirlo ovunque.", "**Gateway VoIP / SIP (1.1)** — il telefono della regia si registra presso un provider SIP o un PBX; la squadra compone `0`+numero per uscire, le chiamate SIP in arrivo squillano a un numero interno.", "**Rete mobile (1.1)** — gateway SMS tramite la SIM del telefono della regia (invio e ricezione), cue *chiamata reale* che apre il tastierino, indicatore Wi‑Fi / mobile.", "**Più modi per collegarsi (1.2)** — Bluetooth (senza router, circa 7 telefoni), Wi‑Fi Direct (il telefono della regia crea una propria rete Wi‑Fi) e scoperta mDNS, oltre a Wi‑Fi, hotspot, tethering USB, Ethernet e dati mobili.", "**Plug and play (1.3)** — il telefono della regia apre da solo tutti i collegamenti utili; gli altri toccano *Trova e unisciti automaticamente* o un link d'invito. Aggiunge Wi‑Fi Aware.", "**Rinforzato e senza rete (1.4)** — audit con pubblico ostile e correzioni, e CUPLAJ‑AIR: tre protocolli originali che trasportano cue e inviti senza alcuna rete (torcia → fotocamera, altoparlante → microfono, vibrazione → accelerometro).", "**Controllo dello spettacolo (1.5)** — cue che scattano nello stesso istante, cue PANICO, colore a schermo intero, sondaggi col pubblico, conferma di consegna e tasto PTT hardware. Confronto con Unity Intercom, Zello, Augmented Theatre, QLab/SOLOstudio e Livecube in `docs/COMPARISON.md`.", "**Tutto ciò che il confronto mostrava e che sta in un'app solo Android offline (1.6)** — priorità PA (ducking), OSC in ingresso e uscita per mixer luci e audio, e cue con immagine, video e clip audio inviati tramite hub.", "**Spettacolo intelligente (1.7)** — zone che seguono il pubblico col suono, regole («quando qualcuno entra nella zona 3, invia…»), contatore del pubblico, effetti voce, sottotitoli, testo multilingue e personalizzato, ramificazione della storia.", "**Strumenti di scena (1.8)** — luci Art‑Net/DMX, MIDI, onda di cue, telefono senza fili, segreto frammentato, registratore fantasma, cue di sicurezza (luci di sala), Morse a vibrazione, rapporto post‑spettacolo.", "**iPhone e iPad** — client completo e host (regia) in Swift, stesso protocollo di Android: i due si mescolano liberamente nello stesso spettacolo; si compila dai sorgenti con Xcode (`ios/`)."], "h_quick": "Avvio rapido", "quick": ["Scarica l'APK dalla scheda *Actions* (artefatto `CUPLAJ-apk`) o dalla pagina *Releases* e installalo su ogni telefono.", "Sul telefono della regia attiva l'hotspot (oppure collega tutti i telefoni allo stesso Wi‑Fi).", "Sul telefono della regia scegli **Regia** → *Avvia l'hub*. Annota il PIN per gli attori e, se vuoi, un codice sala.", "Sugli altri scegli **Spettatore** o **Attore**, seleziona l'hub dall'elenco (o scrivi il suo indirizzo) e connettiti.", "Ogni telefono riceve un numero (regia 100, attori 201…, spettatori 6 cifre). Alza la cornetta e chiama."], "h_eras": "Epoche: tre nell'app, tre immaginate", "eras": ["**1985 · disco** — un vero disco da far girare; gli impulsi si sentono; due squilli lunghi.", "**1995 · tasti** — toni DTMF, rubrica di numeri, messaggi del cercapersone.", "**2003 · cellulare** — nomi in rubrica, identificazione del chiamante, SMS limitati a 160 caratteri.", "**2025 · smartphone** — *concetto, non ancora nell'app.* Fumetti di chat, messaggi vocali, conferme di lettura e notifiche push; sempre connesso, nulla squilla a lungo.", "**2045 · dispositivi indossabili** — *immaginato.* Niente telefono: chiamate sussurrate negli auricolari, volti come etichette fluttuanti negli occhiali, un cenno del capo per rispondere.", "**2080 · mente condivisa** — *immaginato.* Nessun dispositivo: la linea condivisa diventa un pensiero che si origlia, e la riservatezza è la trama."], "h_party": "Come funziona la linea condivisa", "party": ["Due telefoni sono *accoppiati* dalla regia (o automaticamente a coppie). Condividono la linea N, posizioni 1 e 2.", "Una chiamata all'abbonato 1 fa squillare entrambi; l'abbonato 1 sente la cadenza del proprio numero (uno squillo lungo), l'abbonato 2 la sua (due brevi).", "Chi risponde prende la chiamata; l'altro telefono smette di squillare.", "Finché la linea è in uso, il vicino che alza la cornetta sente la conversazione e gli interlocutori sentono un leggero clic.", "Chi ascolta può *intervenire* e parlare; una chiamata a un telefono accoppiato la cui linea è occupata riceve il segnale di occupato.", "La regia può monitorare qualsiasi linea in silenzio (senza clic)."], "h_docs": "Documentazione", "docs": {"guide": "Guida all'uso", "protocol": "Protocollo", "audit": "Audit avversariale", "changelog": "Registro delle modifiche", "site": "Sito di presentazione"}, "h_status": "Stato reale", "status": "La logica dell'hub (chiamate, linea condivisa, permessi, limiti, persistenza) è coperta da oltre 250 verifiche automatiche eseguite su una JVM. L'interfaccia Android e il percorso audio hanno superato il controllo dei tipi rispetto all'SDK Android 14 ma **non sono ancora stati provati su dispositivi reali**; l'APK è costruito da GitHub Actions. Prova con qualche telefono prima dello spettacolo. Il traffico sulla rete locale non è cifrato (PIN e codice sala tengono fuori gli estranei in buona fede, non sono crittografia). La rete della versione 1.1 (cifratura, P2P, SIP, SMS) è coperta da test dell'hub contro un server SIP simulato, ma **non** è stata provata su operatori, NAT o SIM reali. I collegamenti Bluetooth, Wi‑Fi Direct e mDNS (1.2) usano lo stesso livello di trasporto, testato su JVM con canali simulati, ma **non** sono stati provati su dispositivi reali; il comportamento varia tra i produttori. Il plug and play (collegamento automatico, inviti, Wi‑Fi Aware, 1.3) **non** è stato provato su dispositivi; il formato degli inviti è coperto da test JVM. Le correzioni dell'audit 1.4 e i codec AIR sono coperti da test JVM (rumore simulato, deriva di clock, chiave errata, interferenza); il codice per torcia, fotocamera, microfono, altoparlante, motore e accelerometro **non** è testato su telefoni reali, e portata e velocità reali saranno diverse. Le funzioni 1.5 sono coperte da test JVM (stima dell'orologio, ritardi, regole del sondaggio, limiti fotosensibili); le sovrapposizioni dello schermo, il tasto dell'auricolare e la precisione reale dell'orologio **non** sono testati su dispositivi. Le funzioni 1.6 sono coperte da test JVM (curva di ducking, fuzzing e flood OSC, integrità dei trasferimenti e sicurezza dei percorsi, relay dell'hub); riproduzione di immagini, video e clip, selettore di file e finestre delle impostazioni **non** sono testati su dispositivi. Zone, regole, contatore, effetti voce e lingue sono coperti da test JVM (motore di regole, regole dell'hub, aggregazione del contatore, filtri voce misurati in frequenza); i veri segnali sonori al chiuso, le misure con microfono e accelerometro e la qualità della voce sui telefoni **non** sono testati su dispositivi. Un segnale registrato si può riprodurre una volta per numero di sequenza: le zone servono all'atmosfera, non alla sicurezza. Pacchetti Art‑Net, dissolvenze DMX, messaggi MIDI, schemi Morse, rapporto e logica dell'hub (onda, telefono senza fili, segreto, rapporto) sono coperti da test JVM; registratore fantasma, mixer luci e dispositivi MIDI reali e tutto ciò che riguarda telefoni reali non sono testati. **iOS:** il nucleo Swift è testato su macOS in CI e l'app compila per il simulatore, ma **non è stata provata su iPhone reali né con un vero provider SIP**.", "h_priv": "Privacy", "priv": "Nessuna statistica, nessun server, nessun account. Audio e messaggi viaggiano solo nella vostra rete locale, tra i telefoni e l'hub. L'hub conserva numeri, gruppi e accoppiamenti sul telefono della regia, così un riavvio non li perde.", "h_support": "Sostieni il progetto", "h_lic": "Licenza", "lic": "MIT © Alexandru‑Ionuț Chiuță (Alexio).", "g_title": "Guida all'uso", "s": {"hero": "La linea condivisa, di nuovo in scena.", "sub": "Una centralina telefonica privata per il teatro immersivo, fatta con i telefoni che il pubblico ha già in tasca.", "get": "Scarica l'APK", "repo": "Codice sorgente su GitHub", "demo": "Prova la linea condivisa", "demo_hint": "I telefoni A1 e A2 condividono la linea 1; B1 e B2 la linea 2.", "call": "chiama", "answer": "Rispondi", "hangup": "Riaggancia", "listen": "Ascolta", "intervene": "Intervieni", "idle": "libero", "ringing": "squilla", "talking
